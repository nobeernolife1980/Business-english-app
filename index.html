<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biz English Construction 500 - Advanced</title>
    <style>
        :root {
            --deep-blue: #003468; --purpose-blue: #0082C4; --parker-gold: #FDB913;
            --clean-green: #7BBA3E; --charcoal: #1C2B39; --white: #FFFFFF;
            --soft-gray: #F1F5F9; --border-light: #E2E8F0;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #F8FAFC; color: var(--charcoal); margin: 0; display: flex; justify-content: center; }
        .app-container { max-width: 650px; width: 100%; background: var(--white); min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        
        /* Header & Progress Bar */
        .app-header { background: var(--deep-blue); color: white; padding: 15px 25px; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .progress-container { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--parker-gold); width: 0%; transition: width 0.3s; }
        
        .grammar-tag { background: var(--parker-gold); color: var(--deep-blue); padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; }
        .status-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; margin-left: 10px; }
        .status-learned { background: var(--clean-green); color: white; }
        .status-not-learned { background: #94a3b8; color: white; }

        .content { padding: 25px; flex-grow: 1; }
        .section-title { font-size: 0.7rem; font-weight: 700; color: var(--purpose-blue); text-transform: uppercase; margin-bottom: 6px; display: block; }
        .question-card { background: var(--soft-gray); border-left: 6px solid var(--deep-blue); padding: 20px; border-radius: 8px; margin-bottom: 20px; position: relative; }
        
        /* Learned Toggle Button */
        .learned-btn { position: absolute; top: 10px; right: 10px; background: white; border: 1px solid var(--border-light); padding: 5px 10px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; }
        .learned-btn.active { background: var(--clean-green); color: white; border-color: var(--clean-green); }

        .jp-text { font-size: 1.3rem; font-weight: 700; color: var(--deep-blue); line-height: 1.4; padding-right: 60px; }
        .result-area { border-top: 2px solid var(--soft-gray); padding-top: 15px; animation: fadeIn 0.3s ease-out; }
        .model-answer { font-size: 1.25rem; font-weight: 700; color: var(--deep-blue); margin-bottom: 10px; }
        .slash { color: #CBD5E1; margin: 0 3px; }
        
        .advice-card { background: #F0F7FF; border-radius: 10px; padding: 15px; border: 1px solid var(--border-light); margin-top: 15px; }
        
        /* Buttons */
        .controls { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        button { border: none; padding: 16px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .btn-primary { background: var(--deep-blue); color: white; width: 100%; }
        .btn-recording { background: #E74C3C; color: white; animation: pulse 1.5s infinite; }
        .btn-next { background: var(--clean-green); color: white; }
        .btn-random { background: var(--white); color: var(--deep-blue); border: 1px solid var(--deep-blue); padding: 8px; font-size: 0.8rem; }
        .btn-random.active { background: var(--deep-blue); color: white; }
        
        .btn-outline { background: white; border: 1px solid var(--border-light); color: var(--purpose-blue); width: auto; padding: 8px 12px; font-size: 0.8rem; margin-right: 5px; margin-bottom: 5px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="app-container">
    <header class="app-header">
        <div class="header-top">
            <div>
                <span id="grammar-label" class="grammar-tag">Grammar</span>
                <span id="learned-status" class="status-badge">Not Learned</span>
            </div>
            <div id="learned-count" style="font-size: 0.8rem;">Learned: 0 / 500</div>
        </div>
        <div class="progress-container">
            <div id="progress-bar" class="progress-fill"></div>
        </div>
    </header>

    <div class="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span class="section-title">Japanese Prompt</span>
            <button id="random-toggle" class="btn-random">Random: OFF</button>
        </div>
        
        <div class="question-card">
            <button id="mark-learned-btn" class="learned-btn">Check as Learned</button>
            <div id="jp-text" class="jp-text">...</div>
        </div>

        <div id="result-area" class="result-area hidden">
            <span class="section-title">Your Transcription</span>
            <div id="user-speech" style="font-style: italic; margin-bottom: 12px; color: var(--charcoal); font-size: 1rem; padding: 10px; background: #fff; border-radius: 6px; border: 1px solid var(--border-light);"></div>
            <span class="section-title">Model Answer</span>
            <div id="model-answer" class="model-answer"></div>
            <div style="margin-bottom: 15px; display: flex; flex-wrap: wrap;">
                <button class="btn-outline" onclick="playModel(1.0)">🔊 Native</button>
                <button class="btn-outline" onclick="playModel(0.7)">🐢 Slow</button>
                <button class="btn-outline" id="replay-btn">▶ My Voice</button>
            </div>
            <div class="advice-card">
                <div id="feedback-en" style="font-weight:bold; color:#1E40AF;"></div>
                <div id="feedback-jp" style="font-size:0.85rem; margin-bottom:10px;"></div>
                <div style="font-size:0.85rem;"><strong>Tip:</strong> <span id="grammar-point-text"></span></div>
            </div>
        </div>

        <div class="controls">
            <button id="record-btn" class="btn-primary">🎤 Click to Speak</button>
            <button id="next-btn" class="btn-next hidden">Next Task ➔</button>
            <button id="retry-btn" style="background:#f1f5f9; color:#475569;" class="hidden">Try Again</button>
        </div>
    </div>
</div>

<script>
    // --- ここに500問のデータを貼り付けてください ---
    const questions = [
        { id: 1, grammar: "L1: Present Simple", jp: "私はIT企業で働いています。", en: "I work for an IT company", display: "I work / for an IT company", point: "所属は work for を使います。" },
        { id: 2, grammar: "L1: Present Continuous", jp: "彼は今、電話に出ています。", en: "He is on the phone now", display: "He is / on the phone / now", point: "is on the phone で電話中です。" },
        [
{ "grammar": "Be verb (am)", "jp": "私は新しいプロジェクトマネージャーです。", "en": "I am the new project manager", "display": "I am / the new / project manager", "keywords": ["project", "manager"], "point: "I am ...（私は〜です）は自己紹介の基本です。", "alt": "My name is Tanaka, and I am the manager." },
{ "grammar": "Be verb (is)", "jp": "田中さんは今、会議室にいます。", "en": "Mr. Tanaka is in the meeting room now", "display": "Mr. Tanaka / is / in the meeting room / now", "keywords": ["meeting room"], "point": "場所を表す時は is in ... を使います。", "alt": "He is in a meeting at the moment." },
{ "grammar": "Be verb (are)", "jp": "彼らは私たちのクライアントです。", "en": "They are our clients", "display": "They are / our clients", "keywords": ["client"], "point": "複数形 They に合わせて be 動詞は are になります。", "alt": "Those people are our customers." },
{ "grammar": "Be verb (Neg)", "jp": "このファイルは重要ではありません。", "en": "This file is not important", "display": "This file / is not / important", "keywords": ["important"], "point": "be 動詞の後に not を置くと否定文になります。", "alt": "This document is not necessary." },
{ "grammar": "Be verb (Quest)", "jp": "あなたは営業部の所属ですか？", "en": "Are you in the sales department", "display": "Are you / in the sales department", "keywords": ["sales", "department"], "point": "be 動詞を文頭に出すと「〜ですか？」という疑問文になります。", "alt": "Do you work for the sales team?" },
{ "grammar": "Present Simple", "jp": "私はIT企業で働いています。", "en": "I work for an IT company", "display": "I work / for an IT company", "keywords": ["work for"], "point": "習慣や事実を言う時は現在形を使います。所属は work for です。", "alt": "I am an employee of an IT firm." },
{ "grammar": "Present Simple (3rd sing)", "jp": "彼女は英語を上手に話します。", "en": "She speaks English well", "display": "She speaks / English / well", "keywords": ["speaks", "well"], "point": "主語が She の時は動詞に s が付きます。", "alt": "Her English is very good." },
{ "grammar": "Present Simple (3rd sing)", "jp": "私の会社は新宿にあります。", "en": "My company is in Shinjuku", "display": "My company / is / in Shinjuku", "keywords": ["company"], "point": "会社がどこにあるかを示す時も be 動詞が使えます。", "alt": "Our office is located in Shinjuku." },
{ "grammar": "Present Simple (Neg)", "jp": "私はコーヒーを飲みません。", "en": "I do not drink coffee", "display": "I do not / drink coffee", "keywords": ["drink"], "point": "一般動詞の否定は do not (don't) を使います。", "alt": "I don't need any coffee, thank you." },
{ "grammar": "Present Simple (3rd Neg)", "jp": "彼は名刺を持っていません。", "en": "He does not have a business card", "display": "He / does not have / a business card", "keywords": ["business card"], "point": "三人称単数の否定は does not を使い、動詞は原形に戻します。", "alt": "He doesn't have his card with him." },
{ "grammar": "Present Simple (Quest)", "jp": "あなたは名刺を持っていますか？", "en": "Do you have a business card", "display": "Do you have / a business card", "keywords": ["business card"], "point": "Do you ...? は相手に有無や習慣を尋ねる基本です。", "alt": "Could I have your business card?" },
{ "grammar": "Present Simple (Wh-quest)", "jp": "あなたは何時にオフィスに来ますか？", "en": "What time do you come to the office", "display": "What time / do you come / to the office", "keywords": ["what time"], "point": "具体的な時間を聞く時は What time do you ...? を使います。", "alt": "When do you arrive at work?" },
{ "grammar": "Present Simple (Wh-quest)", "jp": "あなたのオフィスはどこにありますか？", "en": "Where is your office", "display": "Where is / your office", "keywords": ["Where"], "point": "場所を聞く時は Where を使います。", "alt": "Where are you located?" },

{ "grammar": "Wh-quest (How)", "jp": "ここへはどうやって来ますか？", "en": "How do you come here", "display": "How / do you come / here", "keywords": ["How"], "point": "手段を聞く時は How を使います。", "alt": "What is your commute like?" },

{ "grammar": "Past Simple (Be)", "jp": "彼らは先週、ロンドンにいました。", "en": "They were in London last week", "display": "They were / in London / last week", "keywords": ["were", "London"], "point": "They の過去の be 動詞は were です。", "alt": "They visited London last week." },
{ "grammar": "Past Simple (Reg)", "jp": "私は昨日、その資料をチェックしました。", "en": "I checked the document yesterday", "display": "I checked / the document / yesterday", "keywords": ["checked"], "point": "規則動詞は後ろに ed を付けて過去を表します。", "alt": "I looked over the files yesterday." },

{ "grammar": "Pronouns (Possessive)", "jp": "これは私の名刺です。", "en": "This is my business card", "display": "This is / my business card", "keywords": ["business card"], "point": "my は「私の」という所有を表します。", "alt": "Here is my card." },

  { "grammar": "L2: Future (will)", "jp": "後ほどメールを差し上げます。", "en": "I will email you later", "display": "I will / email you / later", "keywords": ["will", "later"], "point": "その場で決めた意思や、単純な未来の予測には will を使います。", "alt": "I'll send you an email shortly." },

  { "grammar": "L2: Shall I", "jp": "お手伝いしましょうか？", "en": "Shall I help you", "display": "Shall I / help you", "keywords": ["Shall I"], "point": "Shall I ...? は「（私が）〜しましょうか？」という申し出の表現です。", "alt": "Would you like some help?" },

  { "grammar": "L2: To-Infinitive (Adj)", "jp": "何か言うことはありますか？", "en": "Do you have anything to say", "display": "Do you have / anything / to say", "keywords": ["anything to say"], "point: "anything to say で「言うべきこと（何か）」を修飾します。", "alt": "Is there anything you would like to add?" },

  { "grammar": "L2: Gerund (Subject)", "jp": "ここで働くことは刺激的です。", "en": "Working here is exciting", "display": "Working here / is / exciting", "keywords": ["Working"], "point": "動名詞を主語にして「〜することは」という意味を作ります。", "alt": "I find it exciting to work in this environment." },

  { "grammar": "L2: That clause (Review)", "jp": "締切が明日だと彼は私に言いました。", "en": "He told me that the deadline is tomorrow", "display": "He told me / that / the deadline is tomorrow", "keywords": ["told me that"], "point": "tell + 人 + that節 で「人に〜だと言う」です。", "alt": "I was informed by him that we finish tomorrow." },

  { "grammar": "L3: Present Perfect (Result)", "jp": "彼はもうオフィスを出てしまいました。", "en": "He has already left the office", "display": "He has already / left / the office", "keywords": ["already left"], "point": "「出てしまった（だから今はいない）」という結果を表します。", "alt": "He is gone for the day." },
  { "grammar": "L3: Present Perfect (Duration)", "jp": "どのくらいの期間、日本に住んでいますか？", "en": "How long have you lived in Japan", "display": "How long / have you lived / in Japan", "keywords": ["How long"], "point": "期間を尋ねる時は How long + 現在完了の疑問文を使います。", "alt": "When did you first move to Japan?" },
  { "grammar": "L3: Too ... to", "jp": "この問題は難しすぎて解決できません。", "en": "This problem is too difficult to solve", "display": "This problem / is too difficult / to solve", "keywords": ["too to"], "point": "too [形容詞] to [動詞] で「〜すぎて…できない」という意味になります。", "alt": "This issue is impossible for us to handle." },
  { "grammar": "L3: Enough to", "jp": "彼はそのチームを率いるのに十分な経験があります。", "en": "He is experienced enough to lead the team", "display": "He is / experienced enough / to lead the team", "keywords": ["enough to"], "point": "[形容詞] + enough to [動詞] で「〜するのに十分…だ」となります。", "alt": "His experience is sufficient for a leadership role." },
  { "grammar": "L3: Participle (Adjective)", "jp": "窓のそばで話している男性は私の同僚です。", "en": "The man talking by the window is my colleague", "display": "The man / talking by the window / is my colleague", "keywords": ["talking"], "point": "現在分詞（-ing）を使って、直前の名詞を修飾（後置修飾）します。", "alt": "My coworker is the one speaking over there." },
  { "grammar": "L3: Participle (Passive)", "jp": "これは有名なデザイナーによって作られた椅子です。", "en": "This is a chair made by a famous designer", "display": "This is a chair / made by / a famous designer", "keywords": ["made by"], "point": "過去分詞を使って「〜された名詞」と説明を加えます。", "alt": "A well-known designer created this chair." },
  { "grammar": "L3: Indirect Question (Why)", "jp": "なぜ彼が遅れたのか分かりません。", "en": "I do not know why he was late", "display": "I do not know / why / he was late", "keywords": ["why"], "point": "間接疑問文の why。語順は肯定文 (he was late) です。", "alt": "The reason for his delay is unknown to me." },
  { "grammar": "L3: Relative Pronoun (That)", "jp": "これは彼がずっと探していた資料です。", "en": "This is the document that he was looking for", "display": "This is the document / that / he was looking for", "keywords": ["looking for"], "point": "that は人にも物にも使える便利な関係代名詞です。", "alt": "He's been searching for this specific file." },
  { "grammar": "L3: Passive Voice (Neg)", "jp": "その情報はまだ共有されていません。", "en": "The information is not shared yet", "display": "The information / is not shared / yet", "keywords": ["not shared"], "point": "受動態の否定形。yet（まだ）を添えて未完了を強調します。", "alt": "We haven't distributed that information yet." },
  { "grammar": "L3: Help A (to) Do", "jp": "あなたのプレゼンを手伝いましょうか？", "en": "Shall I help you prepare your presentation", "display": "Shall I / help you / prepare your presentation", "keywords": ["help prepare"], "point": "help + 人 + 動詞の原形で「人が〜するのを助ける」となります。", "alt": "Would you like some assistance with your slides?" },
  { "grammar": "L3: Make A B (Noun)", "jp": "彼らは彼をマネージャーに任命しました。", "en": "They made him a manager", "display": "They made / him / a manager", "keywords": ["made manager"], "point": "make A B で「AをB（役職など）にする」です。", "alt": "He was promoted to the position of manager." },
  { "grammar": "L3: Keep A B", "jp": "机の上を綺麗に保ってください。", "en": "Please keep your desk clean", "display": "Please keep / your desk / clean", "keywords": ["keep clean"], "point": "keep + A + 形容詞 で「Aを〜の状態に保つ」です。", "alt": "Make sure your workspace stays tidy." },
  { "grammar": "L3: Find A B", "jp": "その本はとても役に立つと分かりました。", "en": "I found the book very useful", "display": "I found / the book / very useful", "keywords": ["found useful"], "point": "find + A + 形容詞 で「Aが〜だとわかる（気づく）」です。", "alt": "The book proved to be quite helpful." },
  { "grammar": "L3: Show A How to Do", "jp": "このソフトの使い方を教えていただけますか？", "en": "Could you show me how to use this software", "display": "Could you show me / how to use / this software", "keywords": ["how to use"], "point": "how to + 動詞の原形で「〜のやり方」です。", "alt": "Can you explain the operation of this program?" },
  { "grammar": "L3: Indirect Question (How)", "jp": "彼がどうやって成功したか知りたいです。", "en": "I want to know how he succeeded", "display": "I want to know / how / he succeeded", "keywords": ["how succeeded"], "point": "how S + V で「どのように〜したか」を表します。", "alt": "I'm curious about the secret to his success." },
  { "grammar": "L3: Present Perfect (Neg Review)", "jp": "一度もその場所へ行ったことがありません。", "en": "I have never been to that place", "display": "I have never / been to / that place", "keywords": ["never been"], "point": "never（一度も〜ない）を使った強い否定の経験です。", "alt": "That's a location I've yet to visit." },
  { "grammar": "L3: Relative Pronoun (Whose)", "jp": "名前が思い出せないクライアントがいます。", "en": "I have a client whose name I cannot remember", "display": "I have a client / whose name / I cannot remember", "keywords": ["whose"], "point": "whose + 名詞 で「〜の…である（所有の関係）」を表します。", "alt: "There's a client whose name escapes me." },
  { "grammar": "L3: It is ... that", "jp": "彼が会議に遅れたのは事実です。", "en": "It is true that he was late for the meeting", "display": "It is true / that / he was late / for the meeting", "keywords": ["true that"], "point": "It is [形容詞] that [文章] で「〜であることは事実だ」となります。", "alt": "He was indeed late for the session." },

  { "grammar": "L3: Use to do", "jp": "以前はこの近くで働いていました。", "en": "I used to work near here", "display": "I used to / work / near here", "keywords": ["used to"], "point": "used to で「以前は〜していた（今はしていない）」という過去の習慣を表します。", "alt": "My former office was in this area." },
  { "grammar": "L3: Indirect Question (Whether)", "jp": "彼が会議に来るかどうか分かりません。", "en": "I do not know whether he will come to the meeting", "display": "I do not know / whether / he will come", "keywords": ["whether"], "point": "whether... で「〜かどうか」という意味になります。if でも代用可能です。", "alt": "His attendance at the meeting is still uncertain." },
  { "grammar": "L3: Relative Pronoun (Omission)", "jp": "これは私が昨日買った本です。", "en": "This is the book I bought yesterday", "display": "This is the book / (which) / I bought yesterday", "keywords": ["bought"], "point": "目的語となる関係代名詞（which等）は省略されるのが一般的です。", "alt": "I purchased this book just yesterday." },
  { "grammar": "L3: Present Perfect (Review)", "jp": "ちょうど資料を読み終えました。", "en": "I have just finished reading the document", "display": "I have just / finished / reading the document", "keywords": ["finished reading"], "point": "finish の後は動名詞（reading）が続きます。現在完了との組み合わせです。", "alt": "I'm done reviewing the file." },
  { "grammar": "L3: Tell A B (Omission of that)", "jp": "彼はそのニュースは本当だと言いました。", "en": "He told me the news was true", "display": "He told me / (that) / the news was true", "keywords": ["told me"], "point": "tell + 人 + (that) + 文 の that はよく省略されます。", "alt": "He confirmed the truth of the news to me." },
  { "grammar": "L3: Suggest that", "jp": "明日話し合うことを提案します。", "en": "I suggest that we talk tomorrow", "display": "I suggest / that / we talk tomorrow", "keywords": ["suggest"], "point": "suggest that ... で「〜することを提案する」です。", "alt": "How about we have a discussion tomorrow?" },
  { "grammar": "L3: Tag Question", "jp": "あなたはマネージャーですよね？", "en": "You are a manager, aren't you", "display": "You are a manager, / aren't you", "keywords": ["aren't you"], "point": "文末に付け加える「〜ですよね？」という付加疑問文です。", "alt": "You hold a managerial position, don't you?" },
  { "grammar": "L3: Present Perfect (Continuation Review)", "jp": "私たちは長い間、お互いを知っています。", "en": "We have known each other for a long time", "display": "We have known / each other / for a long time", "keywords": ["known each other"], "point": "know（知っている）は状態を表す動詞なので、現在完了形で継続を表します。", "alt": "We are long-time acquaintances." }

  { "grammar": "L3: Relative Pronoun (Whose)", "jp": "私は名前を知らない人と話をしました。", "en": "I talked to a person whose name I did not know", "display": "I talked to a person / whose name / I did not know", "keywords": ["whose"], "point": "whose は所有を表す関係代名詞で、「〜の名前が…である人」という構造を作ります。", "alt": "I spoke with someone whose name escapes me." },
  { "grammar": "L3: Relative Pronoun (Omission)", "jp": "これが、彼が昨日見つけた答えです。", "en": "This is the answer he found yesterday", "display": "This is the answer / (that) / he found yesterday", "keywords": ["found"], "point": "目的格の関係代名詞（ここでは the answer の後の that）は省略されるのが一般的です。", "alt": "He came up with this solution yesterday." },

  { "grammar": "L3: Help A (to) Do", "jp": "あなたが仕事を終わらせるのを手伝いましょう。", "en": "I will help you finish your work", "display": "I will help you / finish / your work", "keywords": ["help you finish"], "point": "help + 人 + (to) + 動詞の原形。ビジネスでは to を省略するのが非常に一般的です。", "alt": "I'd be happy to assist you with your tasks." },
  { "grammar": "L3: Let A Do", "jp": "私にスケジュールを調整させてください。", "en": "Please let me adjust the schedule", "display": "Please let me / adjust / the schedule", "keywords": ["let me"], "point": "let + 人 + 動詞の原形。「私に〜させてください」という、申し出や許可の定番です。", "alt": "Allow me to rearrange the timetable." },

  { "grammar": "L3: It is ... for A to", "jp": "私たちがこのチャンスを逃さないことが重要です。", "en": "It is important for us not to miss this chance", "display": "It is important for us / not to miss / this chance", "keywords": ["not to miss"], "point": "不定詞の否定形は not to [動詞] です。 miss a chance は「機会を逃す」。", "alt": "We must make sure to seize this opportunity." },
  { "grammar": "L3: Participle (Active)", "jp": "あちらで電話をしている女性を知っていますか？", "en": "Do you know the woman talking on the phone over there", "display": "Do you know the woman / talking on the phone / over there", "keywords": ["talking"], "point": "現在分詞 talking が直前の woman を後ろから修飾しています。", "alt": "Who is that lady on the phone?" },

  { "grammar": "L3: Indirect Question (Whether)", "jp": "彼が契約を承諾するかどうか教えてください。", "en": "Please let me know whether he will accept the contract", "display": "Please let me know / whether / he will accept", "keywords": ["whether"], "point": "whether... は「〜かどうか」という意味です。accept（受け入れる／承諾する）。", "alt": "Tell me if he's going to sign the agreement." },

  { "grammar": "L3: Present Perfect (Completion)", "jp": "私はちょうど会議を終えたところです。", "en": "I have just finished the meeting", "display": "I have just / finished / the meeting", "keywords": ["just finished"], "point": "finish（終える）の直後の状態を表します。", "alt": "I've just wrapped up the session." },

  { "grammar": "L3: Tag Question", "jp": "あなたは田中さんですよね？", "en": "You are Mr. Tanaka, aren't you", "display": "You are Mr. Tanaka, / aren't you", "keywords": ["aren't you"], "point": "相手に確認を求める付加疑問文です。", "alt": "Mr. Tanaka, I presume?" },
  { "grammar": "L3: Present Perfect (Neg)", "jp": "まだ何の連絡も受けていません。", "en": "I have not heard anything yet", "display": "I have not heard / anything / yet", "keywords": ["heard", "yet"], "point": "hear from... で「〜から連絡がある」ですが、hear anything で「何も聞いていない」となります。", "alt": "There hasn't been any update so far." },
  { "grammar": "L3: Relative Pronoun (That)", "jp": "これは先週話していた課題です。", "en": "This is the issue that we talked about last week", "display": "This is the issue / that / we talked about last week", "keywords": ["issue"], "point": "issue（課題・問題点）を関係代名詞で修飾しています。", "alt": "This is the topic from our last week's discussion." },
  { "grammar": "L3: Indirect Question (How)", "jp": "彼がどうやって成功したか知りたいです。", "en": "I want to know how he succeeded", "display": "I want to know / how / he succeeded", "keywords": ["how succeeded"], "point": "succeed は動詞で「成功する」です。", "alt": "I'm curious about the key to his success." },
  { "grammar": "L3: Passive (Neg)", "jp": "そのニュースはまだ発表されていません。", "en": "The news is not announced yet", "display": "The news / is not announced / yet", "keywords": ["not announced"], "point": "announce（発表する）の受動態否定形です。", "alt": "The information hasn't been released yet." },
  { "grammar": "L3: Make A B (Adjective)", "jp": "このツールは仕事を効率的にします。", "en": "This tool makes our work efficient", "display": "This tool / makes our work / efficient", "keywords": ["makes efficient"], "point": "make A B。efficient は「効率的な」というビジネス必須形容詞です。", "alt": "Our productivity increases with this tool." },
  { "grammar": "L3: Help A (to) Do", "jp": "その問題を解決するのを手伝ってください。", "en": "Please help me solve the problem", "display": "Please / help me / solve / the problem", "keywords": ["help solve"], "point: "help + 人 + 動詞の原形 の基本構成です。", "alt": "Could you assist me in resolving this issue?" },
  { "grammar": "L3: Show A How to Do", "jp": "このアプリの使い方を教えてください。", "en": "Please show me how to use this app", "display": "Please show me / how to use / this app", "keywords": ["how to use"], "point": "how to + 動詞の原形で「〜の仕方」となります。", "alt": "Could you demonstrate the use of this application?" },
  { "grammar": "L3: Present Perfect (Result)", "jp": "彼はもう外出してしまいました。", "en": "He has already gone out", "display": "He has already / gone out", "keywords": ["already gone"], "point": "「行ってしまった（だから今はいない）」という結果にフォーカスした表現です。", "alt": "He is out of the office at the moment." },
  { "grammar": "L3: Relative Pronoun (Who)", "jp": "中国語を話せる人はいますか？", "en": "Is there anyone who can speak Chinese", "display": "Is there anyone / who / can speak Chinese", "keywords": ["who"], "point": "anyone（誰か）を関係代名詞 who で詳しく説明しています。", "alt": "Do we have a Chinese speaker here?" },
  { "grammar": "L3: It is ... for A to", "jp": "あなたが期限を守ることは可能です。", "en": "It is possible for you to meet the deadline", "display": "It is possible for you / to meet / the deadline", "keywords": ["meet the deadline"], "point": "meet the deadline（締切を守る）はセットで覚えましょう。", "alt": "You can definitely finish it by the due date." },
  { "grammar": "L3: Indirect Question (Where)", "jp": "彼がどこに住んでいるか知っていますか？", "en": "Do you know where he lives", "display": "Do you know / where / he lives", "keywords": ["where he lives"], "point": "lives の三単現の s を忘れないように注意しましょう。", "alt": "Are you aware of his home address?" },
  { "grammar": "L3: Perception Verb (Hear)", "jp": "彼が大きな声で笑うのを聞きました。", "en": "I heard him laugh loudly", "display": "I heard him / laugh / loudly", "keywords": ["heard laugh"], "point": "hear + 人 + 動詞の原形 です。", "alt": "His loud laughter reached my ears." },
  { "grammar": "L3: Causative (Have)", "jp": "秘書にスケジュールを確認させます。", "en": "I will have my secretary check the schedule", "display": "I will have / my secretary / check / the schedule", "keywords": ["have check"], "point": "have + 人 + 動詞の原形で「（仕事として）人に〜してもらう」という意味になります。", "alt": "I'll ask my assistant to look over the timetable." },
  { "grammar": "L3: Passive (By)", "jp": "この企画は田中さんによって提案されました。", "en": "This project was proposed by Mr. Tanaka", "display": "This project / was proposed / by Mr. Tanaka", "keywords": ["proposed by"], "point": "propose（提案する）の過去分詞形を使います。", "alt": "Mr. Tanaka is the one who came up with this plan." },
  { "grammar": "L3: Present Perfect (Review)", "jp": "私はここで長い間働いています。", "en": "I have worked here for a long time", "display": "I have worked / here / for a long time", "keywords": ["for a long time"], "point": "現在完了の継続用法です。", "alt": "My tenure at this company is quite long." },
  { "grammar": "L3: So ... that", "jp": "彼はとても親切なので、みんな彼が好きです。", "en": "He is so kind that everyone likes him", "display": "He is so kind / that / everyone likes him", "keywords": ["so kind that"], "point": "原因（so kind）と結果（that everyone likes him）を繋ぎます。", "alt": "His kindness makes him popular with everyone." },
  { "grammar": "L3: Too ... to (Review)", "jp": "今日は暑すぎて外に出られません。", "en": "It is too hot to go out today", "display": "It is / too hot / to go out / today", "keywords": ["too hot to"], "point": "天候を表す it を主語にした too ... to 構文です。", "alt": "The heat today is preventing us from heading outside." }
[
  { "grammar": "L3: Present Perfect (Completion)", "jp": "予算案の作成をちょうど終えたところです。", "en": "I have just finished preparing the budget proposal", "display: "I have just / finished / preparing / the budget proposal", "keywords": ["budget", "proposal"], "point": "have just + 過去分詞に加え、finish + 動名詞(-ing)を組み合わせた実戦的な文です。", "alt": "The budget draft is finally ready." },
  { "grammar": "L3: Present Perfect (Experience)", "jp": "以前、同様のトラブルを経験したことがあります。", "en": "I have experienced a similar trouble before", "display": "I have experienced / a similar trouble / before", "keywords": ["experienced", "similar"], "point": "have + 過去分詞の経験用法です。similar（似たような）はビジネス頻出語です。", "alt": "I've dealt with this kind of issue in the past." },
  { "grammar": "L3: Present Perfect (Duration)", "jp": "この会社は20年間、この業界でトップです。", "en": "This company has been the leader in this industry for twenty years", "display": "This company / has been / the leader / in this industry / for twenty years", "keywords": ["industry", "leader"], "point": "has been で「ずっと〜である」という状態の継続を表します。", "alt": "We have led this market for two decades." },
  { "grammar": "L3: Present Perfect Continuous", "jp": "午後からずっと次の戦略について考えています。", "en": "I have been thinking about the next strategy since afternoon", "display": "I have been thinking / about the next strategy / since afternoon", "keywords": ["strategy", "thinking"], "point": "have been -ing で「（今も）ずっと考え続けている」という継続を強調します。", "alt": "I've been focusing on our future plans all afternoon." },
  { "grammar": "L3: Passive Voice (Present)", "jp": "これらのガイドラインは全従業員に適用されます。", "en": "These guidelines are applied to all employees", "display": "These guidelines / are applied / to all employees", "keywords": ["guidelines", "applied"], "point": "apply to ... で「〜に適用される」という受動態です。", "alt": "Everyone in the company must follow these rules." },
  { "grammar": "L3: Passive Voice (with Modals)", "jp": "そのミスは二度と繰り返されるべきではありません。", "en": "The mistake should not be repeated again", "display": "The mistake / should not / be repeated / again", "keywords": ["repeated", "should not"], "point": "should + be + 過去分詞で「〜されるべきだ」という強い助言・義務です。", "alt": "We must ensure this error doesn't happen twice." },
  { "grammar": "L3: Passive Voice (Future)", "jp": "最終決定は金曜日に下される予定です。", "en": "The final decision will be made on Friday", "display": "The final decision / will be made / on Friday", "keywords": ["final", "decision"], "point": "make a decision（決定を下す）の受動態 will be made です。", "alt": "We'll have the final answer by Friday." },
  { "grammar": "L3: Indirect Question (Whether)", "jp": "彼がオファーを受けるかどうか確信が持てません。", "en": "I am not sure whether he will accept the offer", "display": "I am not sure / whether / he will accept / the offer", "keywords": ["whether", "accept"], "point": "whether...（〜かどうか）を使った間接疑問文です。accept は「受け入れる」。", "alt": "It's uncertain if he'll say yes to the proposal." },
  { "grammar": "L3: Indirect Question (Wh-)", "jp": "なぜそのプロジェクトが失敗したのか教えてください。", "en": "Please tell me why the project failed", "display": "Please tell me / why / the project failed", "keywords": ["why", "failed"], "point": "why の後の語順が肯定文（the project failed）になるのがポイントです。", "alt": "Could you explain the reasons for the project's failure?" },
  { "grammar": "L3: Relative Pronoun (Who)", "jp": "交渉が得意な上司がいます。", "en": "I have a boss who is good at negotiating", "display": "I have a boss / who / is good at negotiating", "keywords": ["negotiating"], "point": "関係代名詞 who が主語の働きをして、上司を詳しく説明しています。", "alt": "My manager is an excellent negotiator." },
  { "grammar": "L3: Relative Pronoun (Which/That)", "jp": "これは私が昨日会議で話した計画です。", "en": "This is the plan which I talked about in the meeting yesterday", "display": "This is the plan / which / I talked about / yesterday", "keywords": ["talked about"], "point": "which節の中で talked about の後の目的語が欠けている「目的格」の形です。", "alt": "Here is the proposal I mentioned yesterday." },
  { "grammar": "L3: Relative Pronoun (Whose)", "jp": "私は、歴史が非常に長い会社で働いています。", "en": "I work for a company whose history is very long", "display": "I work for a company / whose history / is / very long", "keywords": ["whose", "history"], "point": "whose + 名詞 で「〜の歴史が…な会社」という所有を表します。", "alt": "My company has a long-standing tradition." },
  { "grammar": "L3: Relative Pronoun (Omission)", "jp": "これは彼らが一番必要としている情報です。", "en": "This is the information they need most", "display": "This is the information / (that) / they need most", "keywords": ["information", "need"], "point": "目的語になる関係代名詞 that/which はビジネスでは省略されることが多いです。", "alt": "This is their highest priority information." },
  { "grammar": "L3: SVOC (Make)", "jp": "その効率的なツールは私たちの仕事を楽にしました。", "en": "The efficient tool made our work easy", "display": "The efficient tool / made / our work / easy", "keywords": ["efficient", "easy"], "point": "make + O + C で「OをCの状態にする」。ビジネス効率化の定番表現です。", "alt": "Our work became easier thanks to that tool." },
  { "grammar": "L3: SVOC (Keep)", "jp": "顧客情報を安全に保つことが不可欠です。", "en": "It is essential to keep customer information safe", "display": "It is essential / to keep / customer information / safe", "keywords": ["essential", "safe"], "point": "It is ... to 構文の中に keep O C が入った高度な形です。", "alt": "Ensuring client data security is a must." },
  { "grammar": "L3: SVOC (Find)", "jp": "彼はその新しい市場が非常に有望だと分かりました。", "en": "He found the new market very promising", "display": "He found / the new market / very promising", "keywords": ["promising"], "point": "find O C で「OがCだと気づく／分かる」。promising は「将来有望な」。", "alt": "The new market seemed very attractive to him." },
  { "grammar": "L3: Tell/Ask A to do", "jp": "彼にそのデータを再確認するように頼みました。", "en": "I asked him to double-check the data", "display": "I asked him / to double-check / the data", "keywords": ["asked to", "double-check"], "point": "ask + 人 + to [動詞] で依頼を表します。double-check はよく使われます。", "alt": "I requested a re-evaluation of the data from him." },
  { "grammar": "L3: Want A to do", "jp": "あなたに私たちのチームに加わってほしいです。", "en": "I want you to join our team", "display": "I want you / to join / our team", "keywords": ["want you to"], "point: "ビジネスでは I'd like you to... が一般的ですが、意思を伝える際は want も使います。", "alt": "We would be honored to have you on our team." },
  { "grammar": "L3: It is ... for A to", "jp": "会社がリスクを取ることは必要です。", "en": "It is necessary for the company to take risks", "display": "It is necessary / for the company / to take risks", "keywords": ["necessary", "risks"], "point": "It is ... for A to [動詞] で、主体の A を明示します。", "alt": "Taking risks is a necessity for the firm." },
  { "grammar": "L3: Too ... to", "jp": "その案件は複雑すぎて、今すぐには説明できません。", "en": "The matter is too complex to explain right now", "display": "The matter / is / too complex / to explain / right now", "keywords": ["complex"], "point": "too ... to で「〜すぎて…できない」。complex（複雑な）を強調します。", "alt": "The issue's complexity prevents an immediate explanation." },
  { "grammar": "L3: Enough to", "jp": "その製品は世界中で売れるのに十分な品質があります。", "en": "The product has enough quality to be sold worldwide", "display": "The product / has / enough quality / to be sold / worldwide", "keywords": ["worldwide"], "point": "enough + 名詞 + to [動詞] の形です。be sold（売られる）という受動態が続いています。", "alt": "The product quality is high enough for global sales." },
  { "grammar": "L3: So ... that", "jp": "そのプレゼンは非常に分かりやすかったので、誰もが理解できました。", "en": "The presentation was so clear that everyone could understand it", "display": "The presentation / was so clear / that / everyone could understand / it", "keywords": ["so clear that"], "point": "so ... that ... で「非常に〜だったので…だ」という因果関係を作ります。", "alt": "The clarity of the presentation ensured full understanding." },
  { "grammar": "L3: Help A (to) Do", "jp": "このソフトはあなたが時間を節約するのを助けます。", "en": "This software helps you save time", "display": "This software / helps you / save / time", "keywords": ["save time"], "point": "help + 人 + 動詞の原形。「〜するのを手伝う／助ける」です。", "alt": "Using this tool will save you a lot of time." },
  { "grammar": "L3: Let A Do", "jp": "私にあなたの計画について話させてください。", "en": "Let me talk about your plan", "display": "Let me / talk about / your plan", "keywords": ["Let me"], "point": "let + 人 + 動詞の原形。「私に〜させて」という申し出です。", "alt": "Allow me to discuss the details of your proposal." },
  { "grammar": "L3: Suggest that S V", "jp": "もう一度、契約書を見直すことを提案します。", "en": "I suggest that we review the contract again", "display": "I suggest / that we / review / the contract / again", "keywords": ["suggest", "review"], "point": "suggest that S + V で「SがVすることを提案する」です。", "alt": "How about a second look at the agreement?" },
  { "grammar": "L3: Perception Verb (Hear)", "jp": "彼が電話で誰かと口論しているのを聞きました。", "en": "I heard him arguing with someone on the phone", "display": "I heard him / arguing / with someone / on the phone", "keywords": ["heard arguing"], "point": "hear + 人 + -ing（進行）で「〜しているのを聞く」です。argue（口論する）。", "alt": "I overheard his heated conversation." },
  { "grammar": "L3: Causative (Have)", "jp": "スタッフにその部屋を準備させます。", "en": "I will have my staff prepare the room", "display": "I will have / my staff / prepare / the room", "keywords": ["have prepare"], "point": "have + 人 + 動詞の原形。「（義務や仕事として）人に〜させる」です。", "alt": "I'll arrange for my team to set up the room." },
  { "grammar": "L3: Participle (Active)", "jp": "隣のオフィスで働いている人々はとても静かです。", "en": "The people working in the next office are very quiet", "display": "The people / working in the next office / are / very quiet", "keywords": ["working"], "point": "working ... が直前の the people を修飾しています。", "alt": "The next-door team is quite reserved." },
  { "grammar": "L3: Participle (Passive)", "jp": "これは私の同僚によって書かれたメモです。", "en": "This is a memo written by my colleague", "display": "This is a memo / written by / my colleague", "keywords": ["written"], "point": "written ...（書かれた〜）が memo を修飾する後置修飾です。", "alt": "My coworker left this note." },
  { "grammar": "L3: Used to do", "jp": "以前は毎日、紙の資料を使っていました。", "en": "I used to use paper documents every day", "display": "I used to / use / paper documents / every day", "keywords": ["used to"], "point": "used to do で「以前は〜していた（今はしていない）」という対比を表します。", "alt": "Paperwork was my daily routine in the past." },
  { "grammar": "L3: Present Perfect (Review)", "jp": "私たちは新しいマーケットに参入したばかりです。", "en": "We have just entered the new market", "display": "We have just / entered / the new market", "keywords": ["entered"], "point": "enter a market で「市場に参入する」というビジネス語です。", "alt": "We recently broke into a new market." },
  { "grammar": "L3: Passive Voice (Review)", "jp": "その新機能はユーザーから高く評価されています。", "en": "The new feature is highly evaluated by users", "display": "The new feature / is / highly evaluated / by users", "keywords": ["evaluated"], "point: "evaluate（評価する）の受動態。highly（高く）を伴います。", "alt": "Users are giving great feedback on the new feature." },
  { "grammar": "L3: It is ... for A to", "jp": "我々が最新のトレンドを把握しておくことは不可欠です。", "en": "It is essential for us to keep track of the latest trends", "display": "It is essential / for us / to keep track of / the latest trends", "keywords": ["keep track of"], "point": "keep track of ...（〜を把握し続ける／見失わない）は重要熟語です。", "alt": "Staying updated on trends is a priority." },
  { "grammar": "L3: Indirect Question", "jp": "誰がそのタスクに最も適しているか分かりません。", "en": "I do not know who is the best for the task", "display": "I do not know / who / is the best / for the task", "keywords": ["best for"], "point": "who が疑問詞兼主語なので、その後にすぐ is が来ます。", "alt": "I'm unsure about the right person for this job." },
  { "grammar": "L3: Relative Pronoun", "jp": "これは、彼が解決しようと努力していた問題です。", "en": "This is the problem that he was trying to solve", "display": "This is the problem / that / he was trying to solve", "keywords": ["trying to solve"], "point": "trying to solve（解決しようと努めている）が関係代名詞で問題にかかります。", "alt": "This is the challenge he's been working on." },
  { "grammar": "L3: Make A B (Noun)", "jp": "その成功が彼女をチームの人気者にしました。", "en": "The success made her a popular person in the team", "display": "The success / made / her / a popular person / in the team", "keywords": ["made her"], "point": "make + 人 + 名詞 で「人を〜という立場／状態にする」です。", "alt": "She gained a lot of popularity after that success." },
  { "grammar": "L3: Tell A to do (Neg)", "jp": "彼に、この情報を外部の人に漏らさないよう言ってください。", "en": "Please tell him not to leak this information to outsiders", "display": "Please tell him / not to leak / this information / to outsiders", "keywords": ["not to leak", "outsiders"], "point": "tell + 人 + not to do。 leak は「漏らす／漏洩する」です。", "alt": "Ask him to keep this info confidential." },
  { "grammar": "L3: Tag Question", "jp": "あなたはまだそのファイルを持っていますよね？", "en": "You still have the file, don't you", "display": "You still / have the file, / don't you", "keywords": ["still", "don't you"], "point": "現在形 have に対応する付加疑問 don't you です。", "alt": "I assume the file is still in your possession?" },
  { "grammar": "L3: Present Perfect (Review)", "jp": "あなたは今まで、海外の支店で働いたことがありますか？", "en": "Have you ever worked at an overseas branch", "display": "Have you ever / worked / at / an overseas branch", "keywords": ["overseas branch"], "point": "Have you ever ...?（経験）の疑問文。overseas は「海外の」。", "alt": "Any experience working in our foreign offices?" },
  { "grammar": "L3: Too ... to (Review)", "jp": "その計画はあまりに野心的すぎて、実行できません。", "en": "The plan is too ambitious to carry out", "display": "The plan / is / too ambitious / to carry out", "keywords": ["ambitious", "carry out"], "point": "ambitious（野心的な／壮大な）。carry out（実行する）。", "alt": "It's such a grand plan that we can't implement it." },
  { "grammar": "L3: Enough to (Review)", "jp": "彼は状況を好転させるのに十分な賢さがあります。", "en": "He is smart enough to change the situation", "display": "He is / smart enough / to change / the situation", "keywords": ["smart enough"], "point": "形容詞 + enough to [動詞] です。", "alt": "His intelligence is sufficient to fix the matter." },
  { "grammar": "L3: Relative Pronoun (Whose)", "jp": "私は、CEOのオフィスが最上階にある会社を訪問しました。", "en": "I visited a company whose CEO's office is on the top floor", "display": "I visited a company / whose CEO's office / is / on the top floor", "keywords": ["whose"], "point": "whose + 名詞 で所有関係を繋ぎます。", "alt": "The company I visited had the CEO's office at the top." },
  { "grammar": "L3: Indirect Question (Wh-)", "jp": "そのコストがいくらになるか見積もっていただけますか？", "en": "Could you estimate how much the cost will be", "display": "Could you estimate / how much / the cost will be", "keywords": ["estimate"], "point": "estimate（見積もる）。how much ... will be の語順に注意。", "alt": "Can you give me a quote for the total expense?" },

  { "grammar": "L1: Past Simple", "jp": "昨日、原材料を注文しました。", "en": "I ordered raw materials yesterday", "display": "I ordered / raw materials / yesterday", "keywords": ["raw materials"], "point": "raw materials で「原材料」です。", "alt": "The order for materials was placed yesterday." },

  { "grammar": "L2: Conjunction (When)", "jp": "欠品が起きた時、すぐに知らせてください。", "en": "When a stockout occurs, please let me know immediately", "display": "When / a stockout occurs, / please let me know", "keywords": ["stockout"], "point": "stockout（欠品・品切れ）はSCMにおける重大事象です。", "alt": "Notify me at once if we run out of stock." },

  { "grammar": "L3: SVOC (Find)", "jp": "荷揚げ作業が遅れていると分かりました。", "en": "I found the unloading work delayed", "display": "I found / the unloading work / delayed", "keywords": ["unloading"], "point": "現場の状況（遅延）に気づいたことを表します。", "alt": "I noticed a slowdown in the discharge operations." },
  { "grammar": "L3: Help A do", "jp": "この追跡システムが、あなたの在庫管理を助けます。", "en": "This tracking system helps you manage stock", "display": "This tracking system / helps you / manage / stock", "keywords": ["tracking system"], "point": "visibility（可視化）によるメリットを伝えます。", "alt": "Our monitoring tool simplifies inventory control." },

  { "grammar": "L3: Tag Question", "jp": "コンテナはもう港を出ましたよね？", "en": "The container has left the port, hasn't it", "display": "The container / has left the port, / hasn't it", "keywords": ["left the port"], "point": "出港（POL離脱）を確認する付加疑問文です。", "alt": "The vessel departed the terminal, right?" },
  { "grammar": "L3: So ... that", "jp": "需要が非常に高かったので、在庫がなくなりました。", "en": "The demand was so high that we ran out of stock", "display": "The demand was so high / that / we ran out of stock", "keywords": ["ran out of stock"], "point": "run out of stock（在庫を切らす）という結果を招きました。", "alt": "Heavy demand caused a total stockout." },

    ];

    // ローカルストレージから学習済リストを取得 (問題のIDを保存)
    let learnedList = JSON.parse(localStorage.getItem('learned_biz_eng')) || [];
    let currentIndex = 0;
    let isRandomMode = false;
    let recognition, mediaRecorder, audioChunks = [], audioUrl, synth = window.speechSynthesis, stream;

    function saveLearnedStatus() {
        localStorage.setItem('learned_biz_eng', JSON.stringify(learnedList));
        updateOverallProgress();
    }

    function updateOverallProgress() {
        const count = learnedList.length;
        document.getElementById('learned-count').innerText = `Learned: ${count} / ${questions.length}`;
        const percent = (count / questions.length) * 100;
        document.getElementById('progress-bar').style.width = percent + '%';
    }

    function init() {
        const q = questions[currentIndex];
        const isLearned = learnedList.includes(q.id);
        
        document.getElementById('grammar-label').innerText = q.grammar;
        document.getElementById('jp-text').innerText = q.jp;
        
        const statusBadge = document.getElementById('learned-status');
        const markBtn = document.getElementById('mark-learned-btn');
        
        if (isLearned) {
            statusBadge.innerText = "Learned ✅";
            statusBadge.className = "status-badge status-learned";
            markBtn.innerText = "Learned ✅";
            markBtn.classList.add('active');
        } else {
            statusBadge.innerText = "Not Learned";
            statusBadge.className = "status-badge status-not-learned";
            markBtn.innerText = "Mark as Learned";
            markBtn.classList.remove('active');
        }

        document.getElementById('result-area').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('retry-btn').classList.add('hidden');
        document.getElementById('record-btn').classList.remove('hidden');
        document.getElementById('record-btn').innerText = "🎤 Click to Speak";
        document.getElementById('record-btn').className = "btn-primary";
        
        updateOverallProgress();
    }

    // 学習済ボタンのクリック
    document.getElementById('mark-learned-btn').onclick = function() {
        const q = questions[currentIndex];
        if (learnedList.includes(q.id)) {
            learnedList = learnedList.filter(id => id !== q.id);
        } else {
            learnedList.push(q.id);
        }
        saveLearnedStatus();
        init(); // 表示更新
    };

    // ランダムモードの切り替え
    document.getElementById('random-toggle').onclick = function() {
        isRandomMode = !isRandomMode;
        this.innerText = isRandomMode ? "Random: ON" : "Random: OFF";
        this.classList.toggle('active');
    };

    // 音声認識システム (以前のロジックと同じ)
    async function setupAudio() {
        if (!stream) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => { audioUrl = URL.createObjectURL(new Blob(audioChunks, { type: 'audio/wav' })); };
            } catch (e) { alert("Microphone access is required."); return; }
        }
        if (!recognition) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'en-US';
            recognition.onresult = (e) => {
                const speech = e.results[0][0].transcript;
                if(mediaRecorder.state === "recording") mediaRecorder.stop();
                showResult(speech);
            };
        }
    }

    document.getElementById('record-btn').onclick = async () => {
        await setupAudio();
        audioChunks = [];
        recognition.start();
        mediaRecorder.start();
        document.getElementById('record-btn').innerText = "Listening...";
        document.getElementById('record-btn').className = "btn-primary btn-recording";
    };

    function showResult(userSpeech) {
        const q = questions[currentIndex];
        document.getElementById('user-speech').innerText = `"${userSpeech}"`;
        document.getElementById('model-answer').innerHTML = q.display.split(' / ').map(p => p + `<span class="slash">/</span>`).join('');
        
        const isPerfect = userSpeech.toLowerCase().replace(/[.\s]/g,'') === q.en.toLowerCase().replace(/[.\s]/g,'');
        document.getElementById('feedback-en').innerText = isPerfect ? "Perfect!" : "Good try!";
        document.getElementById('grammar-point-text').innerText = q.point;

        document.getElementById('result-area').classList.remove('hidden');
        document.getElementById('record-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('retry-btn').classList.remove('hidden');
        playModel(1.0);
    }

    window.playModel = (speed) => {
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(questions[currentIndex].en);
        utter.lang = 'en-US'; utter.rate = speed;
        synth.speak(utter);
    };

    document.getElementById('replay-btn').onclick = () => { if(audioUrl) new Audio(audioUrl).play(); };
    
    document.getElementById('next-btn').onclick = () => {
        if (isRandomMode) {
            currentIndex = Math.floor(Math.random() * questions.length);
        } else {
            currentIndex = (currentIndex + 1) % questions.length;
        }
        init();
    };

    document.getElementById('retry-btn').onclick = init;

    // 初期起動
    init();
</script>
