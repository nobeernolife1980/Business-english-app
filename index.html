<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business English Construction 500</title>
    <style>
        :root {
            --deep-blue: #003468; --purpose-blue: #0082C4; --parker-gold: #FDB913;
            --clean-green: #7BBA3E; --charcoal: #1C2B39; --white: #FFFFFF;
            --soft-gray: #F1F5F9; --border-light: #E2E8F0;
        }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #F8FAFC; color: var(--charcoal); margin: 0; display: flex; justify-content: center; }
        .app-container { max-width: 650px; width: 100%; background: var(--white); min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .app-header { background: var(--deep-blue); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .grammar-tag { background: var(--parker-gold); color: var(--deep-blue); padding: 5px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .content { padding: 25px; flex-grow: 1; }
        .section-title { font-size: 0.7rem; font-weight: 700; color: var(--purpose-blue); text-transform: uppercase; margin-bottom: 6px; display: block; }
        .question-card { background: var(--soft-gray); border-left: 6px solid var(--deep-blue); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .jp-text { font-size: 1.3rem; font-weight: 700; color: var(--deep-blue); line-height: 1.4; }
        .result-area { border-top: 2px solid var(--soft-gray); padding-top: 15px; animation: fadeIn 0.3s ease-out; }
        .model-answer { font-size: 1.25rem; font-weight: 700; color: var(--deep-blue); margin-bottom: 10px; }
        .slash { color: #CBD5E1; margin: 0 3px; font-weight: normal; }
        .advice-card { background: #F0F7FF; border-radius: 10px; padding: 15px; border: 1px solid var(--border-light); margin-top: 15px; }
        .feedback-en { font-weight: 800; color: #1E40AF; font-size: 1rem; margin-bottom: 3px; }
        .feedback-jp { font-size: 0.85rem; color: #334155; margin-bottom: 10px; border-bottom: 1px solid #D1E9FF; padding-bottom: 8px; }
        .grammar-note { font-size: 0.85rem; line-height: 1.5; }
        .alt-phrase { font-size: 0.8rem; color: #64748B; background: white; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px dashed var(--purpose-blue); }
        button { border: none; padding: 16px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; transition: 0.2s; }
        .btn-primary { background: var(--deep-blue); color: white; }
        .btn-recording { background: #E74C3C; color: white; animation: pulse 1.5s infinite; }
        .btn-next { background: var(--clean-green); color: white; margin-top: 8px; }
        .btn-outline { background: white; border: 1px solid var(--border-light); color: var(--purpose-blue); width: auto; padding: 8px 12px; font-size: 0.8rem; margin-right: 5px; margin-bottom: 5px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="app-container">
    <header class="app-header">
        <span id="grammar-label" class="grammar-tag">Grammar Level</span>
        <div id="progress" style="font-weight: bold; font-size: 0.9rem;">1 / 500</div>
    </header>
    <div class="content">
        <span class="section-title">Japanese Prompt</span>
        <div class="question-card"><div id="jp-text" class="jp-text">...</div></div>
        <div id="result-area" class="result-area hidden">
            <span class="section-title">Your Transcription</span>
            <div id="user-speech" style="font-style: italic; margin-bottom: 12px; color: var(--charcoal); font-size: 1rem; padding: 10px; background: #fff; border-radius: 6px; border: 1px solid var(--border-light);"></div>
            <span class="section-title">Model Answer</span>
            <div id="model-answer" class="model-answer"></div>
            <div style="margin-bottom: 15px; display: flex; flex-wrap: wrap;">
                <button class="btn-outline" onclick="playModel(1.0)">🔊 Native</button>
                <button class="btn-outline" onclick="playModel(0.7)">🐢 Slow</button>
                <button class="btn-outline" id="replay-btn">▶ My Voice</button>
            </div>
            <div class="advice-card">
                <div id="feedback-en" class="feedback-en"></div>
                <div id="feedback-jp" class="feedback-jp"></div>
                <div class="grammar-note"><strong style="color:var(--deep-blue);">Grammar Tip:</strong> <span id="grammar-point-text"></span></div>
                <div class="alt-phrase"><strong>Alternative:</strong> <span id="alt-text" style="color:var(--purpose-blue);"></span></div>
            </div>
        </div>
        <div style="margin-top: 25px;">
            <button id="record-btn" class="btn-primary">🎤 Click to Speak</button>
            <button id="next-btn" class="btn-next hidden">Next Task ➔</button>
            <button id="retry-btn" style="margin-top:8px; background:#f1f5f9; color:#475569;" class="hidden">Try Again</button>
        </div>
    </div>
</div>

<script>
    // 例文データ 100個 (500個まで容易に拡張可能)
    const questions = [
        // Level 1: Basics
        { grammar: "L1: Present Simple", jp: "私はIT企業で働いています。", en: "I work for an IT company", display: "I work / for an IT company", keywords: ["work", "IT"], point: "所属を表すときは work for を使います。", alt: "I am with an IT firm." },
        { grammar: "L1: Present Continuous", jp: "彼は今、電話に出ています。", en: "He is on the phone now", display: "He is / on the phone / now", keywords: ["phone"], point: "is on the phone で『電話中』です。", alt: "He is on another line." },
        { grammar: "L1: Past Simple", jp: "昨日、見積もりを送りました。", en: "I sent the estimate yesterday", display: "I sent / the estimate / yesterday", keywords: ["sent", "estimate"], point: "sendの過去形はsentです。", alt: "The quote was sent yesterday." },
        { grammar: "L1: Imperatives", jp: "資料を5部用意してください。", en: "Please make five copies of the document", display: "Please make / five copies / of the document", keywords: ["copies"], point: "make copies of ... でコピーを取るです。", alt: "Could you copy this 5 times?" },
        { grammar: "L1: Can/May", jp: "お名前を伺ってもよろしいですか？", en: "May I have your name please", display: "May I / have your name / please", keywords: ["May", "name"], point: "May I ...? は非常に丁寧な尋ね方です。", alt: "Could you tell me your name?" },
        { grammar: "L1: Be verb", jp: "彼は今、会議中です。", en: "He is in a meeting now", display: "He is / in a meeting / now", keywords: ["meeting"], point: "in a meeting で会議に入っている状態です。", alt: "He is attending a meeting." },
        { grammar: "L1: Questions (Wh)", jp: "次の会議はいつですか？", en: "When is the next meeting", display: "When is / the next meeting", keywords: ["When", "meeting"], point: "When is ...? で日時を確認します。", alt: "What time is the next meeting?" },
        { grammar: "L1: Like/Want", jp: "コーヒーはいかがですか？", en: "Would you like some coffee", display: "Would you like / some coffee", keywords: ["like"], point: "Would you like ...? はお勧めする際の定番です。", alt: "Can I get you some coffee?" },
        { grammar: "L1: There is/are", jp: "この近くに銀行はありますか？", en: "Is there a bank near here", display: "Is there / a bank / near here", keywords: ["bank"], point: "Is there ...? で有無を尋ねます。", alt: "Are there any banks around here?" },
        { grammar: "L1: Prepositions", jp: "私のオフィスは3階にあります。", en: "My office is on the third floor", display: "My office / is on / the third floor", keywords: ["on", "floor"], point: "階数には前置詞 on を使います。", alt: "Our office is on the 3rd floor." },

        // Level 2: Intermediate
        { grammar: "L2: Future (will)", jp: "後でメールします。", en: "I will email you later", display: "I will / email you / later", keywords: ["will", "email"], point: "email は動詞としてそのまま使えます。", alt: "I'll send you an email later." },
        { grammar: "L2: Future (going to)", jp: "来週新しい支店を開く予定です。", en: "We are going to open a new branch next week", display: "We are going to / open / a new branch / next week", keywords: ["going", "branch"], point: "予定が決まっているときは be going to です。", alt: "A new branch will open next week." },
        { grammar: "L2: Must/Have to", jp: "今日中に終わらせなければなりません。", en: "I must finish this today", display: "I must / finish / this today", keywords: ["must"], point: "強い義務や必要性は must です。", alt: "I have to get this done today." },
        { grammar: "L2: Should", jp: "もっと早く出発すべきです。", en: "We should leave earlier", display: "We should / leave / earlier", keywords: ["should"], point: "アドバイスや提案は should です。", alt: "It's better to head out soon." },
        { grammar: "L2: To-Infinitive (Purpose)", jp: "詳細を話すためにここに来ました。", en: "I came here to talk about the details", display: "I came here / to talk / about the details", keywords: ["to talk"], point: "to + 動詞で『〜するために』です。", alt: "I'm here to discuss the details." },
        { grammar: "L2: To-Infinitive (Adj)", jp: "何か飲むものが欲しいです。", en: "I want something to drink", display: "I want / something / to drink", keywords: ["to drink"], point: "something to drink で『飲み物』です。", alt: "Could I get a drink?" },
        { grammar: "L2: Gerund", jp: "プレゼンの準備が終わりました。", en: "I finished preparing for the presentation", display: "I finished / preparing / for the presentation", keywords: ["preparing"], point: "finish の後は動名詞 (-ing) です。", alt: "Presentation prep is done." },
        { grammar: "L2: Comparison", jp: "このプランの方が効率的です。", en: "This plan is more efficient", display: "This plan / is more efficient", keywords: ["more", "efficient"], point: "長い形容詞の比較は more です。", alt: "This is a more effective plan." },
        { grammar: "L2: Superlative", jp: "これが私たちの最新モデルです。", en: "This is our latest model", display: "This is / our latest model", keywords: ["latest"], point: "latest は『最新の』という最上級です。", alt: "This is the newest model we have." },
        { grammar: "L2: Passive", jp: "この製品は日本で作られています。", en: "This product is made in Japan", display: "This product / is made / in Japan", keywords: ["is", "made"], point: "be動詞 + 過去分詞で受動態です。", alt: "It is manufactured in Japan." },

        // Level 3: Advanced
        { grammar: "L3: Present Perfect", jp: "すでに資料を読みました。", en: "I have already read the document", display: "I have already / read / the document", keywords: ["have", "read"], point: "完了した状態は現在完了形です。", alt: "I'm finished with the document." },
        { grammar: "L3: Present Perfect (Cont)", jp: "ここで5年間働いています。", en: "I have been working here for five years", display: "I have been / working here / for five years", keywords: ["been", "working"], point: "動作の継続は現在完了進行形です。", alt: "I joined this company 5 years ago." },
        { grammar: "L3: It is ... to", jp: "納期を守ることは重要です。", en: "It is important to meet the deadline", display: "It is important / to meet / the deadline", keywords: ["important", "deadline"], point: "meet the deadline で締切を守るです。", alt: "Keeping the deadline is crucial." },
        { grammar: "L3: Relative Pronoun", jp: "これは私が探していた資料です。", en: "This is the document that I was looking for", display: "This is the document / that I was / looking for", keywords: ["that", "looking"], point: "関係代名詞 that で説明を加えます。", alt: "This is the file I wanted." },
        { grammar: "L3: Tell A to do", jp: "彼に電話するように伝えてください。", en: "Please tell him to call me", display: "Please tell him / to call me", keywords: ["tell", "to call"], point: "tell A to do で『Aに〜するよう言う』です。", alt: "Could you ask him to call me?" },
        { grammar: "L3: Indirect Question", jp: "彼がいつ来るか知っていますか？", en: "Do you know when he will come", display: "Do you know / when / he will come", keywords: ["when"], point: "間接疑問文の語順に注意しましょう。", alt: "What time is he arriving?" },
        { grammar: "L3: Make A B", jp: "そのニュースは私たちを幸せにしました。", en: "The news made us happy", display: "The news / made us / happy", keywords: ["made"], point: "make A B で『AをBの状態にする』です。", alt: "We were happy to hear that." },
        { grammar: "L3: Too...to", jp: "この問題は難しすぎて解決できません。", en: "This problem is too difficult to solve", display: "This problem / is too difficult / to solve", keywords: ["too", "solve"], point: "too ... to で『〜すぎてできない』です。", alt: "It's impossible to solve this." },
        { grammar: "L3: Present Perfect (Exp)", jp: "一度彼に会ったことがあります。", en: "I have met him once", display: "I have met / him / once", keywords: ["have", "met"], point: "経験を表す現在完了形です。", alt: "I've seen him before." },
        { grammar: "L3: Indirect Question", jp: "どれが最適か教えてください。", en: "Please let me know which is best", display: "Please let me know / which / is best", keywords: ["which"], point: "which は『どちらが』を表します。", alt: "Tell me which one we should choose." }
       [
  // --- JHS Level 1: Basics (1-35) ---
  { grammar: "L1: Be verb", jp: "彼は私たちの新しいCEOです。", en: "He is our new CEO", display: "He is / our new CEO", keywords: ["CEO"], point: "CEOなどの役職の前にはa/theを付けないこともありますが、ourで所有を明示すると自然です。", alt: "He's the new head of our company." },
  { grammar: "L1: Be verb", jp: "このプロジェクトはとても重要です。", en: "This project is very important", display: "This project / is / very important", keywords: ["important"], point: "主語 + is + 形容詞の基本形です。ビジネスでは important は必須です。", alt: "This is a high-priority project." },
  { grammar: "L1: Present Simple", jp: "私たちは毎日10時に会議をします。", en: "We have a meeting at 10 every day", display: "We have a meeting / at 10 / every day", keywords: ["meeting", "every day"], point: "習慣的な動作には現在形を使います。", alt: "Our daily meeting starts at 10." },
  { grammar: "L1: Present Simple", jp: "彼女は人事部で働いています。", en: "She works in the HR department", display: "She works / in the HR department", keywords: ["works", "HR"], point: "部署名には the を付け、in で範囲を表します。", alt: "She is in the Human Resources team." },
  { grammar: "L1: Negative", jp: "私はその意見に賛成ではありません。", en: "I am not in agreement with that opinion", display: "I am not / in agreement / with that opinion", keywords: ["agreement"], point: "I don't agree. よりも I am not in agreement. の方が少しフォーマルです。", alt: "I don't support that idea." },
  { grammar: "L1: Questions", jp: "あなたは海外出張に行きますか？", en: "Do you go on business trips abroad", display: "Do you go / on business trips / abroad", keywords: ["business trips"], point: "出張に行くは go on a business trip です。", alt: "Do you travel overseas for work?" },
  { grammar: "L1: Can", jp: "英語でプレゼンができますか？", en: "Can you give a presentation in English", display: "Can you / give a presentation / in English", keywords: ["presentation"], point: "プレゼンをするは give または make を使います。", alt: "Are you able to present in English?" },
  { grammar: "L1: Can", jp: "明日お時間をいただけますか？", en: "Can you spare some time tomorrow", display: "Can you / spare some time / tomorrow", keywords: ["spare"], point: "spare some time で『時間を割く』という意味になります。", alt: "Could you make some time tomorrow?" },
  { grammar: "L1: Present Continuous", jp: "今、資料を作成しています。", en: "I am creating the document now", display: "I am creating / the document / now", keywords: ["creating"], point: "現在進行中の動作です。作成するは create や prepare が使われます。", alt: "I'm currently working on the files." },
  { grammar: "L1: Present Continuous", jp: "彼らは新戦略を議論しています。", en: "They are discussing a new strategy", display: "They are discussing / a new strategy", keywords: ["discussing", "strategy"], point: "discuss は他動詞なので about は不要です。", alt: "They are talking about the new plan." },
  { grammar: "L1: Past Simple", jp: "先週、契約書にサインしました。", en: "I signed the contract last week", display: "I signed / the contract / last week", keywords: ["signed", "contract"], point: "過去の確定した動作には過去形を使います。", alt: "The contract was signed last week." },
  { grammar: "L1: Past Simple", jp: "昨日の会議はどうでしたか？", en: "How was the meeting yesterday", display: "How was / the meeting / yesterday", keywords: ["How", "yesterday"], point: "How was ...? で感想や状況を尋ねます。", alt: "Did the meeting go well yesterday?" },
  { grammar: "L1: Wh-Questions", jp: "オフィスはどこですか？", en: "Where is your office", display: "Where is / your office", keywords: ["Where"], point: "場所を尋ねる Where の基本形です。", alt: "Could you tell me your office location?" },
  { grammar: "L1: Wh-Questions", jp: "誰がこのプロジェクトの担当ですか？", en: "Who is in charge of this project", display: "Who is / in charge of / this project", keywords: ["Who", "charge"], point: "be in charge of ... で『〜の担当である』です。", alt: "Who is leading this project?" },
  { grammar: "L1: Imperative", jp: "このフォームに入力してください。", en: "Please fill out this form", display: "Please / fill out / this form", keywords: ["fill out"], point: "記入するは fill out または fill in です。", alt: "Could you complete this form?" },
  { grammar: "L1: Imperative", jp: "私に最新情報を教えてください。", en: "Please keep me updated", display: "Please / keep me / updated", keywords: ["updated"], point: "keep A updated で『Aに最新情報を伝え続ける』です。", alt: "Please let me know if there's any news." },
  { grammar: "L1: There is/are", jp: "何か問題はありますか？", en: "Is there any problem", display: "Is there / any problem", keywords: ["Is there"], point: "有無を尋ねる基本形。Any problems? と複数形でもOKです。", alt: "Do you have any concerns?" },
  { grammar: "L1: Frequency", jp: "私はめったに遅刻しません。", en: "I am rarely late for work", display: "I am / rarely late / for work", keywords: ["rarely"], point: "rarely（めったに〜ない）はビジネスで頻出の副詞です。", alt: "I am almost always on time." },
  { grammar: "L1: Prepositions", jp: "私の席は窓の近くです。", en: "My desk is near the window", display: "My desk / is near / the window", keywords: ["near"], point: "場所を特定する前置詞 near です。", alt: "I sit by the window." },
  { grammar: "L1: Pronouns", jp: "これは私たちの新製品です。", en: "This is our new product", display: "This is / our new product", keywords: ["our"], point: "所有格 our を使ってチームであることを示します。", alt: "We just launched this product." },
  { grammar: "L1: Time", jp: "始業時間は9時です。", en: "The work starts at 9 AM", display: "The work / starts / at 9 AM", keywords: ["at"], point: "時間の点を示す前置詞 at です。", alt: "Our office opens at 9." },
  { grammar: "L1: Numbers", jp: "20名分の昼食を予約してください。", en: "Please book lunch for twenty people", display: "Please book / lunch / for twenty people", keywords: ["book"], point: "book は動詞で『予約する』。reserve も使えます。", alt: "I need a reservation for twenty." },
  { grammar: "L1: Adjectives", jp: "その価格は妥当です。", en: "The price is reasonable", display: "The price / is reasonable", keywords: ["reasonable"], point: "cheap（安い）より reasonable（妥当な）の方がプロらしいです。", alt: "The cost is fair." },
  { grammar: "L1: Conjunction (and)", jp: "私はメールを読み、返信しました。", en: "I read the email and replied", display: "I read / the email / and replied", keywords: ["read", "replied"], point: "過去形の並列です。read の過去形は発音が『レッド』に変わります。", alt: "I read and answered the message." },
  { grammar: "L1: Conjunction (but)", jp: "会議に行きたかったですが、忙しすぎました。", en: "I wanted to go to the meeting but I was too busy", display: "I wanted to go / but / I was too busy", keywords: ["but", "busy"], point: "逆説の but です。too ... は『〜すぎる』という否定的な響きです。", alt: "I couldn't attend due to my schedule." },
  { grammar: "L1: Question (Why)", jp: "なぜその計画が変更されたのですか？", en: "Why was the plan changed", display: "Why was / the plan / changed", keywords: ["Why", "changed"], point: "理由を尋ねる Why と受動態の組み合わせです。", alt: "What was the reason for the change?" },
  { grammar: "L1: Question (Which)", jp: "どちらの選択肢が良いですか？", en: "Which option is better", display: "Which option / is better", keywords: ["Which", "better"], point: "Which + 名詞 で『どちらの〜』です。", alt: "Which one do you prefer?" },
  { grammar: "L1: Subject + Be + Noun", jp: "これは私の名刺です。", en: "This is my business card", display: "This is / my business card", keywords: ["business card"], point: "挨拶の基本です。business card を使いましょう。", alt: "Here is my card." },
  { grammar: "L1: Negative", jp: "彼は今日はオフィスにいません。", en: "He is not in the office today", display: "He is not / in the office / today", keywords: ["not in"], point: "不在であることを示す表現です。", alt: "He is out today." },
  { grammar: "L1: Can", jp: "このファイルを開けますか？", en: "Can you open this file", display: "Can you / open / this file", keywords: ["open"], point: "依頼の can です。", alt: "Could you please open this?" },
  { grammar: "L1: Present Simple", jp: "社長は毎朝コーヒーを飲みます。", en: "The president drinks coffee every morning", display: "The president / drinks coffee / every morning", keywords: ["drinks"], point: "三人称単数の s を忘れずに。", alt: "The CEO has coffee every morning." },
  { grammar: "L1: Past Simple", jp: "今朝、彼と話しました。", en: "I talked with him this morning", display: "I talked with him / this morning", keywords: ["talked"], point: "talk with A で『Aと話す』です。", alt: "I had a chat with him earlier." },
  { grammar: "L1: Where", jp: "お手洗いはどこですか？", en: "Where is the restroom", display: "Where is / the restroom", keywords: ["Where"], point: "来客への案内に役立ちます。", alt: "The restroom is just over there." },
  { grammar: "L1: How many", jp: "何名の参加者が来ますか？", en: "How many participants are coming", display: "How many participants / are coming", keywords: ["How many"], point: "数を尋ねる How many + 複数名詞です。", alt: "What is the total number of attendees?" },
  { grammar: "L1: Wh-Questions", jp: "このペンは誰のものですか？", en: "Whose pen is this", display: "Whose pen / is this", keywords: ["Whose"], point: "所有を尋ねる Whose です。", alt: "Does this pen belong to anyone?" },

  { grammar: "L2: To-Infinitive (Noun)", jp: "私の目標は売上を伸ばすことです。", en: "My goal is to increase sales", display: "My goal is / to increase sales", keywords: ["to increase"], point: "『〜すること』という名詞的用法です。", alt: "Increasing sales is my main objective." },
  { grammar: "L2: To-Infinitive (Adj)", jp: "準備する時間は十分にあります。", en: "We have enough time to prepare", display: "We have / enough time / to prepare", keywords: ["to prepare"], point: "time to prepare で『準備するための時間』です。", alt: "There's plenty of time for preparation." },
  { grammar: "L2: Gerund", jp: "彼は資料をまとめるのが得意です。", en: "He is good at organizing documents", display: "He is good at / organizing / documents", keywords: ["good at", "organizing"], point: "前置詞 at の後は動名詞 -ing になります。", alt: "He has a talent for filing." },
  { grammar: "L2: Comparison", jp: "このプロジェクトは以前のものより大きいです。", en: "This project is larger than the previous one", display: "This project / is larger / than the previous one", keywords: ["larger than"], point: "A is [比較級] than B の形です。", alt: "This project's scale exceeds the last one." },
  { grammar: "L2: More ... than", jp: "このソフトはあちらより便利です。", en: "This software is more useful than that one", display: "This software / is more useful / than that one", keywords: ["more useful"], point: "長い形容詞は more を使います。", alt: "This tool is more practical." },

  { grammar: "L2: Most ...", jp: "これが最も効率的な方法です。", en: "This is the most efficient way", display: "This is / the most efficient way", keywords: ["the most efficient"], point: "長い形容詞の最上級です。", alt: "This method works best." },

  { grammar: "L2: Conjunction (when)", jp: "手が空いた時に手伝ってください。", en: "Please help me when you are free", display: "Please help me / when / you are free", keywords: ["when"], point: "時を表す when の節です。", alt: "If you have a moment, I need a hand." },

  { grammar: "L2: Conjunction (because)", jp: "渋滞だったので遅れました。", en: "I was late because of the traffic", display: "I was late / because of / the traffic", keywords: ["because of"], point: "because of + 名詞 で理由を表します。", alt: "The traffic caused my delay." },

  { grammar: "L2: There will be", jp: "明日、大きな会議があるでしょう。", en: "There will be a big meeting tomorrow", display: "There will be / a big meeting / tomorrow", keywords: ["will be"], point: "There is の未来形です。", alt: "A major conference is set for tomorrow." },

  { grammar: "L2: Enough to", jp: "彼は一人でやるのに十分な経験があります。", en: "He is experienced enough to do it alone", display: "He is experienced enough / to do it / alone", keywords: ["enough to"], point: "形容詞 + enough to ... で『〜するのに十分〜だ』。", alt: "His experience allows him to work solo." },

  { grammar: "L3: Present Perfect (Exp)", jp: "一度もその場所に行ったことがありません。", en: "I have never been to that place", display: "I have never been / to that place", keywords: ["never been to"], point: "経験の否定です。have been to で『〜に行ったことがある』。", alt: "That's a new location for me." },

  { grammar: "L3: Passive", jp: "その計画は却下されました。", en: "The plan was rejected", display: "The plan / was rejected", keywords: ["was rejected"], point: "過去の受動態です。", alt: "They turned down the proposal." },

  { grammar: "L3: Want A to do", jp: "あなたにこのメールを読んでほしいです。", en: "I want you to read this email", display: "I want you / to read / this email", keywords: ["want to"], point: "want + 人 + to do で『人に〜してほしい』。", alt: "Could you please review this email?" },

        }
        if (!recognition) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'en-US';
            recognition.onresult = (e) => {
                const speech = e.results[0][0].transcript;
                if(mediaRecorder.state === "recording") mediaRecorder.stop();
                showResult(speech);
            };
            recognition.onerror = () => { recordBtn.innerText = "🎤 Error (Retry)"; recordBtn.className = "btn-primary"; };
        }
    }

    const recordBtn = document.getElementById('record-btn');
    const resultArea = document.getElementById('result-area');

    function init() {
        const q = questions[currentIndex];
        document.getElementById('grammar-label').innerText = q.grammar;
        document.getElementById('jp-text').innerText = q.jp;
        document.getElementById('progress').innerText = `${currentIndex + 1} / 500`;
        resultArea.classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('retry-btn').classList.add('hidden');
        recordBtn.classList.remove('hidden');
        recordBtn.innerText = "🎤 Click to Speak";
        recordBtn.className = "btn-primary";
    }

    recordBtn.onclick = async () => {
        await setupAudio();
        if(!stream) return;
        audioChunks = [];
        recognition.start();
        mediaRecorder.start();
        recordBtn.innerText = "Listening...";
        recordBtn.className = "btn-recording";
    };

    function showResult(userSpeech) {
        const q = questions[currentIndex];
        document.getElementById('user-speech').innerText = `"${userSpeech}"`;
        document.getElementById('model-answer').innerHTML = q.display.split(' / ').map(p => p + `<span class="slash">/</span>`).join('');
        const isPerfect = userSpeech.toLowerCase().replace(/[.\s]/g,'') === q.en.toLowerCase().replace(/[.\s]/g,'');
        document.getElementById('feedback-en').innerText = isPerfect ? "Perfect! Well done." : "Good try!";
        document.getElementById('feedback-jp').innerText = isPerfect ? "完璧な正解です！" : "惜しい！模範解答を聞いて再挑戦しましょう。";
        document.getElementById('grammar-point-text').innerText = q.point;
        document.getElementById('alt-text').innerText = q.alt;
        resultArea.classList.remove('hidden');
        recordBtn.classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('retry-btn').classList.remove('hidden');
        playModel(1.0);
    }

    window.playModel = (speed) => {
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(questions[currentIndex].en);
        utter.lang = 'en-US'; utter.rate = speed;
        synth.speak(utter);
    };

    document.getElementById('replay-btn').onclick = () => { if(audioUrl) new Audio(audioUrl).play(); };
    document.getElementById('next-btn').onclick = () => { currentIndex = (currentIndex + 1) % 500; init(); };
    document.getElementById('retry-btn').onclick = init;
    init();
</script>
</body>
</html>
