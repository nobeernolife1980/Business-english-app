  { "id": 219, "grammar": "L2: Shall we", "jp": "プロジェクトについて話し合いませんか？", "en": "Shall we discuss the project", "display": "Shall we / discuss / the project", "point": "誘いの Shall we ...? です。", "alt": "Why don't we talk about the project?" },
  { "id": 220, "grammar": "L2: To-Infinitive", "jp": "私の仕事はソフトウェアをテストすることです。", "en": "My job is to test software", "display": "My job / is to test / software", "point": "不定詞の名詞的用法です。", "alt": "Testing software is my task." },
  { "id": 221, "grammar": "L2: To-Infinitive", "jp": "今日やるべきことがたくさんあります。", "en": "I have many things to do today", "display": "I have / many things / to do today", "point": "不定詞の形容詞的用法です。", "alt": "My schedule is packed." },
  { "id": 222, "grammar": "L2: Gerund", "jp": "彼は英語を話すのが得意です。", "en": "He is good at speaking English", "display": "He is good at / speaking English", "point": "at（前置詞）の後は動名詞です。", "alt": "He is a fluent speaker." },
  { "id": 223, "grammar": "L2: Try to do", "jp": "彼に電話しようとしました。", "en": "I tried to call him", "display": "I tried / to call / him", "point": "try to do で「〜しようと努力する」です。", "alt": "I attempted to reach him." },
  { "id": 224, "grammar": "L2: Comparison", "jp": "このカバンはあのカバンより重いです。", "en": "This bag is heavier than that one", "display": "This bag / is heavier than / that one", "point": "heavy の比較級は heavier です。", "alt": "That one is lighter." },
  { "id": 225, "grammar": "L2: Superlative", "jp": "これが最も人気のある製品です。", "en": "This is the most popular product", "display": "This is / the most popular / product", "point": "長い単語の最上級は the most です。", "alt": "This is our best-seller." },
  { "id": 226, "grammar": "L2: Conjunction", "jp": "もし時間があれば、手伝ってください。", "en": "If you have time, please help me", "display": "If you have time, / please / help me", "point": "条件の if節 の中は現在形です。", "alt": "Lend me a hand if possible." },
  { "id": 227, "grammar": "L2: Conjunction", "jp": "私は彼が正しいと思います。", "en": "I think that he is right", "display": "I think / that / he is right", "point": "that節で意見の内容を述べます。", "alt": "In my opinion, he is correct." },
  { "id": 228, "grammar": "L2: Conjunction", "jp": "雨でしたが、彼は外出しました。", "en": "Although it was raining, he went out", "display": "Although it was raining, / he / went out", "point": "「〜だけれども」の although です。", "alt": "He went out despite the rain." },
  { "id": 229, "grammar": "L2: Look like", "jp": "そのニュースは良さそうですね。", "en": "The news looks good", "display": "The news / looks / good", "point": "look + 形容詞 で「〜に見える」です。", "alt": "That sounds promising." },
  { "id": 230, "grammar": "L2: Give A B", "jp": "私に詳細を教えてください。", "en": "Please give me the details", "display": "Please / give me / the details", "point": "give 人 物 の語順です。", "alt": "Could you provide more info?" },
  { "id": 231, "grammar": "L2: Must not", "jp": "ここでタバコを吸ってはいけません。", "en": "You must not smoke here", "display": "You must not / smoke / here", "point": "強い禁止の must not です。", "alt": "Smoking is prohibited." },
  { "id": 232, "grammar": "L2: Had to", "jp": "遅くまで残らなければなりませんでした。", "en": "I had to stay late", "display": "I had to / stay / late", "point": "must の過去形は had to です。", "alt": "I was forced to work late." },
  { "id": 233, "grammar": "L2: May I", "jp": "入ってもいいですか？", "en": "May I come in", "display": "May I / come / in", "point": "丁寧な許可の May I ...? です。", "alt": "Is it okay if I enter?" },
  { "id": 234, "grammar": "L2: Look forward to", "jp": "お会いできるのを楽しみにしています。", "en": "I am looking forward to seeing you", "display": "I am looking forward to / seeing / you", "point": "to の後は動名詞 -ing です。", "alt": "I can't wait to meet you." },
  { "id": 235, "grammar": "L2: Launch", "jp": "来月、新製品を発売します。", "en": "We will launch a new product next month", "display": "We will launch / a new product / next month", "point": "launch は発売・開始を意味します。", "alt": "Our new product comes out next month." },
  { "id": 236, "grammar": "SCM: Warehouse", "jp": "倉庫を整理してください。", "en": "Please organize the warehouse", "display": "Please / organize / the warehouse", "point": "organize は整理・整頓です。", "alt": "Tidy up the storage area." },
  { "id": 237, "grammar": "SCM: Sourcing", "jp": "原材料をどこで買っていますか？", "en": "Where do you buy raw materials", "display": "Where / do you / buy / raw materials", "point": "raw materials で原材料です。", "alt": "Who is your material supplier?" },
  { "id": 238, "grammar": "SCM: Stockout", "jp": "需要が高すぎて欠品しました。", "en": "The demand was too high and we ran out of stock", "display": "The demand was too high / and / we ran out of stock", "point": "run out of で使い果たす・切らすです。", "alt": "High demand caused a stockout." },
  { "id": 239, "grammar": "SCM: Customs", "jp": "税関で止められています。", "en": "It is held at customs", "display": "It is / held / at customs", "point": "customs は税関、held は保留です。", "alt": "Customs has stopped the cargo." },
  { "id": 240, "grammar": "SCM: RFQ", "jp": "見積依頼書を送りました。", "en": "I sent the RFQ", "display": "I / sent / the RFQ", "point": "RFQ（見積依頼書）は基本用語です。", "alt": "A request for quotation was issued." },
  { "id": 241, "grammar": "L3: Present Perfect", "jp": "ちょうど船荷証券（B/L）を受け取りました。", "en": "I have just received the Bill of Lading", "display": "I have just / received / the Bill of Lading", "point": "have just + 過去分詞で「完了」を表します。", "alt": "The B/L has just arrived." },
  { "id": 242, "grammar": "L3: Present Perfect", "jp": "もう最新のスケジュールを見ましたか？", "en": "Have you seen the latest schedule yet", "display": "Have you / seen / the latest schedule / yet", "point": "疑問文の yet は「もう〜しましたか」です。", "alt": "Did you check the new timetable?" },
  { "id": 243, "grammar": "L3: Present Perfect", "jp": "彼はまだ請求書を送ってきていません。", "en": "He has not sent the invoice yet", "display": "He / has not sent / the invoice / yet", "point": "否定文の yet は「まだ〜していない」です。", "alt": "The bill is still missing." },
  { "id": 244, "grammar": "L3: Present Perfect", "jp": "私は以前にその工場を訪問したことがあります。", "en": "I have visited the factory once before", "display": "I have visited / the factory / once before", "point": "現在完了の「経験」を表します。", "alt": "I've been to the plant already." },
  { "id": 245, "grammar": "L3: Present Perfect", "jp": "今まで、海外で働いたことはありますか？", "en": "Have you ever worked abroad", "display": "Have you / ever / worked / abroad", "point": "Have you ever ...? で「経験」を尋ねます。", "alt": "Any experience working overseas?" },
  { "id": 246, "grammar": "L3: Present Perfect", "jp": "私たちは10年間、この会社と取引しています。", "en": "We have done business with this company for ten years", "display": "We have done business / with them / for ten years", "point": "現在完了の「継続」を表します。", "alt": "They have been our partner for a decade." },
  { "id": 247, "grammar": "L3: Present Perfect", "jp": "今朝からずっと忙しいです。", "en": "I have been busy since this morning", "display": "I have been / busy / since this morning", "point": "since で起点を表す「継続」です。", "alt": "My schedule is full since 9 AM." },
  { "id": 248, "grammar": "L3: Passive Voice", "jp": "この製品はドイツで設計されました。", "en": "This product was designed in Germany", "display": "This product / was designed / in Germany", "point": "be動詞過去形 + 過去分詞で「受動態」です。", "alt": "German engineering created this." },
  { "id": 249, "grammar": "L3: Passive Voice", "jp": "その会議は来週開かれます。", "en": "The meeting will be held next week", "display": "The meeting / will be held / next week", "point": "未来の受動態 will be + 過去分詞です。", "alt": "We are holding the meeting next week." },
  { "id": 250, "grammar": "L3: Passive Voice", "jp": "在庫はこのシステムで管理されています。", "en": "The inventory is managed by this system", "display": "The inventory / is managed / by this system", "point": "現在形の受動態です。", "alt": "This system controls our stock." },
  { "id": 251, "grammar": "L3: It is ... to", "jp": "納期を守ることは非常に重要です。", "en": "It is very important to meet the deadline", "display": "It is / very important / to meet the deadline", "point": "形式主語 It の構文。meet the deadline（締切を守る）。", "alt": "The due date is our top priority." },
  { "id": 252, "grammar": "L3: It is ... to", "jp": "私たちが新しいサプライヤーを見つけることは必要です。", "en": "It is necessary for us to find a new supplier", "display": "It is necessary / for us / to find / a new supplier", "point": "for [人] を入れることで主体を明示します。", "alt": "We must locate another vendor." },
  { "id": 253, "grammar": "L3: SVOC", "jp": "そのニュースは私たちを幸せにしました。", "en": "The news made us happy", "display": "The news / made us / happy", "point": "make A B で「AをBの状態にする」第5文型です。", "alt": "We were glad to hear the news." },
  { "id": 254, "grammar": "L3: SVOC", "jp": "私たちはそのプロジェクトを『フェニックス』と呼んでいます。", "en": "We call the project Phoenix", "display": "We call / the project / Phoenix", "point": "call A B で「AをBと呼ぶ」という意味です。", "alt": "The project's name is Phoenix." },
  { "id": 255, "grammar": "L3: SVOC", "jp": "倉庫を常に綺麗に保ってください。", "en": "Please keep the warehouse clean at all times", "display": "Please keep / the warehouse / clean / at all times", "point": "keep A B で「AをBの状態に保つ」です。", "alt": "Maintain a tidy storage area." },
  { "id": 256, "grammar": "L3: Tell A to Do", "jp": "彼に私に電話するように伝えてください。", "en": "Please tell him to call me", "display": "Please tell / him / to call me", "point": "tell + 人 + to [動詞] の形です。", "alt": "Ask him to ring me up." },
  { "id": 257, "grammar": "L3: Want A to Do", "jp": "あなたにこのメールをチェックしてほしいです。", "en": "I want you to check this email", "display": "I want you / to check / this email", "point": "want + 人 + to [動詞] で依頼を表します。", "alt": "I'd like you to review this message." },
  { "id": 258, "grammar": "L3: Ask A to Do", "jp": "彼女に手伝ってくれるよう頼みました。", "en": "I asked her to help me", "display": "I asked her / to help / me", "point": "ask + 人 + to [動詞] で「頼む」です。", "alt": "I requested her assistance." },
  { "id": 259, "grammar": "L3: Indirect Question", "jp": "彼がいつ戻るか知っていますか？", "en": "Do you know when he will come back", "display": "Do you know / when / he will come back", "point": "間接疑問文。when の後は肯定文の語順です。", "alt": "What time is his return?" },
  { "id": 260, "grammar": "L3: Indirect Question", "jp": "なぜ価格が上がったのか分かりません。", "en": "I do not know why the price increased", "display": "I do not know / why / the price increased", "point": "why S + V の形です。increase は「上がる」です。", "alt": "The reason for the price hike is unclear." },
  { "id": 261, "grammar": "L3: Relative Pronoun", "jp": "あそこで話している女性を知っていますか？", "en": "Do you know the woman who is talking there", "display": "Do you know / the woman / who is talking / there", "point": "関係代名詞 who を使い直前の人を説明します。", "alt": "Who is that lady speaking over there?" },
  { "id": 262, "grammar": "L3: Relative Pronoun", "jp": "これは私が探していたファイルです。", "en": "This is the file which I was looking for", "display": "This is the file / which / I was looking for", "point": "関係代名詞 which で物を説明します。", "alt": "I've finally found the file I needed." },
  { "id": 263, "grammar": "L3: Participle", "jp": "ロビーで待っている男性は私の同僚です。", "en": "The man waiting in the lobby is my colleague", "display": "The man / waiting in the lobby / is / my colleague", "point": "現在分詞 waiting が名詞を後ろから修飾します。", "alt": "My coworker is in the lobby now." },
  { "id": 264, "grammar": "L3: Participle", "jp": "これは有名な建築家によって建てられたビルです。", "en": "This is a building built by a famous architect", "display": "This is a building / built by / a famous architect", "point": "過去分詞 built が名詞を後ろから説明します。", "alt": "An eminent architect designed this." },
  { "id": 265, "grammar": "L3: Too ... to", "jp": "この問題は難しすぎて解決できません。", "en": "This problem is too difficult to solve", "display": "This problem / is / too difficult / to solve", "point": "too [形容詞] to [動詞] で「〜すぎて…できない」です。", "alt": "Solving this is impossible." },
  { "id": 266, "grammar": "SCM: Stockout", "jp": "欠品を避けるために在庫を増やしましょう。", "en": "Let's increase inventory to avoid a stockout", "display": "Let's increase inventory / to avoid / a stockout", "point": "stockout は品切れです。avoid（避ける）。", "alt": "We should carry more stock to prevent shortages." },
  { "id": 267, "grammar": "SCM: Bottleneck", "jp": "私たちは工程のボトルネックを見つける必要があります。", "en": "We need to find the bottleneck in the process", "display": "We need to find / the bottleneck / in the process", "point": "bottleneck は停滞箇所を指します。", "alt": "Identify the constraint in our workflow." },
  { "id": 268, "grammar": "SCM: RFQ", "jp": "3社のベンダーに見積依頼書（RFQ）を出しました。", "en": "I issued an RFQ to three vendors", "display": "I issued / an RFQ / to three vendors", "point": "issue（出す）。vendor はサプライヤーです。", "alt": "I requested quotes from three companies." },
  { "id": 269, "grammar": "SCM: Logistics", "jp": "配送コストを削減しましょう。", "en": "Let's reduce the shipping costs", "display": "Let's / reduce / the shipping costs", "point": "shipping cost（配送費）の削減です。", "alt": "Cut down our logistics expenses." },
  { "id": 270, "grammar": "SCM: Track", "jp": "荷物はオンラインで追跡できます。", "en": "You can track the package online", "display": "You can / track / the package / online", "point": "track は「追跡する」という動詞です。", "alt": "Shipment status is available on the web." },
  { "id": 271, "grammar": "L3: Present Perfect Continuous", "jp": "1時間ずっとそのデータを探し続けています。", "en": "I have been looking for that data for an hour", "display": "I have been / looking for / that data / for an hour", "point": "have been + ing で動作の継続（現在も進行中）を強調します。", "alt": "I spent the last hour searching for the data." },
  { "id": 272, "grammar": "L3: Passive Voice", "jp": "その荷物はまだ出荷されていません。", "en": "The package has not been shipped yet", "display": "The package / has not been shipped / yet", "point": "現在完了の受動態否定形です。", "alt": "The shipment is still waiting for dispatch." },
  { "id": 273, "grammar": "L3: Indirect Question", "jp": "彼がどうやってその問題を解決したか知りたいです。", "en": "I want to know how he solved the problem", "display": "I want to know / how / he solved / the problem", "point": "how S + V（どのように〜したか）という間接疑問です。", "alt": "Explain his solution method to me." },
  { "id": 274, "grammar": "L3: Tag Question", "jp": "あなたはまだその資料を持っていますよね？", "en": "You still have the document, don't you", "display": "You still have the document, / don't you", "point": "付加疑問文「〜ですよね？」です。一般動詞なので don't you になります。", "alt": "The file is still with you, correct?" },
  { "id": 275, "grammar": "L3: SVOC", "jp": "その新しいシステムは非常に使いやすいと分かりました。", "en": "I found the new system very easy to use", "display": "I found / the new system / very easy / to use", "point": "find A B で「AがBだと分かる」です。", "alt": "The new system is user-friendly." },
  { "id": 276, "grammar": "L3: Present Perfect", "jp": "私たちはようやく調達コストを削減しました。", "en": "We have finally reduced the procurement cost", "display": "We have finally / reduced / the procurement cost", "point": "procurement（調達）です。finally で「ようやく」感が出ます。", "alt": "Purchasing expenses are lower now." },
  { "id": 277, "grammar": "L3: It is ... to", "jp": "私たちがトレンドを把握しておくことは不可欠です。", "en": "It is essential for us to keep track of the trends", "display": "It is essential / for us / to keep track of / the trends", "point": "keep track of ... で「〜を見失わない／把握し続ける」という熟語です。", "alt": "Staying updated on trends is a must." },
  { "id": 278, "grammar": "L3: Relative Pronoun", "jp": "これは、彼がずっと探していた答えです。", "en": "This is the answer that he was looking for", "display": "This is the answer / that / he was looking for", "point": "関係代名詞 that を使った説明です。", "alt": "He finally found what he wanted." },
  { "id": 279, "grammar": "L3: Passive Voice", "jp": "この企画は田中さんによって提案されました。", "en": "This project was proposed by Mr. Tanaka", "display": "This project / was proposed / by Mr. Tanaka", "point": "by [人] で動作主を表します。propose（提案する）。", "alt": "Mr. Tanaka came up with this plan." },
  { "id": 280, "grammar": "L3: Help A do", "jp": "荷物を運ぶのを手伝いましょうか？", "en": "Shall I help you carry the luggage", "display": "Shall I / help you / carry the luggage", "point": "help + 人 + 動詞の原形です。to は省略が一般的です。", "alt": "Need a hand with those bags?" },
  { "id": 281, "grammar": "L3: Perception Verb", "jp": "彼が隣の部屋で電話しているのを聞きました。", "en": "I heard him talking on the phone in the next room", "display": "I heard him / talking on the phone / in the next room", "point": "hear + 人 + ing で「人が〜しているのを聞く」です。", "alt": "I overheard his call from next door." },
  { "id": 282, "grammar": "L3: Enough to", "jp": "この製品は航空輸送するのに十分な価値があります。", "en": "This product is valuable enough to be shipped by air", "display": "This product / is / valuable enough / to be shipped / by air", "point": "形容詞 + enough to ... で「〜するのに十分…だ」となります。", "alt": "The item's value justifies air freight costs." },
  { "id": 283, "grammar": "L3: Suggest that", "jp": "明日の朝、もう一度チェックすることを提案します。", "en": "I suggest that we check it again tomorrow morning", "display": "I suggest / that we / check it again / tomorrow morning", "point": "suggest that S + V（原形）でフォーマルな提案です。", "alt": "Let's do a final check tomorrow." },
  { "id": 284, "grammar": "L3: Present Perfect", "jp": "私たちは長い間お互いを知っています。", "en": "We have known each other for a long time", "display": "We have known / each other / for a long time", "point": "know は状態動詞なので ing にせず現在完了で継続を表します。", "alt": "We are old acquaintances." },
  { "id": 285, "grammar": "L3: Goal Achieved", "jp": "ついにサプライチェーンの効率を高めました。", "en": "We have finally increased the efficiency of the supply chain", "display": "We have finally / increased / the efficiency / of the supply chain", "point": "SCMの究極の目標。効率（efficiency）。", "alt": "Supply chain productivity is up." },
  { "id": 286, "grammar": "L1: Be verb", "jp": "今日はとても暑いですね。", "en": "It is very hot today, isn't it", "display": "It is / very hot / today, isn't it", "point": "天候の it と付加疑問文です。", "alt": "Quite a warm day." },
  { "id": 287, "grammar": "L1: Present Simple", "jp": "月曜日はいつも忙しいです。", "en": "I am always busy on Mondays", "display": "I am always / busy / on Mondays", "point": "習慣的な曜日なので複数形 Mondays です。", "alt": "Mondays are hectic for me." },
  { "id": 288, "grammar": "L1: Can", "jp": "この書類をスキャンしてくれますか？", "en": "Can you scan this document", "display": "Can you / scan / this document", "point": "依頼の can とスキャン(scan)です。", "alt": "Could you please digitize this file?" },
  { "id": 289, "grammar": "L1: Past Simple", "jp": "彼は1時間前にそのメールを見ました。", "en": "He saw the email an hour ago", "display": "He saw / the email / an hour ago", "point": "see の過去形 saw と時間表現 ago です。", "alt": "He checked the message an hour back." },
  { "id": 290, "grammar": "L1: Whose", "jp": "このタブレットは誰のものですか？", "en": "Whose tablet is this", "display": "Whose tablet / is this", "point": "所有者を尋ねる Whose です。", "alt": "Does this tablet belong to anyone?" },
  { "id": 291, "grammar": "L2: Shall I", "jp": "資料を共有しましょうか？", "en": "Shall I share the documents", "display": "Shall I / share / the documents", "point": "申し出の Shall I ...? です。共有(share)。", "alt": "Do you want me to present the files?" },
  { "id": 292, "grammar": "L2: Shall we", "jp": "一緒にランチに行きませんか？", "en": "Shall we go to lunch together", "display": "Shall we / go to lunch / together", "point": "誘いの表現。together（一緒に）を添えます。", "alt": "Why don't we have lunch?" },
  { "id": 293, "grammar": "L2: Have to", "jp": "急ぐ必要はありません。", "en": "You do not have to hurry", "display": "You do not / have to / hurry", "point": "「〜しなくてよい（不必要）」を表します。", "alt": "No need to rush." },
  { "id": 294, "grammar": "L2: Comparison", "jp": "このプロジェクトは以前のものより面白いです。", "en": "This project is more interesting than the last one", "display": "This project / is more interesting / than the last one", "point": "長い形容詞の比較級 more の復習です。", "alt": "I find this project more engaging." },
  { "id": 295, "grammar": "L2: Conjunction", "jp": "彼が戻ったら、私に知らせてください。", "en": "When he comes back, please let me know", "display": "When he comes back / please / let me know", "point": "when節の中の現在形と let me know（知らせる）です。", "alt": "Inform me upon his return." },
  { "id": 296, "grammar": "L2: Passive Voice", "jp": "その問題はまだ解決されていません。", "en": "The problem has not been solved yet", "display": "The problem / has not been / solved yet", "point": "現在完了の受動態。未解決の状況報告です。", "alt": "The issue is still outstanding." },
  { "id": 297, "grammar": "L3: Present Perfect", "jp": "ちょうど会議が終わったところです。", "en": "The meeting has just finished", "display": "The meeting / has / just finished", "point": "完了したばかりの状況報告です。", "alt": "The meeting just wrapped up." },
  { "id": 298, "grammar": "L3: Want A to Do", "jp": "あなたにこの契約書にサインしてほしいです。", "en": "I want you to sign this contract", "display": "I want you / to sign / this contract", "point": "want 人 to ...（人に〜してほしい）のビジネス活用です。", "alt": "I'd like your signature on this agreement." },
  { "id": 299, "grammar": "L3: Tell A to Do", "jp": "彼らに静かにするように言ってください。", "en": "Please tell them to be quiet", "display": "Please tell them / to be / quiet", "point": "tell 人 to + be動詞 + 形容詞 の形です。", "alt": "Ask them to lower their voices." },
  { "id": 300, "grammar": "L3: Passive Voice", "jp": "このアプリは若い技術者によって作られました。", "en": "This app was created by a young engineer", "display": "This app / was created / by a young engineer", "point": "created by ... で開発元を示します。", "alt": "A young talent developed this software." },
  { "id": 301, "grammar": "L3: Relative Pronoun", "jp": "これは彼がずっと探していた辞書です。", "en": "This is the dictionary that he was looking for", "display": "This is the dictionary / that / he was looking for", "point": "関係代名詞 that を使った物の説明です。", "alt": "He finally found his missing dictionary." },
  { "id": 302, "grammar": "L3: Indirect Question", "jp": "彼がどうやってそこへ行ったか知っていますか？", "en": "Do you know how he went there", "display": "Do you know / how / he went there", "point": "how S + V（どうやって〜したか）の間接疑問です。", "alt": "Are you aware of his travel method?" },
  { "id": 303, "grammar": "L3: Perception Verb", "jp": "彼がロビーで電話しているのを聞きました。", "en": "I heard him talking on the phone in the lobby", "display": "I heard him / talking on the phone / in the lobby", "point": "hear 人 ing の復習です。", "alt": "I overheard his call." },
  { "id": 304, "grammar": "L3: SVOC", "jp": "秘書にスケジュールを調整させます。", "en": "I will have my secretary adjust the schedule", "display": "I will have / my secretary / adjust the schedule", "point": "have 人 動詞の原形。「人に〜してもらう」。", "alt": "I'll ask my assistant to re-arrange things." },
  { "id": 305, "grammar": "L3: Indirect Question", "jp": "これが誰の車か分かりますか？", "en": "Do you know whose car this is", "display": "Do you know / whose car / this is", "point": "whose car this is の語順を覚えましょう。", "alt": "Can you identify the owner of this vehicle?" },
  { "id": 306, "grammar": "SCM: Logistics", "jp": "彼女は営業部で働いています。", "en": "She works in the sales department", "display": "She works / in the sales department", "point": "部署の前置詞は in です。営業(sales)。", "alt": "She's a member of the sales team." },
  { "id": 307, "grammar": "L1: Be verb", "jp": "私は新しいマーケティング・マネージャーです。", "en": "I am the new marketing manager", "display": "I am / the new / marketing manager", "point": "役職の紹介の基本文です。", "alt": "I've taken over marketing." },
  { "id": 308, "grammar": "L1: Negative", "jp": "彼らはこの地域では有名ではありません。", "en": "They are not famous in this area", "display": "They are not / famous / in this area", "point": "否定文と場所の in です。", "alt": "They have low brand awareness here." },
  { "id": 309, "grammar": "L1: Imperative", "jp": "総務部に連絡してください。", "en": "Please contact the general affairs department", "display": "Please contact / the general affairs department", "point": "general affairs（総務）は重要単語です。", "alt": "Get in touch with Admin." },
  { "id": 310, "grammar": "L2: To-Infinitive", "jp": "工場を見学する時間はありますか？", "en": "Do you have time to visit the factory", "display": "Do you have time / to visit / the factory", "point": "time to [動詞] で「〜するための時間」です。", "alt": "Is a factory tour possible?" },
  { "id": 311, "grammar": "L2: Future", "jp": "開発チームに確認してみます。", "en": "I will check with the development team", "display": "I will check / with / the development team", "point": "check with [人] で「〜に確認する」です。", "alt": "I'll ask the engineers." },
  { "id": 312, "grammar": "L3: Present Perfect", "jp": "広報部はもうプレスリリースを出しました。", "en": "The PR department has already issued the press release", "display": "The PR department / has / already issued / the release", "point": "issue（出す）。already で「すでに」を強調。", "alt": "The news is already public." },
  { "id": 313, "grammar": "L3: Passive Voice", "jp": "そのシステムは社内エンジニアによって構築されました。", "en": "The system was built by our in-house engineers", "display": "The system / was built / by our in-house engineers", "point": "in-house（社内の）はビジネス形容詞です。", "alt": "We built it ourselves." },
  { "id": 314, "grammar": "L3: Relative Pronoun", "jp": "これは私が先ほど話していた資料です。", "en": "This is the document that I was talking about", "display": "This is the document / that / I was talking about", "point": "talk about（〜について話す）を関係代名詞で繋いでいます。", "alt": "Here is the material I mentioned." },
  { "id": 315, "grammar": "L3: It is ... to", "jp": "コストを削減することは必要です。", "en": "It is necessary to reduce costs", "display": "It is necessary / to reduce / costs", "point": "It is [形容詞] to [動詞] の基本。reduce（削減する）。", "alt": "Cost reduction is essential." },
  { "id": 316, "grammar": "SCM: Freight", "jp": "航空運賃は非常に高いです。", "en": "The air freight is very high", "display": "The air freight / is / very high", "point": "air freight（航空運賃）の基本文です。", "alt": "Air shipping is expensive." },
  { "id": 317, "grammar": "SCM: Warehouse", "jp": "倉庫は満杯です。", "en": "The warehouse is full", "display": "The warehouse / is / full", "point": "キャパシティが限界であることを伝えます。", "alt": "Storage space is exhausted." },
  { "id": 318, "grammar": "SCM: Label", "jp": "すべての箱にラベルを貼ってください。", "en": "Please put a label on all the boxes", "display": "Please put / a label / on all the boxes", "point": "put A on B（AをBに貼る）。", "alt": "Label every carton." },
  { "id": 319, "grammar": "SCM: Carrier", "jp": "新しい配送業者を選びましょう。", "en": "Let's choose a new carrier", "display": "Let's / choose / a new carrier", "point": "carrier は配送業者・船社を指します。", "alt": "Let's switch logistics companies." },
  { "id": 320, "grammar": "SCM: Palletize", "jp": "商品はパレット積みされます。", "en": "The items are palletized", "display": "The items / are / palletized", "point": "palletize（パレットに積む）の受動態です。", "alt": "Goods are on pallets." },
  { "id": 321, "grammar": "L3: Present Perfect Continuous", "jp": "30分ずっとタクシーを待っています。", "en": "I have been waiting for a taxi for thirty minutes", "display": "I have been / waiting for / a taxi / for 30 min", "point": "have been ing の復習です。", "alt": "30 minutes of taxi waiting so far." },
  { "id": 322, "grammar": "L3: Passive Voice", "jp": "その荷物は明日、配達されます。", "en": "The package will be delivered tomorrow", "display": "The package / will be delivered / tomorrow", "point": "未来の受動態 will be delivered です。", "alt": "Delivery is set for tomorrow." },
  { "id": 323, "grammar": "L3: Relative Pronoun", "jp": "彼女は私が一緒に働きたい人です。", "en": "She is the person that I want to work with", "display": "She is the person / that / I want to work with", "point": "関係代名詞の後に前置詞 with が残る形です。", "alt": "I'd love her as a colleague." },
  { "id": 324, "grammar": "L3: SVOC", "jp": "この仕事は私を疲れさせました。", "en": "This work made me tired", "display": "This work / made / me / tired", "point": "make 人 形容詞 の復習です。", "alt": "This task is exhausting." },
  { "id": 325, "grammar": "L3: Indirect Question", "jp": "何が一番良いか教えてください。", "en": "Tell me what is the best", "display": "Tell me / what / is the best", "point": "what is the best の語順です。", "alt": "Which one do you recommend?" },
  { "id": 326, "grammar": "L3: Present Perfect", "jp": "私は以前ここに来たことがあります。", "en": "I have been here before", "display": "I have / been / here before", "point": "場所への経験 have been here です。", "alt: "This place is familiar to me." },
  { "id": 327, "grammar": "L3: It is ... to", "jp": "あなたが成功することは可能です。", "en": "It is possible for you to succeed", "display": "It is possible / for you / to succeed", "point: "It is ... for 人 to の復習。succeed（成功する）。", "alt": "You can definitely do it." },
  { "id": 328, "grammar": "L3: Relative Pronoun", "jp": "あそこで走っている猫を見て。", "en": "Look at the cat which is running there", "display": "Look at the cat / which is running / there", "point": "which節による修飾です。", "alt": "See that running cat?" },
  { "id": 329, "grammar": "L3: Too ... to", "jp": "寒すぎて泳げません。", "en": "It is too cold to swim", "display": "It is / too cold / to swim", "point": "too cold to の復習。主語は it です。", "alt": "The water is freezing." },
  { "id": 330, "grammar": "L3: Indirect Question", "jp": "どこへ行くべきか教えてください。", "en": "Please tell me where I should go", "display": "Please tell me / where / I should go", "point": "where + 主語 + 助動詞 + 動詞 の語順です。", "alt": "Directions, please." },
  { "id": 331, "grammar": "SCM: Customs", "jp": "関税を計算しましたか？", "en": "Did you calculate the customs duty", "display": "Did you / calculate / the customs duty", "point": "calculate（計算）。duty（関税）。", "alt": "Is the tariff worked out?" },
  { "id": 332, "grammar": "SCM: Manifest", "jp": "マニフェストを確認してください。", "en": "Please check the manifest", "display": "Please / check / the manifest", "point": "manifest（積荷目録）は物流用語です。", "alt": "Review the cargo list." },
  { "id": 333, "grammar": "SCM: Cycle Count", "jp": "棚卸しを終えました。", "en": "I finished the cycle count", "display": "I / finished / the cycle count", "point": "cycle count は在庫確認です。", "alt": "Physical inventory check is done." },
  { "id": 334, "grammar": "SCM: Expedite", "jp": "発送を急がせてください。", "en": "Please expedite the shipping", "display": "Please / expedite / the shipping", "point": "expedite（急がせる）はビジネス語です。", "alt": "Rush the dispatch." },
  { "id": 335, "grammar": "SCM: Lead Time", "jp": "リードタイムはどのくらいですか？", "en": "How long is the lead time", "display": "How long / is / the lead time", "point": "納期確認の基本フレーズです。", "alt": "What's the turnaround?" },
  { "id": 336, "grammar": "L3: Present Perfect Continuous", "jp": "3時間ずっとその本を読んでいます。", "en": "I have been reading that book for three hours", "display": "I have been / reading / that book / for 3 hours", "point": "継続強調の have been -ing です。", "alt": "3 hours of reading so far." },
  { "id": 337, "grammar": "L3: Passive Voice", "jp": "その手紙は彼に送られるでしょう。", "en": "The letter will be sent to him", "display": "The letter / will be sent / to him", "point": "未来の受動態 will be sent です。", "alt": "He'll get the letter tomorrow." },
  { "id": 338, "grammar": "L3: SVOC", "jp": "私たちは彼を監督にしました。", "en": "We made him a supervisor", "display": "We made / him / a supervisor", "point": "make 人 名詞 の第5文型です。", "alt": "He was promoted." },
  { "id": 339, "grammar": "L3: It is ... to", "jp": "嘘をつくことは悪いです。", "en": "It is bad to tell a lie", "display": "It is / bad / to tell a lie", "point": "形式主語 It の復習です。", "alt": "Lying is wrong." },
  { "id": 340, "grammar": "L3: Indirect Question", "jp": "何が起こったか知っていますか？", "en": "Do you know what happened", "display": "Do you know / what / happened", "point": "what happened（何が起きたか）の活用です。", "alt": "Are you aware of the situation?" },
  { "id": 341, "grammar": "L3: Present Perfect", "jp": "私はちょうど宿題を終えました。", "en": "I have just finished my homework", "display": "I have just / finished / my homework", "point": "完了用法 have just です。", "alt": "Homework done." },
  { "id": 342, "grammar": "L3: Passive Voice", "jp": "これは有名な歌手によって歌われました。", "en": "This was sung by a famous singer", "display": "This was / sung / by a famous singer", "point": "sung は sing の過去分詞です。", "alt": "A celebrity sang this." },
  { "id": 343, "grammar": "L3: Relative Pronoun", "jp": "彼は私が信頼している友人です。", "en": "He is the friend that I trust", "display": "He is the friend / that / I trust", "point": "関係代名詞 that の活用です。", "alt": "I trust him completely." },
  { "id": 344, "grammar": "L3: Too ... to", "jp": "暗すぎて何も見えません。", "en": "It is too dark to see anything", "display": "It is / too dark / to see anything", "point": "too ... to と否定の anything です。", "alt": "Visibility is zero." },
  { "id": 345, "grammar": "L3: Indirect Question", "jp": "彼が誰か教えてください。", "en": "Please tell me who he is", "display": "Please tell me / who / he is", "point": "who he is の語順に注意です。", "alt": "Introduce him to me." },
  { "id": 346, "grammar": "SCM: Sourcing", "jp": "より安価なサプライヤーを探すべきです。", "en": "We should look for a cheaper supplier", "display": "We should / look for / a cheaper supplier", "point": "提案の should と比較級です。", "alt": "Find a more cost-effective vendor." },
  { "id": 347, "grammar": "SCM: Stock", "jp": "在庫を減らす必要があります。", "en": "We need to reduce the stock", "display": "We need / to reduce / the stock", "point": "reduce（減らす）はSCMのキーワードです。", "alt": "Lower the inventory." },
  { "id": 348, "grammar": "SCM: Logistics", "jp": "ロジスティクスを改善しましょう。", "en": "Let's improve the logistics", "display": "Let's / improve / the logistics", "point": "improve（改善する）は常に求められます。", "alt": "Better logistics, please." },
  { "id": 349, "grammar": "SCM: B/L", "jp": "B/Lをチェックしましたか？", "en": "Did you check the B/L", "display": "Did you / check / the B/L", "point": "B/L（船荷証券）は貿易の要です。", "alt": "Is the shipping document verified?" },
  { "id": 350, "grammar": "SCM: Order", "jp": "注文はキャンセルされました。", "en": "The order was canceled", "display": "The order / was / canceled", "point": "cancel（キャンセルする）の受動態です。", "alt": "Cancellation confirmed." },
{ "id": 351, "grammar": "L3: Present Perfect (Completion)", "jp": "予算案の作成をちょうど終えたところです。", "en": "I have just finished preparing the budget proposal", "display": "I have just / finished / preparing / the budget proposal", "point": "have just + 過去分詞に加え、finish + 動名詞(-ing)を組み合わせた形です。", "alt": "The budget draft is finally ready." },
  { "id": 352, "grammar": "L3: Present Perfect (Experience)", "jp": "以前、同様のトラブルを経験したことがあります。", "en": "I have experienced a similar trouble before", "display": "I have experienced / a similar trouble / before", "point": "have + 過去分詞の経験用法。similar（似たような）はビジネス頻出語です。", "alt": "I've dealt with this kind of issue in the past." },
  { "id": 353, "grammar": "L3: Present Perfect (Duration)", "jp": "この会社は20年間、業界でトップです。", "en": "This company has been the leader in this industry for twenty years", "display": "This company / has been / the leader / in this industry / for twenty years", "point": "has been で「ずっと〜である」という状態の継続を表します。", "alt": "We have led this market for two decades." },
  { "id": 354, "grammar": "L3: Present Perfect Continuous", "jp": "午後からずっと次の戦略について考えています。", "en": "I have been thinking about the next strategy since afternoon", "display": "I have been thinking / about the next strategy / since afternoon", "point": "have been -ing で「（今も）ずっと考え続けている」継続を強調します。", "alt": "I've been focusing on our future plans all afternoon." },
  { "id": 355, "grammar": "L3: Passive Voice (Present)", "jp": "これらのガイドラインは全従業員に適用されます。", "en": "These guidelines are applied to all employees", "display": "These guidelines / are applied / to all employees", "point": "apply to ... で「〜に適用される」という受動態です。", "alt": "Everyone in the company must follow these rules." },
  { "id": 356, "grammar": "L3: Passive Voice (with Modals)", "jp": "そのミスは二度と繰り返されるべきではありません。", "en": "The mistake should not be repeated again", "display": "The mistake / should not / be repeated / again", "point": "should + be + 過去分詞で「〜されるべきだ」という強い助言です。", "alt": "We must ensure this error doesn't happen twice." },
  { "id": 357, "grammar": "L3: Passive Voice (Future)", "jp": "最終決定は金曜日に下される予定です。", "en": "The final decision will be made on Friday", "display": "The final decision / will be made / on Friday", "point": "make a decision（決定を下す）の受動態 will be made です。", "alt": "We'll have the final answer by Friday." },
  { "id": 358, "grammar": "L3: Indirect Question (Whether)", "jp": "彼がオファーを受けるかどうか確信が持てません。", "en": "I am not sure whether he will accept the offer", "display": "I am not sure / whether / he will accept / the offer", "point": "whether...（〜かどうか）を使った間接疑問文です。", "alt": "It's uncertain if he'll say yes to the proposal." },
  { "id": 359, "grammar": "L3: Indirect Question (Wh-)", "jp": "なぜそのプロジェクトが失敗したのか教えてください。", "en": "Please tell me why the project failed", "display": "Please tell me / why / the project failed", "point": "why の後の語順が肯定文（the project failed）になるのがポイントです。", "alt": "Could you explain the reasons for the failure?" },
  { "id": 360, "grammar": "L3: Relative Pronoun (Who)", "jp": "交渉が得意な上司がいます。", "en": "I have a boss who is good at negotiating", "display": "I have a boss / who / is good at negotiating", "point": "関係代名詞 who が主語の働きをして、上司を詳しく説明しています。", "alt": "My manager is an excellent negotiator." },
  { "id": 361, "grammar": "L3: Relative Pronoun (Which)", "jp": "これは私が昨日会議で話した計画です。", "en": "This is the plan which I talked about yesterday", "display": "This is the plan / which / I talked about / yesterday", "point": "which節の中で talked about の後の目的語が欠けている「目的格」です。", "alt": "Here is the proposal I mentioned yesterday." },
  { "id": 362, "grammar": "L3: Relative Pronoun (Whose)", "jp": "歴史が非常に長い会社で働いています。", "en": "I work for a company whose history is very long", "display": "I work for a company / whose history / is / very long", "point": "whose + 名詞 で「〜の歴史が…な会社」という所有を表します。", "alt": "My company has a long-standing tradition." },
  { "id": 363, "grammar": "L3: SVOC (Make)", "jp": "その効率的なツールは私たちの仕事を楽にしました。", "en": "The efficient tool made our work easy", "display": "The efficient tool / made / our work / easy", "point": "make + O + C で「OをCの状態にする」ビジネス頻出表現です。", "alt": "Our task became easier with this tool." },
  { "id": 364, "grammar": "L3: SVOC (Keep)", "jp": "顧客情報を安全に保つことが不可欠です。", "en": "It is essential to keep customer information safe", "display": "It is essential / to keep / customer information / safe", "point": "It is ... to 構文の中に keep O C が入った形です。", "alt": "Ensuring client data security is a must." },
  { "id": 365, "grammar": "L3: SVOC (Find)", "jp": "彼はその新しい市場が非常に有望だと分かりました。", "en": "He found the new market very promising", "display": "He found / the new market / very promising", "point": "find O C で「OがCだと気づく／分かる」。promising は有望な。", "alt": "The new market seemed very attractive to him." },
  { "id": 366, "grammar": "SCM: Excess Inventory", "jp": "過剰在庫を削減しなければなりません。", "en": "We must reduce the excess inventory", "display": "We must / reduce / the excess inventory", "point": "excess inventory（過剰在庫）の削減は重要課題です。", "alt": "Cut down on surplus stock." },
  { "id": 367, "grammar": "SCM: Distribution", "jp": "配送センターは24時間稼働しています。", "en": "The distribution center is operating twenty-four hours", "display": "The distribution center / is operating / 24 hours", "point": "distribution center (DC) は「配送センター」です。", "alt": "The warehouse is open 24/7." },
  { "id": 368, "grammar": "SCM: Backlog", "jp": "私たちは大量のバックログを抱えています。", "en": "We have a large backlog of orders", "display": "We have / a large backlog / of orders", "point": "backlog は「未処理の注文・残務」のことです。", "alt": "Many orders are waiting to be processed." },
  { "id": 369, "grammar": "SCM: Tracking", "jp": "貨物の追跡番号を送ってもらえますか？", "en": "Can you send me the tracking number", "display": "Can you / send me / the tracking number", "point": "tracking number（追跡番号）で貨物の位置を確認します。", "alt": "Provide the shipment ID, please." },
  { "id": 370, "grammar": "SCM: Customs Clear", "jp": "貨物はまだ税関を通過していません。", "en": "The cargo has not cleared customs yet", "display": "The cargo / has not cleared / customs yet", "point": "clear customs で「通関する（税関を通過する）」です。", "alt": "Shipment is stuck at the border." },
  { "id": 371, "grammar": "SCM: Freight Rates", "jp": "海上運賃を確認する必要があります。", "en": "We need to check the sea freight rates", "display": "We need / to check / the sea freight rates", "point": "freight rates は「運賃」です。", "alt": "Verify the ocean shipping costs." },
  { "id": 372, "grammar": "SCM: Sourcing", "jp": "原材料は世界中から調達されています。", "en": "Raw materials are sourced from all over the world", "display": "Raw materials / are sourced / from / all over the world", "point": "source は「（原材料を）調達する」という受動態です。", "alt": "We buy materials globally." },
  { "id": 373, "grammar": "SCM: Capacity", "jp": "このトラックはすべての荷物を運ぶのに十分な大きさです。", "en": "This truck is large enough to carry all the packages", "display": "This truck / is / large enough / to carry / all the packages", "point": "large enough to で容量の十分さを表します。", "alt": "The capacity is sufficient for this load." },
  { "id": 374, "grammar": "SCM: WMS", "jp": "倉庫管理システム（WMS）を更新してください。", "en": "Please update the WMS", "display": "Please / update / the WMS", "point": "WMS（倉庫管理システム）はSCMの基本ITです。", "alt": "Refresh the warehouse software." },
  { "id": 375, "grammar": "SCM: ETA", "jp": "到着予定時刻（ETA）を教えてください。", "en": "Please tell me the ETA", "display": "Please / tell me / the ETA", "point": "ETA は Estimated Time of Arrival の略です。", "alt": "When is it expected to arrive?" },
  { "id": 376, "grammar": "L3: Present Perfect Continuous", "jp": "午前中ずっと、貨物を追跡し続けています。", "en": "I have been tracking the cargo all morning", "display": "I have been / tracking / the cargo / all morning", "point": "朝から今も追跡中である継続を強調します。", "alt": "I've spent the morning on tracking." },
  { "id": 377, "grammar": "L3: Passive Voice", "jp": "その注文はキャンセルされました。", "en": "The order was canceled", "display": "The order / was / canceled", "point": "キャンセルされたという過去の受動態報告です。", "alt": "The order is no longer active." },
  { "id": 378, "grammar": "L3: Indirect Question", "jp": "配送コストがいくらになるか分かりますか？", "en": "Do you know how much the shipping cost will be", "display": "Do you know / how much / the cost / will be", "point": "間接疑問文の語順、cost will be に注意。", "alt": "Any idea about the freight expense?" },
  { "id": 379, "grammar": "SCM: Optimize", "jp": "配送ルートを最適化しましょう。", "en": "Let's optimize the delivery route", "display": "Let's / optimize / the delivery route", "point": "optimize（最適化する）はSCMの頻出単語です。", "alt": "Improve the shipping path." },
  { "id": 380, "grammar": "SCM: Replenish", "jp": "在庫を補充してください。", "en": "Please replenish the inventory", "display": "Please / replenish / the inventory", "point": "replenish（補充する）は在庫管理の重要語です。", "alt": "Restock the items." },
  { "id": 381, "grammar": "L1: Present Simple", "jp": "彼は物流担当です。", "en": "He is in charge of logistics", "display": "He is / in charge of / logistics", "point": "be in charge of（〜を担当している）は必須です。", "alt": "Logistics is his responsibility." },
  { "id": 382, "grammar": "L1: Be verb", "jp": "これは私の同僚の名刺です。", "en": "This is my colleague's business card", "display": "This is / my colleague's / business card", "point": "colleague's で「同僚の（所有格）」です。", "alt": "Here is my coworker's card." },
  { "id": 383, "grammar": "L1: Wh-Quest", "jp": "誰がこの資料を作りましたか？", "en": "Who made this document", "display": "Who / made / this document", "point": "過去の誰が〜したかを聞く基本形です。", "alt": "Who prepared these papers?" },
  { "id": 384, "grammar": "L1: Past Simple", "jp": "今朝、メールを確認しました。", "en": "I checked the email this morning", "display": "I checked / the email / this morning", "point": "checked と過去形を使います。", "alt": "I looked at the inbox earlier." },
  { "id": 385, "grammar": "L1: Can", "jp": "明日お会いできますか？", "en": "Can I see you tomorrow", "display": "Can I / see you / tomorrow", "point": "依頼や提案の can です。", "alt": "Are you available tomorrow?" },
  { "id": 386, "grammar": "L2: Future", "jp": "後で連絡します。", "en": "I will contact you later", "display": "I will / contact / you later", "point": "その場で決めた will です。", "alt": "I'll be in touch." },
  { "id": 387, "grammar": "L2: Must", "jp": "静かにしなければなりません。", "en": "You must be quiet", "display": "You / must / be quiet", "point": "義務の must と be動詞の原形です。", "alt": "Please keep the noise down." },
  { "id": 388, "grammar": "L2: To-Infinitive", "jp": "私は勝つために一生懸命働きます。", "en": "I work hard to win", "display": "I work hard / to win", "point": "目的を表す不定詞です。", "alt": "Working hard for victory." },
  { "id": 389, "grammar": "L2: Comparison", "jp": "彼は私より背が高いです。", "en": "He is taller than me", "display": "He / is / taller than me", "point": "比較級の er 形です。", "alt": "I am shorter than him." },
  { "id": 390, "grammar": "L2: Superlative", "jp": "これが最も重要なポイントです。", "en": "This is the most important point", "display": "This is / the most important / point", "point": "長い形容詞の最上級 the most です。", "alt": "The key point is this." },
  { "id": 391, "grammar": "SCM: Forklift", "jp": "フォークリフトが故障しています。", "en": "The forklift is broken", "display": "The forklift / is / broken", "point": "forklift は倉庫現場の必須単語です。", "alt": "The lift is out of order." },
  { "id": 392, "grammar": "SCM: KPI", "jp": "KPIを確認しましょう。", "en": "Let's check the KPIs", "display": "Let's / check / the KPIs", "point": "KPIは重要業績指標です。", "alt": "Review our performance metrics." },
  { "id": 393, "grammar": "SCM: Cycle Count", "jp": "棚卸しを開始してください。", "en": "Please start the cycle count", "display": "Please / start / the cycle count", "point": "cycle count（棚卸し）の開始指示です。", "alt": "Begin the stock check." },
  { "id": 394, "grammar": "SCM: Manifest", "jp": "マニフェストはどこですか？", "en": "Where is the manifest", "display": "Where / is / the manifest", "point": "manifest（積荷目録）の場所を尋ねます。", "alt": "Find the cargo list." },
  { "id": 395, "grammar": "SCM: Order", "jp": "注文を受け取りました。", "en": "We received the order", "display": "We / received / the order", "point": "receive は「受け取る」です。", "alt": "The order is in." },
  { "id": 396, "grammar": "L3: Present Perfect", "jp": "私はもう宿題を終えました。", "en": "I have already finished my homework", "display": "I have already / finished / my homework", "point": "完了の have already です。", "alt": "Homework is done." },
  { "id": 397, "grammar": "L3: Passive", "jp": "その窓は壊されていました。", "en": "The window was broken", "display": "The window / was / broken", "point": "過去の受動態（状態）です。", "alt": "Broken window found." },
  { "id": 398, "grammar": "L3: SVOC", "jp": "私たちは彼を監督にしました。", "en": "We made him a supervisor", "display": "We made / him / a supervisor", "point": "make 人 名詞 の第5文型です。", "alt": "He was promoted." },
  { "id": 399, "grammar": "L3: Relative Pronoun", "jp": "これは彼が書いた本です。", "en": "This is the book that he wrote", "display": "This is the book / that / he wrote", "point": "物(book)を修飾する関係代名詞です。", "alt": "His written book." },
  { "id": 400, "grammar": "L3: Indirect Question", "jp": "何が一番良いか教えてください。", "en": "Tell me what is the best", "display": "Tell me / what is / the best", "point": "what is the best の語順です。", "alt": "What's the top choice?" },
  { "id": 401, "grammar": "SCM: Vendor", "jp": "ベンダーに連絡してください。", "en": "Please contact the vendor", "display": "Please / contact / the vendor", "point": "vendor は取引先の別称です。", "alt": "Call the supplier." },
  { "id": 402, "grammar": "SCM: SKU", "jp": "SKUはいくつありますか？", "en": "How many SKUs are there", "display": "How many / SKUs / are there", "point": "在庫品目数(SKU)を尋ねます。", "alt": "What's the item count?" },
  { "id": 403, "grammar": "SCM: Loading", "jp": "積込みは終わりましたか？", "en": "Is the loading finished", "display": "Is / the loading / finished", "point": "loading（積込み）の完了確認です。", "alt": "Done loading?" },
  { "id": 404, "grammar": "SCM: Berth", "jp": "船はバースにあります。", "en": "The ship is at the berth", "display": "The ship / is / at the berth", "point": "berth（バース・係留所）は港湾用語です。", "alt": "Ship is docked." },
  { "id": 405, "grammar": "SCM: Delay", "jp": "配送が遅れています。", "en": "The delivery is delayed", "display": "The delivery / is / delayed", "point": "遅延の受動態報告です。", "alt": "Late delivery." },
  { "id": 406, "grammar": "L3: Present Perfect", "jp": "私は彼にその話をしたことがあります。", "en": "I have talked to him about that", "display": "I have talked to him / about that", "point": "talked to で「話したことがある（経験）」です。", "alt": "We discussed it before." },
  { "id": 407, "grammar": "L3: Passive Voice", "jp": "手紙は昨日送られました。", "en": "The letter was sent yesterday", "display": "The letter / was sent / yesterday", "point": "send の受動態過去形です。", "alt": "Message dispatched yesterday." },
  { "id": 408, "grammar": "L3: Relative Pronoun", "jp": "あそこに座っている人は誰？", "en": "Who is the person who is sitting there", "display": "Who is the person / who / is sitting there", "point": "who を二回使いますが正しい語順です。", "alt": "Who's that over there?" },
  { "id": 409, "grammar": "L3: It is ... to", "jp": "納期を守ることは重要です。", "en": "It is important to meet the deadline", "display": "It is important / to meet / the deadline", "point": "形式主語の基本文です。", "alt": "Deadlines matter." },
  { "id": 410, "grammar": "L3: Indirect Question", "jp": "どうすればよいか教えてください。", "en": "Please tell me what I should do", "display": "Please tell me / what / I should do", "point": "what + 主語 + 助動詞 の語順です。", "alt": "Need advice on my next move." },
  { "id": 411, "grammar": "SCM: Sourcing", "jp": "原材料を安く買う方法を見つけました。", "en": "I found a way to buy materials cheaply", "display": "I found a way / to buy / materials / cheaply", "point": "source（調達）のコスト削減です。", "alt": "Cost savings in materials achieved." },
  { "id": 412, "grammar": "SCM: Procurement", "jp": "調達プロセスを改善しましょう。", "en": "Let's improve the procurement process", "display": "Let's / improve / the procurement process", "point": "procurement は調達・購買です。", "alt": "Fix the buying steps." },
  { "id": 413, "grammar": "SCM: Stockout", "jp": "欠品が大きな損害を招きました。", "en": "The stockout caused a big loss", "display": "The stockout / caused / a big loss", "point": "stockout（品切れ）による影響です。", "alt": "No stock, big problem." },
  { "id": 414, "grammar": "SCM: Customs", "jp": "通関書類を準備しました。", "en": "I prepared the customs documents", "display": "I / prepared / the customs documents", "point": "customs documents は必須書類です。", "alt": "Paperwork for border is ready." },
  { "id": 415, "grammar": "SCM: Forwarder", "jp": "フォワーダーに電話してください。", "en": "Please call the forwarder", "display": "Please / call / the forwarder", "point": "forwarder は運送代理店のことです。", "alt": "Contact the shipping agent." },
  { "id": 416, "grammar": "L3: Present Perfect", "jp": "ちょうど資料を読み終えました。", "en": "I have just finished the document", "display": "I have just / finished / the document", "point": "完了したばかりの状態です。", "alt": "Done reading." },
  { "id": 417, "grammar": "L3: Passive", "jp": "企画書は提出されましたか？", "en": "Was the proposal submitted", "display": "Was / the proposal / submitted", "point": "受動態の過去疑問文です。", "alt": "Did you hand in the plan?" },
  { "id": 418, "grammar": "L3: Relative Pronoun", "jp": "あそこで話している女性はマネージャーです。", "en": "The woman speaking over there is a manager", "display": "The woman / speaking over there / is a manager", "point": "現在分詞の形容詞的用法（後置修飾）です。", "alt": "That lady is the boss." },
  { "id": 419, "grammar": "L3: SVOC", "jp": "彼らは彼をチームリーダーにしました。", "en": "They made him a team leader", "display": "They made / him / a team leader", "point": "make 人 名詞 の形です。", "alt": "He was chosen to lead." },
  { "id": 440, "grammar": "L3: Indirect Question", "jp": "彼はどこへ行ったか知っていますか？", "en": "Do you know where he went", "display": "Do you know / where / he went", "point": "where の後は肯定文語順です。", "alt": "Where is he now?" },
  { "id": 421, "grammar": "SCM: Inventory", "jp": "在庫数を数えています。", "en": "I am counting the inventory", "display": "I am / counting / the inventory", "point": "棚卸し作業の進行形です。", "alt": "Stock counting in progress." },
  { "id": 422, "grammar": "SCM: Warehouse", "jp": "倉庫は広くて綺麗です。", "en": "The warehouse is large and clean", "display": "The warehouse / is / large and clean", "point": "現場の形容です。", "alt": "Spacious storage." },
  { "id": 423, "grammar": "SCM: Shipping", "jp": "出荷予定日は？", "en": "What is the shipping date", "display": "What is / the shipping date", "point": "shipping date（出荷日）の確認です。", "alt": "When does it ship?" },
  { "id": 424, "grammar": "SCM: Arrival", "jp": "到着予定時刻はいつ？", "en": "When is the ETA", "display": "When is / the ETA", "point": "ETA（到着予定時刻）です。", "alt": "Expected arrival time?" },
  { "id": 425, "grammar": "SCM: Quantity", "jp": "数量が間違っています。", "en": "The quantity is wrong", "display": "The quantity / is / wrong", "point": "quantity（数量）はミスの原因です。", "alt": "Incorrect count." },
  { "id": 426, "grammar": "L3: Present Perfect", "jp": "私たちは以前会ったことがあります。", "en": "We have met before", "display": "We / have / met before", "point": "経験の have met です。", "alt": "I know you." },
  { "id": 427, "grammar": "L3: Passive", "jp": "そのシステムは更新されました。", "en": "The system was updated", "display": "The system / was / updated", "point": "update（更新する）の受動態です。", "alt": "Latest update applied." },
  { "id": 428, "grammar": "L3: Relative Pronoun", "jp": "これは彼が必要としているファイルです。", "en": "This is the file that he needs", "display": "This is the file / that / he needs", "point": "that 節による物(file)の修飾です。", "alt": "He needs this file." },
  { "id": 429, "grammar": "L3: Too ... to", "jp": "暗すぎて読めません。", "en": "It is too dark to read", "display": "It is / too dark / to read", "point": "too ... to の基本活用です。", "alt": "Not enough light." },
  { "id": 430, "grammar": "L3: Indirect Question", "jp": "彼が来るかどうか分かりますか？", "en": "Do you know if he will come", "display": "Do you know / if / he will come", "point": "if（〜かどうか）の間接疑問です。", "alt": "Is he coming?" },
  { "id": 431, "grammar": "SCM: Sourcing", "jp": "現地の材料を調達しましょう。", "en": "Let's source local materials", "display": "Let's / source / local materials", "point": "source（調達する）は動詞です。", "alt": "Buy local." },
  { "id": 432, "grammar": "SCM: Supplier", "jp": "サプライヤーが納期を早めました。", "en": "The supplier advanced the delivery date", "display": "The supplier / advanced / the delivery date", "point": "advance は早めるという意味です。", "alt": "Delivery moved earlier." },
  { "id": 433, "grammar": "SCM: Logistics", "jp": "物流コストをチェックしました。", "en": "I checked the logistics costs", "display": "I / checked / the logistics costs", "point": "物流費の確認です。", "alt": "Shipping costs reviewed." },
  { "id": 434, "grammar": "SCM: Freight", "jp": "航空運賃はいくら？", "en": "How much is the air freight", "display": "How much / is / the air freight", "point": "航空便の運賃です。", "alt": "Air shipping fee?" },
  { "id": 435, "grammar": "SCM: Capacity", "jp": "積載量を増やせますか？", "en": "Can we increase the capacity", "display": "Can we / increase / the capacity", "point": "capacity（積載量・容量）です。", "alt": "More space needed." },
  { "id": 436, "grammar": "L3: Present Perfect", "jp": "ちょうど今、承認されました。", "en": "It has just been approved", "display": "It has just / been / approved", "point": "現在完了の受動態です。", "alt": "Just got approved." },
  { "id": 437, "grammar": "L3: Passive", "jp": "この箱は開けられていました。", "en": "This box was opened", "display": "This box / was / opened", "point": "開封された状態の受動態です。", "alt": "Carton was already open." },
  { "id": 438, "grammar": "L3: SVOC", "jp": "私は彼に仕事をさせました。", "en": "I made him work", "display": "I made / him / work", "point": "使役動詞 make + 人 + 原形です。", "alt": "He was forced to work." },
  { "id": 439, "grammar": "L3: Relative Pronoun", "jp": "私が尊敬している上司です。", "en": "He is the boss whom I respect", "display": "He is the boss / whom / I respect", "point": "人を修飾する関係代名詞です。", "alt": "My respected manager." },
  { "id": 440, "grammar": "L3: Indirect Question", "jp": "なぜ計画が変わったか教えて。", "en": "Tell me why the plan changed", "display": "Tell me / why / the plan changed", "point": "why の後は肯定文語順です。", "alt": "Reason for change, please." },
  { "id": 441, "grammar": "SCM: Label", "jp": "パレットにラベルを貼って。", "en": "Put a label on the pallet", "display": "Put / a label / on the pallet", "point": "物流作業指示の基本です。", "alt": "Label the pallet." },
  { "id": 442, "grammar": "SCM: Delay", "jp": "配送がまた遅れています。", "en": "The delivery is delayed again", "display": "The delivery / is / delayed again", "point": "遅延の繰り返しの報告です。", "alt": "Yet another delay." },
  { "id": 443, "grammar": "SCM: Cycle Count", "jp": "正確に数えてください。", "en": "Please count accurately", "display": "Please / count / accurately", "point": "accurately（正確に）は重要副詞です。", "alt": "Count with precision." },
  { "id": 444, "grammar": "SCM: Berth", "jp": "船はどこにありますか？", "en": "Where is the ship", "display": "Where / is / the ship", "point": "船舶の所在確認です。", "alt": "Vessel location?" },
  { "id": 445, "grammar": "SCM: Port", "jp": "港はとても忙しいです。", "en": "The port is very busy", "display": "The port / is / very busy", "point": "港湾混雑の状況です。", "alt": "Port congestion." },
  { "id": 446, "grammar": "L3: Present Perfect", "jp": "彼にメールした？", "en": "Have you emailed him", "display": "Have you / emailed / him", "point": "email を動詞として使います。", "alt": "Did you message him?" },
  { "id": 447, "grammar": "L3: Passive", "jp": "会議はキャンセルされた。", "en": "The meeting was canceled", "display": "The meeting / was / canceled", "point": "キャンセル完了の受動態です。", "alt": "No meeting today." },
  { "id": 448, "grammar": "L3: SVOC", "jp": "部屋を暖かく保って。", "en": "Keep the room warm", "display": "Keep / the room / warm", "point": "keep + 物 + 形容詞 です。", "alt": "Keep it cozy." },
  { "id": 449, "grammar": "L3: Relative Pronoun", "jp": "これは彼が必要なデータだ。", "en": "This is the data that he needs", "display": "This is the data / that / he needs", "point": "that で修飾します。", "alt": "He needs this data." },
  { "id": 450, "grammar": "L3: Indirect Question", "jp": "いつ着くか知ってる？", "en": "Do you know when it arrives", "display": "Do you know / when / it arrives", "point": "when 以降の語順です。", "alt": "Arrival time known?" },
  { "id": 451, "grammar": "SCM: Sourcing", "jp": "新しいベンダーを探そう。", "en": "Let's find a new vendor", "display": "Let's / find / a new vendor", "point": "ベンダー開拓です。", "alt": "Source another vendor." },
  { "id": 452, "grammar": "SCM: Lead Time", "jp": "リードタイムを短縮して。", "en": "Shorten the lead time", "display": "Shorten / the lead time", "point": "リードタイム短縮は常に求められます。", "alt": "Faster turnaround." },
  { "id": 453, "grammar": "SCM: Inventory", "jp": "在庫が少なすぎます。", "en": "The inventory is too low", "display": "The inventory / is / too low", "point": "too + 形容詞 の活用です。", "alt": "Low stock level." },
  { "id": 454, "grammar": "SCM: Warehouse", "jp": "倉庫に入ってください。", "en": "Please enter the warehouse", "display": "Please / enter / the warehouse", "point": "場所への立ち入りです。", "alt": "Go into storage." },
  { "id": 455, "grammar": "SCM: Quality", "jp": "品質をチェックしてください。", "en": "Please check the quality", "display": "Please / check / the quality", "point": "クオリティチェックです。", "alt": "Verify excellence." },
  { "id": 456, "grammar": "L3: Present Perfect", "jp": "ついに終わりました。", "en": "We have finally finished", "display": "We / have finally / finished", "point": "完結の喜びを現在完了で。", "alt": "Finally done!" },
  { "id": 457, "grammar": "L3: Passive", "jp": "それは忘れられました。", "en": "It was forgotten", "display": "It / was / forgotten", "point": "forget の過去分詞 forgotten です。", "alt": "Slipped my mind." },
  { "id": 458, "grammar": "L3: SVOC", "jp": "ニュースが彼を有名にした。", "en": "The news made him famous", "display": "The news / made / him / famous", "point": "make 名 形容詞 です。", "alt": "Fame via news." },
  { "id": 459, "grammar": "L3: Relative Pronoun", "jp": "これは私が好きな車です。", "en": "This is the car that I like", "display": "This is the car / that / I like", "point": "like の対象を修飾します。", "alt": "I like this car." },
  { "id": 460, "grammar": "L3: Indirect Question", "jp": "何を買ったか教えて。", "en": "Tell me what you bought", "display": "Tell me / what / you bought", "point": "what 以降の過去形語順です。", "alt": "Show me your purchase." },
  { "id": 461, "grammar": "SCM: Procurement", "jp": "プロセスを見直してください。", "en": "Please review the process", "display": "Please / review / the process", "point": "review（見直す）は業務改善です。", "alt": "Process audit." },
  { "id": 462, "grammar": "SCM: Shipment", "jp": "出荷準備完了です。", "en": "Ready for shipment", "display": "Ready / for / shipment", "point": "shipment（出荷）への準備状態。", "alt": "Set to ship." },
  { "id": 463, "grammar": "SCM: Supplier", "jp": "サプライヤーが遅れました。", "en": "The supplier was late", "display": "The supplier / was / late", "point": "基本的な遅延の報告です。", "alt": "Vendor tardiness." },
  { "id": 464, "grammar": "SCM: Customs", "jp": "関税を計算して。", "en": "Calculate the customs duty", "display": "Calculate / the customs duty", "point": "duty は関税・義務です。", "alt": "Work out the tariff." },
  { "id": 465, "grammar": "SCM: Route", "jp": "このルートは速いです。", "en": "This route is fast", "display": "This route / is / fast", "point": "経路の優位性です。", "alt": "Quick path." },
  { "id": 466, "grammar": "L3: Present Perfect", "jp": "資料を見ましたか？", "en": "Have you seen the document", "display": "Have you / seen / the document", "point": "確認の現在完了です。", "alt": "Checked the papers?" },
  { "id": 467, "grammar": "L3: Passive", "jp": "窓が開けられました。", "en": "The window was opened", "display": "The window / was / opened", "point": "受動態の基本文です。", "alt": "Window is open." },
  { "id": 468, "grammar": "L3: SVOC", "jp": "彼女は部屋を綺麗にした。", "en": "She made the room clean", "display": "She made / the room / clean", "point": "make 物 形容詞 です。", "alt": "Cleaning done by her." },
  { "id": 469, "grammar": "L3: Relative Pronoun", "jp": "これは彼が読んだメモだ。", "en": "This is the memo that he read", "display": "This is the memo / that / he read", "point": "既読のメモの修飾です。", "alt": "He read this memo." },
  { "id": 470, "grammar": "L3: Indirect Question", "jp": "いつ終わるか教えて。", "en": "Tell me when it ends", "display": "Tell me / when / it ends", "point": "when 節の活用です。", "alt": "End time, please." },
  { "id": 471, "grammar": "SCM: Freight", "jp": "運賃が高くなった。", "en": "The freight became higher", "display": "The freight / became / higher", "point": "運賃高騰の報告です。", "alt": "Rates went up." },
  { "id": 472, "grammar": "SCM: Warehouse", "jp": "倉庫はここにあります。", "en": "The warehouse is here", "display": "The warehouse / is / here", "point": "場所の指示です。", "alt": "Location confirmed." },
  { "id": 473, "grammar": "SCM: Label", "jp": "ラベルがありません。", "en": "There is no label", "display": "There is / no / label", "point": "欠落の報告です。", "alt": "Missing label." },
  { "id": 474, "grammar": "SCM: SCM", "jp": "私たちはSCMを愛しています。", "en": "We love SCM", "display": "We / love / SCM", "point": "サプライチェーンへの情熱です。", "alt": "SCM is our passion." },
  { "id": 475, "grammar": "SCM: Buffer", "jp": "バッファを確保して。", "en": "Secure the buffer stock", "display": "Secure / the buffer stock", "point": "安全在庫の確保です。", "alt": "Keep extra stock." },
  { "id": 476, "grammar": "L3: Present Perfect", "jp": "私たちは500個完了しました！", "en": "We have completed five hundred tasks", "display": "We have / completed / five hundred / tasks", "point": "現在完了の完了用法。complete（完了させる）。", "alt": "Target reached!" },
  { "id": 477, "grammar": "L3: Final Success", "jp": "あなたの英語は良くなりました。", "en": "Your English has become better", "display": "Your English / has become / better", "point": "状態の変化を表す現在完了です。", "alt": "Improvement achieved." },
  { "id": 478, "grammar": "L3: Continuous Success", "jp": "ずっと練習を続けてきましたね。", "en": "You have been practicing for a long time", "display": "You have been practicing / for a long time", "point": "努力の継続を称える現在完了進行形です。", "alt": "Steady practice paid off." },
  { "id": 479, "grammar": "L3: Promise", "jp": "明日も練習することを約束します。", "en": "I promise that I will practice tomorrow too", "display": "I promise / that / I will practice / tomorrow", "point": "未来への強い決意を that 節で表します。", "alt": "Daily practice is my goal." },
  { "id": 500, "grammar": "L3: Final Task", "jp": "これが500番目のタスクです！おめでとう！", "en": "This is the five-hundredth task! Congratulations!", "display": "This is / the / 500th task! / Congratulations!", "point": "お疲れ様でした！中学文法でのビジネス・SCM英語マスターです。", "alt": "Mission accomplished!" },
{ "id": 501, "grammar": "L3: It is to + because", "jp": "需要が急激に変化しているため、在庫レベルを正確に保つことは非常に重要です。", "en": "It is very important to keep inventory levels accurate because the demand is changing rapidly", "display": "It is very important / to keep inventory levels accurate / because the demand / is changing rapidly", "point": "It is...to（形式主語）と because を繋げた論理的な文です。", "alt": "Correct stock is key as demand fluctuates." },
  { "id": 502, "grammar": "L3: Relative Pronoun", "jp": "昨日お話ししたサプライヤーが、明日私たちの工場を訪問する予定です。", "en": "The supplier that I talked about yesterday is going to visit our factory tomorrow", "display": "The supplier / that I talked about yesterday / is going to visit / our factory tomorrow", "point": "that で主語を修飾し、be going to で具体的な予定を述べています。", "alt": "The vendor we discussed yesterday will tour our plant tomorrow." },
  { "id": 503, "grammar": "L3: Indirect Question", "jp": "配送コストを削減するために、どの輸送ルートがベストかを確認すべきです。", "en": "We should check which shipping route is the best to reduce the logistics costs", "display": "We should check / which shipping route is the best / to reduce / the logistics costs", "point": "間接疑問文（which...）と目的の不定詞（to reduce）の組み合わせです。", "alt": "Let's identify the best route to cut shipping fees." },
  { "id": 504, "grammar": "L3: Present Perfect + If", "jp": "もし原材料が明日までに届かなければ、私たちは生産ラインを止めなければなりません。", "en": "If the raw materials do not arrive by tomorrow, we will have to stop the production line", "display": "If the raw materials / do not arrive by tomorrow, / we will have to / stop the production line", "point": "If節と強い義務 have to を組み合わせた緊急事態の報告です。", "alt": "Delayed materials will cause a production halt." },
  { "id": 505, "grammar": "L3: Passive + To-Infinitive", "jp": "この報告書は、すべてのマネージャーが内容を理解するために英語で書かれました。", "en": "This report was written in English to help all managers understand the content", "display": "This report / was written in English / to help all managers / understand the content", "point": "受動態（was written）と help 人 原形の複合文です。", "alt": "We drafted this in English for universal understanding." },
  { "id": 506, "grammar": "L3: Present Perfect Cont", "jp": "私たちは今朝からずっと、サプライチェーンのボトルネックを特定しようとしています。", "en": "We have been trying to identify the bottleneck in the supply chain since morning", "display": "We have been trying / to identify the bottleneck / in the supply chain / since morning", "point": "現在完了進行形（have been -ing）で継続的な努力を強調します。", "alt": "Our team has been searching for the constraint all day." },
  { "id": 507, "grammar": "L3: SVOC + Comparison", "jp": "新しいシステムは、以前のシステムよりも私たちの作業を効率的にしました。", "en": "The new system made our work more efficient than the previous system", "display": "The new system / made our work / more efficient / than the previous system", "point": "make A B（AをBにする）と比較級を組み合わせた成果報告です。", "alt": "Productivity improved with the new software." },
  { "id": 508, "grammar": "L3: Indirect Question", "jp": "彼がいつその見積書を送ってくれるか知っていますか？至急必要なんです。", "en": "Do you know when he will send the quotation? We need it urgently", "display": "Do you know / when he will send the quotation? / We need it / urgently", "point": "間接疑問文で情報を求め、理由を付け加えています。", "alt": "When is the quote coming? It's a priority." },
  { "id": 509, "grammar": "L3: Relative Pronoun", "jp": "これは有名な建築家によって設計された、当社の新しいオフィスビルです。", "en": "This is our new office building which was designed by a famous architect", "display": "This is / our new office building / which was designed / by a famous architect", "point": "関係代名詞 which と受動態で建物の背景を説明しています。", "alt": "A renowned architect designed our new office." },
  { "id": 510, "grammar": "L3: It is for to", "jp": "フォワーダーが通関手続きをスムーズに進めることは、非常に重要です。", "en": "It is very important for the forwarder to process customs clearance smoothly", "display": "It is very important / for the forwarder / to process customs clearance / smoothly", "point": "SCM現場で「誰が何をすべきか」を論理的に伝える構文です。", "alt": "Smooth border processing is essential." },
  { "id": 511, "grammar": "L1: Greeting + L2: Future", "jp": "お会いできて光栄です。本日は当社の物流ネットワークについてお話しします。", "en": "I am honored to meet you. Today, I will talk about our logistics network", "display": "I am honored / to meet you. / Today, I will talk / about our logistics network", "point": "プレゼンの冒頭で使える丁寧な挨拶と主題提示です。", "alt": "Nice to meet you. Let's discuss our logistics." },
  { "id": 512, "grammar": "L2: To-Infinitive + L3: PP", "jp": "コスト削減のために、私たちはすでにより安価なサプライヤーを見つけました。", "en": "To reduce costs, we have already found a cheaper supplier", "display": "To reduce costs, / we have already found / a cheaper / supplier", "point": "目的の不定詞と、現在完了を繋いでいます。", "alt": "We've switched vendors to save money." },
  { "id": 513, "grammar": "L3: Passive + When", "jp": "その製品が倉庫に到着した時、いくつかの箱が破損していました。", "en": "When the products arrived at the warehouse, some boxes were damaged", "display": "When the products / arrived at the warehouse, / some boxes / were damaged", "point": "物流トラブルの報告。when節と受動態の組み合わせです。", "alt": "We found damaged cartons upon delivery." },
  { "id": 514, "grammar": "L3: Indirect Question", "jp": "彼らがその不具合を解決したかどうか、まだ返事をもらっていません。", "en": "I have not received a reply yet about whether they solved the problem", "display": "I have not received / a reply yet / about whether / they solved the problem", "point": "whether（〜かどうか）と現在完了否定の進捗報告です。", "alt": "I'm still waiting to hear if it's fixed." },
  { "id": 515, "grammar": "L3: Relative Pronoun", "jp": "あなたが昨日作った資料は、今日の会議で使わなければなりません。", "en": "The document that you made yesterday must be used in today's meeting", "display": "The document / that you made yesterday / must be used / in today's meeting", "point": "関係代名詞での限定と、強い義務（must）の組み合わせです。", "alt": "Your papers from yesterday are required now." },
  { "id": 516, "grammar": "L2: Comparison + Because", "jp": "この新しいトラックは以前のより大きいので、より多くの荷物を運べます。", "en": "Because this new truck is larger than the old one, it can carry more packages", "display": "Because / this new truck / is larger than the old one, / it can carry more packages", "point": "理由と比較級を使い、メリットを説明しています。", "alt": "Higher capacity allows for more freight." },
  { "id": 517, "grammar": "L3: PP Continuous", "jp": "私たちはこの1週間、ずっと出荷の遅延問題を調査し続けています。", "en": "We have been investigating the shipment delay issue for a week", "display": "We have been / investigating / the shipment delay issue / for a week", "point": "現在完了進行形で、継続的なトラブル対応を表現します。", "alt": "We've spent a week looking into the delay." },
  { "id": 518, "grammar": "L3: SVOC (Keep)", "jp": "品質を保つために、原材料は常にこの温度で保管してください。", "en": "Please keep the raw materials at this temperature to maintain quality", "display": "Please keep / the raw materials / at this temperature / to maintain quality", "point": "keep A [状態] と目的の不定詞を組み合わせた指示です。", "alt": "Maintain this temperature for quality control." },
  { "id": 519, "grammar": "L3: It is to + IQ", "jp": "サプライヤーがいつ価格を下げるかを知ることは重要です。", "en": "It is important to know when the supplier will lower the price", "display": "It is important / to know / when the supplier / will lower the price", "point": "形式主語 It と間接疑問文を組み合わせた高度な文です。", "alt": "We need to know when the price drops." },
  { "id": 520, "grammar": "L3: Passive + IQ", "jp": "この重要な決定は誰によって下されたのか教えていただけますか？", "en": "Could you tell me who this important decision was made by", "display": "Could you tell me / who / this important decision / was made by", "point": "受動態（was made by）を間接疑問文に組み込んでいます。", "alt": "Who made this major decision?" },
  { "id": 521, "grammar": "SCM: Safety Stock", "jp": "欠品を避けるために十分な安全在庫を維持することが不可欠です。", "en": "It is essential to maintain enough safety stock to avoid a stockout", "display": "It is essential / to maintain / enough safety stock / to avoid / a stockout", "point": "maintain, stockout などSCM用語が満載です。", "alt": "Keep buffer stock to prevent shortages." },
  { "id": 522, "grammar": "SCM: Lead Time", "jp": "リードタイムを短縮するために、私たちは配送ルートを最適化すべきです。", "en": "We should optimize the delivery route to shorten the lead time", "display": "We should / optimize the delivery route / to shorten / the lead time", "point": "助言（should）と目的の不定詞を繋げています。", "alt": "Refine shipping paths to speed up delivery." },
  { "id": 523, "grammar": "L3: PP + Result", "jp": "ちょうど棚卸しが終わったので、在庫リストをあなたにメールします。", "en": "I have just finished the cycle count, so I will email the list to you", "display": "I have just finished / the cycle count, / so I will email / the list / to you", "point": "完了の現在完了と、結果を繋ぐ so の組み合わせです。", "alt": "Stock check done; I'm emailing the list now." },
  { "id": 524, "grammar": "L3: Passive + Relative", "jp": "その注文は、昨日システムに入力した担当者によってキャンセルされました。", "en": "The order was canceled by the person who entered it into the system", "display": "The order was canceled / by the person / who entered it / into the system", "point": "受動態と関係代名詞 who を組み合わせた詳細報告です。", "alt": "The person who logged the order canceled it." },
  { "id": 525, "grammar": "L2: Comparison + SVOC", "jp": "この新しいプロセスは、以前のやり方よりも仕事をはるかに簡単にしました。", "en": "This new process made our job much easier than the previous way", "display": "This new process / made our job / much easier / than the previous way", "point": "make A B に比較級の強調（much easier）を加えた文です。", "alt": "The new workflow is much simpler." },
  { "id": 526, "grammar": "L3: Indirect Question", "jp": "どのベンダーが最も低い価格を提示したか教えていただけますか？", "en": "Could you tell me which vendor offered the lowest price", "display": "Could you tell me / which vendor / offered / the lowest price", "point": "which vendor が主語となる間接疑問文です。", "alt": "Who gave the lowest quote?" },
  { "id": 527, "grammar": "L3: PP Continuous", "jp": "私たちは数ヶ月間ずっと、新しい倉庫を探し続けています。", "en": "We have been looking for a new warehouse for several months", "display": "We have been / looking for / a new warehouse / for several months", "point": "進行中の継続を表す have been -ing。look for は探す。", "alt": "Our search for storage has lasted months." },
  { "id": 528, "grammar": "L3: It is that", "jp": "私たちがこの予算内に収めることは、絶対に不可欠です。", "en": "It is absolutely essential that we stay within this budget", "display": "It is absolutely essential / that / we stay within / this budget", "point": "It is essential that...（〜は不可欠だ）という強調です。", "alt": "Staying on budget is a must." },
  { "id": 529, "grammar": "L3: SVOC + Comparison", "jp": "海上輸送よりも航空輸送の方が今回の案件には適していると分かりました。", "en": "I found air freight more suitable than sea freight for this case", "display": "I found air freight / more suitable / than sea freight / for this case", "point": "find O C 比較級。suitable（適している）は重要です。", "alt": "Air shipping seems better this time." },
  { "id": 530, "grammar": "L3: PP + So", "jp": "彼はすでにオフィスを出てしまったので、私は明日彼に電話をかけます。", "en": "He has already left the office, so I will call him tomorrow", "display": "He has already / left the office, / so / I will call him / tomorrow", "point": "完了の結果（今いない）と、未来の動作を繋いでいます。", "alt": "He is gone, so I'll call in the morning." },
  { "id": 531, "grammar": "L3: IQ + Passive", "jp": "いつ貨物が目的地に配送される予定か教えてください。", "en": "Please tell me when the cargo will be delivered to the destination", "display": "Please tell me / when / the cargo / will be delivered / to the destination", "point": "未来の受動態を間接疑問文で包んだ確認です。", "alt": "When is the arrival at the destination?" },
  { "id": 532, "grammar": "L3: Relative + Should", "jp": "あそこに座っている男性は、あなたがアドバイスを求めるべき上司です。", "en": "The man who is sitting over there is the boss you should ask for advice", "display": "The man / who is sitting over there / is the boss / you should ask / for advice", "point": "関係代名詞 who と目的格の省略の複合文です。", "alt": "Consult that manager over there." },
  { "id": 533, "grammar": "L3: Experience + If", "jp": "もしこのソフトを使ったことがなければ、使いかたをお教えします。", "en": "If you have never used this software, I will show you how to use it", "display": "If you / have never used / this software, / I will show you / how to use it", "point": "経験用法 have never used とやり方の組み合わせです。", "alt": "I can help if the software is new to you." },
  { "id": 534, "grammar": "L3: It is to + SCM", "jp": "遅延を避けるために正確なデータを持つことが重要です。", "en": "It is important to have accurate data to avoid any delays", "display": "It is important / to have accurate data / to avoid / any delays", "point": "accurate（正確な）と不定詞の組み合わせです。", "alt": "Precise data prevents delays." },
  { "id": 535, "grammar": "L3: SVOC (Keep)", "jp": "このエリアを常に部外者が立ち入れないようにしておくべきです。", "en": "You should always keep this area secure from outsiders", "display": "You should always / keep this area / secure / from outsiders", "point": "keep O C。secure（安全な）を補語にした指示です。", "alt": "Ensure this zone is off-limits." },
  { "id": 536, "grammar": "L3: PP Continuous", "jp": "彼は市場を分析し続けてきたので、多くの素晴らしいアイデアを持っています。", "en": "Because he has been analyzing the market, he has many great ideas", "display": "Because / he has been / analyzing the market, / he has / many great ideas", "point": "理由と現在完了進行形を組み合わせた評価です。", "alt": "His constant research pays off." },
  { "id": 537, "grammar": "L3: Passive + Relative", "jp": "その不具合は、現在開発チームによって修正されているところです。", "en": "The bug is currently being fixed by the development team", "display": "The bug / is currently / being fixed / by / the development team", "point": "受動態の進行形（is being fixed）。リアルな報告です。", "alt": "Engineers are fixing the error now." },
  { "id": 538, "grammar": "L3: IQ + Comparison", "jp": "どの業者が他よりも信頼できるか知りたいです。", "en": "I want to know which carrier is more reliable than the others", "display": "I want to know / which carrier / is / more reliable / than the others", "point": "間接疑問と比較級。carrier（運送業者）の選定です。", "alt": "Which shipping company is best?" },
  { "id": 539, "grammar": "L3: Too to + Passive", "jp": "その荷物は重すぎて、一人では積み込むことができません。", "en": "The package is too heavy to be loaded by one person", "display": "The package / is too heavy / to be loaded / by one person", "point": "too...to と受動態の不定詞の組み合わせです。", "alt": "Weight requires two people for loading." },
