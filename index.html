<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biz English Construction 500 - Integrated Edition</title>
    <style>
        :root {
            --deep-blue: #003468; --purpose-blue: #0082C4; --parker-gold: #FDB913;
            --clean-green: #7BBA3E; --charcoal: #1C2B39; --white: #FFFFFF;
            --soft-gray: #F1F5F9; --border-light: #E2E8F0;
        }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #F8FAFC; color: var(--charcoal); margin: 0; display: flex; justify-content: center; }
        .app-container { max-width: 650px; width: 100%; background: var(--white); min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        
        /* Header & Progress Bar */
        .app-header { background: var(--deep-blue); color: white; padding: 15px 25px; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--parker-gold); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .progress-container { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--parker-gold); width: 0%; transition: width 0.3s; }
        
        .grammar-tag { background: var(--parker-gold); color: var(--deep-blue); padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .status-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; margin-left: 10px; font-weight: bold;}
        .status-learned { background: var(--clean-green); color: white; }
        .status-not-learned { background: #94a3b8; color: white; }

        .content { padding: 25px; flex-grow: 1; }
        .section-title { font-size: 0.7rem; font-weight: 700; color: var(--purpose-blue); text-transform: uppercase; margin-bottom: 6px; display: block; }
        .question-card { background: var(--soft-gray); border-left: 6px solid var(--deep-blue); padding: 25px; border-radius: 8px; margin-bottom: 20px; position: relative; }
        
        .learned-btn { position: absolute; top: 10px; right: 10px; background: white; border: 1px solid var(--border-light); padding: 5px 10px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
        .learned-btn.active { background: var(--clean-green); color: white; border-color: var(--clean-green); }

        .jp-text { font-size: 1.4rem; font-weight: 700; color: var(--deep-blue); line-height: 1.5; padding-right: 60px; }
        .result-area { border-top: 2px solid var(--soft-gray); padding-top: 15px; animation: fadeIn 0.4s ease-out; }
        .model-answer { font-size: 1.3rem; font-weight: 700; color: var(--deep-blue); margin-bottom: 10px; }
        .slash { color: #CBD5E1; margin: 0 3px; font-weight: normal;}
        
        .advice-card { background: #F0F7FF; border-radius: 12px; padding: 20px; border: 1px solid var(--border-light); margin-top: 20px; }
        
        .controls { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        button { border: none; padding: 16px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .btn-primary { background: var(--deep-blue); color: white; width: 100%; }
        .btn-recording { background: #E74C3C; color: white; animation: pulse 1.5s infinite; }
        .btn-next { background: var(--clean-green); color: white; }
        .btn-random { background: var(--white); color: var(--deep-blue); border: 1px solid var(--deep-blue); padding: 8px; font-size: 0.8rem; width: 120px;}
        .btn-random.active { background: var(--deep-blue); color: white; }
        
        .btn-outline { background: white; border: 1px solid var(--border-light); color: var(--purpose-blue); width: auto; padding: 8px 12px; font-size: 0.8rem; margin-right: 5px; margin-bottom: 5px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="app-container">
    <header class="app-header">
        <div class="header-top">
            <div>
                <span id="grammar-label" class="grammar-tag">Grammar</span>
                <span id="learned-status" class="status-badge">Not Learned</span>
            </div>
            <div id="learned-count" style="font-size: 0.8rem;">Learned: 0 / 0</div>
        </div>
        <div class="progress-container">
            <div id="progress-bar" class="progress-fill"></div>
        </div>
    </header>

    <div class="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span class="section-title">Japanese Prompt</span>
            <button id="random-toggle" class="btn-random">Random: OFF</button>
        </div>
        
        <div class="question-card">
            <button id="mark-learned-btn" class="learned-btn">Check as Learned</button>
            <div id="jp-text" class="jp-text">Ready to Start...</div>
        </div>

        <div id="result-area" class="result-area hidden">
            <span class="section-title">Your Transcription</span>
            <div id="user-speech" style="font-style: italic; margin-bottom: 12px; color: var(--charcoal); font-size: 1.1rem; padding: 12px; background: #fff; border-radius: 6px; border: 1px solid var(--border-light);"></div>
            <span class="section-title">Model Answer</span>
            <div id="model-answer" class="model-answer"></div>
            <div style="margin-bottom: 15px; display: flex; flex-wrap: wrap;">
                <button class="btn-outline" onclick="playModel(1.0)">🔊 Native</button>
                <button class="btn-outline" onclick="playModel(0.7)">🐢 Slow</button>
                <button class="btn-outline" id="replay-btn">▶ My Voice</button>
            </div>
            <div class="advice-card">
                <div id="feedback-en" style="font-weight:bold; color:#1E40AF; margin-bottom:5px; font-size: 1.1rem;"></div>
                <div id="feedback-jp" style="font-size:0.9rem; margin-bottom:10px; color:#334155; font-weight: 500;"></div>
                <div style="font-size:0.85rem; border-top: 1px solid #D1E9FF; padding-top: 8px;">
                    <strong>Grammar Note:</strong> <span id="grammar-point-text"></span>
                </div>
                <div style="font-size:0.85rem; margin-top: 5px;">
                    <strong>Alternative:</strong> <span id="alt-text" style="color:var(--purpose-blue); font-weight: bold;"></span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="record-btn" class="btn-primary">🎤 Click to Speak</button>
            <button id="next-btn" class="btn-next hidden">Next Task ➔</button>
            <button id="retry-btn" style="background:#f1f5f9; color:#475569;" class="hidden">Try Again</button>
        </div>
    </div>
</div>

<script>
    // --- 統合されたデータセクション ---
    const rawData = [[
  { "grammar": "L1: Present Simple", "jp": "私は物流部で働いています。", "en": "I work in the logistics department", "display": "I work / in the logistics department", "keywords": ["logistics"], "point": "logistics は「物流・ロジスティクス」を指す不可欠な単語です。", "alt": "I am in the supply chain team." },
  { "grammar": "L1: Be verb", "jp": "これは私たちのメインの倉庫です。", "en": "This is our main warehouse", "display": "This is / our main / warehouse", "keywords": ["warehouse"], "point": "warehouse は「倉庫」です。storehouse とも言います。", "alt": "This building serves as our primary warehouse." },
  { "grammar": "L1: Have", "jp": "100個の在庫があります。", "en": "We have one hundred items in stock", "display": "We have / one hundred items / in stock", "keywords": ["in stock"], "point": "in stock で「在庫がある」という状態を表します。", "alt": "There are 100 units available now." },
  { "grammar": "L1: Present Continuous", "jp": "トラックが今、到着しています。", "en": "The truck is arriving now", "display": "The truck / is arriving / now", "keywords": ["arriving"], "point": "配送状況をリアルタイムで伝える現在進行形です。", "alt": "The delivery truck has just pulled in." },
  { "grammar": "L1: Imperative", "jp": "在庫リストを確認してください。", "en": "Please check the inventory list", "display": "Please check / the inventory list", "keywords": ["inventory"], "point": "inventory は「在庫・棚卸し」を指す最重要単語です。", "alt": "Could you review the stock records?" },
  { "grammar": "L1: Can", "jp": "出荷を早めることはできますか？", "en": "Can you speed up the shipment", "display": "Can you / speed up / the shipment", "keywords": ["shipment"], "point": "shipment は「出荷・積み荷」です。speed up は「加速させる」。", "alt": "Is it possible to expedite the delivery?" },
  { "grammar": "L1: Wh-Quest (When)", "jp": "荷物はいつ届きますか？", "en": "When will the package arrive", "display": "When / will the package / arrive", "keywords": ["package"], "point": "package は「小包・荷物」です。", "alt": "What is the expected delivery date?" },
  { "grammar": "L1: Wh-Quest (How many)", "jp": "いくつパレットが必要ですか？", "en": "How many pallets do you need", "display": "How many pallets / do you need", "keywords": ["pallets"], "point": "pallet（パレット）は物流現場の基本単位です。", "alt": "What quantity of pallets is required?" },
  { "grammar": "L1: Past Simple", "jp": "昨日、原材料を注文しました。", "en": "I ordered raw materials yesterday", "display": "I ordered / raw materials / yesterday", "keywords": ["raw materials"], "point": "raw materials で「原材料」です。", "alt": "The order for materials was placed yesterday." },
  { "grammar": "L1: Negative", "jp": "まだ部品が足りません。", "en": "We do not have enough parts", "display": "We / do not have / enough parts", "keywords": ["enough parts"], "point: "parts は「部品」です。enough で「十分な」量を表します。", "alt": "We are currently short on components." },
  { "grammar": "L2: Future (will)", "jp": "明日、出荷案内を送ります。", "en": "I will send a shipping notice tomorrow", "display": "I will send / a shipping notice / tomorrow", "keywords": ["shipping notice"], "point": "shipping notice（出荷案内通知）はASNとも呼ばれます。", "alt": "You will receive the tracking info tomorrow." },
  { "grammar": "L2: Future (be going to)", "jp": "新しいサプライヤーを訪問する予定です。", "en": "I am going to visit a new supplier", "display": "I am going to visit / a new supplier", "keywords": ["supplier"], "point": "supplier は「供給業者・仕入先」です。", "alt": "I have a meeting scheduled with a new vendor." },
  { "grammar": "L2: Must", "jp": "リードタイムを短縮しなければなりません。", "en": "We must shorten the lead time", "display": "We must / shorten / the lead time", "keywords": ["lead time"], "point": "lead time（発注から納品までの時間）はSCMの鍵です。", "alt": "It is necessary to reduce our turnaround time." },
  { "grammar": "L2: Have to", "jp": "私たちは在庫を減らす必要があります。", "en": "We have to reduce the inventory", "display": "We have to / reduce / the inventory", "keywords": ["reduce"], "point": "reduce は「削減する」。在庫削減はSCMの大きな目標です。", "alt": "We need to cut down on our stock levels." },
  { "grammar": "L2: Should", "jp": "安全在庫を持つべきです。", "en": "We should have safety stock", "display": "We should have / safety stock", "keywords": ["safety stock"], "point": "safety stock（安全在庫）は欠品を防ぐための予備です。", "alt": "Maintaining a buffer stock is recommended." },
  { "grammar": "L2: To-Infinitive (Purpose)", "jp": "コストを抑えるためにルートを変更しました。", "en": "We changed the route to save costs", "display": "We changed the route / to save costs", "keywords": ["route"], "point": "to save costs で「コストを節約するために」という目的です。", "alt": "The route was optimized for cost efficiency." },
  { "grammar": "L2: Gerund", "jp": "海上輸送を使うことは安いです。", "en": "Using ocean freight is cheap", "display": "Using ocean freight / is / cheap", "keywords": ["ocean freight"], "point": "ocean freight は「海上運賃・海上輸送」です。", "alt": "Sea shipping is a cost-effective option." },
  { "grammar": "L2: Comparison", "jp": "航空便は船便より速いです。", "en": "Air freight is faster than sea freight", "display": "Air freight / is faster than / sea freight", "keywords": ["air freight"], "point": "air freight（航空輸送）と sea/ocean freight の比較です。", "alt": "Shipping by air saves more time than by sea." },
  { "grammar": "L2: Superlative", "jp": "これが最も安い輸送手段です。", "en": "This is the cheapest mode of transport", "display": "This is / the cheapest / mode of transport", "keywords": ["mode of transport"], "point": "mode of transport で「輸送手段（船、陸、空など）」です。", "alt": "This is the most economical way to ship." },
  { "grammar": "L2: Conjunction (If)", "jp": "もし部品が遅れたら、生産を止めます。", "en": "If the parts are late, we will stop production", "display": "If the parts are late, / we will / stop production", "keywords": ["production"], "point": "stop production（生産停止）は避けたい事態の一つです。", "alt": "Delayed components will halt the assembly line." },
  { "grammar": "L2: Give A B", "jp": "私に見積もりをください。", "en": "Please give me a quotation", "display": "Please give me / a quotation", "keywords": ["quotation"], "point": "quotation（見積もり）はビジネスの基本語です。", "alt": "Could you provide a price estimate?" },
  { "grammar": "L2: Look forward to -ing", "jp": "新製品の出荷を楽しみにしています。", "en": "I am looking forward to shipping the new product", "display": "I am looking forward to / shipping / the new product", "keywords": ["shipping"], "point": "to は前置詞なので後ろは shipping になります。", "alt": "We are excited about the product rollout." },
  { "grammar": "L2: Modal (Don't have to)", "jp": "この箱を検品する必要はありません。", "en": "You do not have to inspect this box", "display": "You do not have to / inspect / this box", "keywords": ["inspect"], "point": "inspect（検査・検品する）は品質管理の重要語です。", "alt": "Inspection for this specific carton is not required." },
  { "grammar": "L2: Adverbs", "jp": "原材料を定期的に購入します。", "en": "We buy raw materials regularly", "display": "We buy / raw materials / regularly", "keywords": ["regularly"], "point": "regularly（定期的に）は購買サイクルで使われます。", "alt": "We have a recurring order for materials." },
  { "grammar": "L2: Comparison (More)", "jp": "このサプライヤーの方が信頼できます。", "en": "This supplier is more reliable", "display": "This supplier / is / more reliable", "keywords": ["reliable"], "point": "reliable（信頼できる）は取引先選定の基準です。", "alt": "We prefer this vendor due to their reliability." },
  { "grammar": "L3: Present Perfect (Completion)", "jp": "貨物はちょうど港に到着しました。", "en": "The cargo has just arrived at the port", "display": "The cargo / has just / arrived / at the port", "keywords": ["cargo", "port"], "point": "cargo（貨物）と port（港）の組み合わせです。", "alt": "The shipment has just reached the harbor." },
  { "grammar": "L3: Present Perfect (Experience)", "jp": "私たちは以前、そのロジスティクス業者を使ったことがあります。", "en": "We have used that logistics provider before", "display": "We have used / that logistics provider / before", "keywords": ["provider"], "point": "logistics provider（物流業者）は3PLなどを指すこともあります。", "alt": "We have prior experience with that carrier." },
  { "grammar": "L3: Present Perfect (Duration)", "jp": "2週間、欠品状態が続いています。", "en": "We have been out of stock for two weeks", "display": "We have been / out of stock / for two weeks", "keywords": ["out of stock"], "point": "out of stock で「在庫切れ（欠品）」の状態です。", "alt": "The item has been unavailable for the past 14 days." },
  { "grammar": "L3: Passive Voice", "jp": "在庫はこのソフトウェアで管理されています。", "en": "Inventory is managed by this software", "display": "Inventory / is managed / by this software", "keywords": ["managed"], "point": "受動態を使って「〜によって管理されている」と表現します。", "alt": "This system controls our stock levels." },
  { "grammar": "L3: Passive Voice (Future)", "jp": "荷物は明日配達される予定です。", "en": "The package will be delivered tomorrow", "display": "The package / will be delivered / tomorrow", "keywords": ["delivered"], "point": "deliver（配達する）の受動態未来形です。", "alt": "You can expect the delivery tomorrow." },
  { "grammar": "L3: It is ... to", "jp": "需要を予測することは難しいです。", "en": "It is difficult to forecast demand", "display": "It is difficult / to forecast / demand", "keywords": ["forecast", "demand"], "point": "forecast（予測する）と demand（需要）はSCMの核心です。", "alt": "Predicting customer demand is a challenge." },
  { "grammar": "L3: Indirect Question", "jp": "いつ部品が届くか知っていますか？", "en": "Do you know when the parts will arrive", "display": "Do you know / when / the parts / will arrive", "keywords": ["parts"], "point": "間接疑問文の語順（when the parts will arrive）に注意。", "alt": "Can you confirm the arrival time of the components?" },
  { "grammar": "L3: Relative Pronoun", "jp": "これは私たちが必要としている材料です。", "en": "This is the material that we need", "display": "This is the material / (that) / we need", "keywords": ["material"], "point": "material（材料・資材）を関係代名詞で説明します。", "alt": "Here are the supplies we require." },
  { "grammar": "L3: SVOC (Keep)", "jp": "倉庫を常に整理しておいてください。", "en": "Please keep the warehouse organized at all times", "display": "Please keep / the warehouse / organized / at all times", "keywords": ["organized"], "point": "keep A organized で「Aを整理された状態にする」。", "alt": "Make sure the storage area stays tidy." },
  { "grammar": "L3: Too ... to", "jp": "この注文は大きすぎて、1日で処理できません。", "en": "This order is too big to process in one day", "display": "This order / is / too big / to process / in one day", "keywords": ["process"], "point": "process は「（注文や書類を）処理する」という動詞です。", "alt": "The order volume exceeds our daily capacity." },
  { "grammar": "L3: Tell A to do", "jp": "彼に荷物を積み込むように言ってください。", "en": "Please tell him to load the cargo", "display": "Please tell him / to load / the cargo", "keywords": ["load"], "point": "load は「（荷物を）積み込む」、unload は「下ろす」です。", "alt": "Ask him to start the loading process." },
  { "grammar": "L3: Make A B", "jp": "遅延が私たちを困らせました。", "en": "The delay made us troubled", "display": "The delay / made us / troubled", "keywords": ["delay"], "point: "delay（遅延）はSCMで最も避けたい言葉の一つです。", "alt": "The late shipment caused us a lot of problems." },
  { "grammar": "L3: Present Perfect Continuous", "jp": "1時間ずっと、在庫を数えています。", "en": "I have been counting the stock for an hour", "display": "I have been counting / the stock / for an hour", "keywords": ["counting"], "point": "棚卸しなどで「ずっと数え続けている」継続を強調します。", "alt": "I've been doing a physical stock check for an hour." },
  { "grammar": "L3: Passive (Past)", "jp": "コンテナは昨夜、積み下ろされました。", "en": "The container was unloaded last night", "display": "The container / was unloaded / last night", "keywords": ["unloaded"], "point": "unload（荷を下ろす）の受動態です。", "alt": "Workers emptied the container yesterday evening." },
  { "grammar": "L3: Relative Pronoun (Who)", "jp": "配送を担当している人を知っていますか？", "en": "Do you know the person who is in charge of delivery", "display": "Do you know the person / who is / in charge of delivery", "keywords": ["in charge of"], "point": "be in charge of ... で「〜の担当である」です。", "alt": "Who is the contact person for shipping?" },
  { "grammar": "L3: Indirect Question", "jp": "どこに追跡番号があるか教えてください。", "en": "Please tell me where the tracking number is", "display": "Please tell me / where / the tracking number / is", "keywords": ["tracking number"], "point": "tracking number（追跡番号）の場所を尋ねる間接疑問文です。", "alt": "Where can I find the shipment ID?" },
  { "grammar": "L3: Enough to", "jp": "このトラックはすべての荷物を運ぶのに十分な大きさです。", "en": "This truck is large enough to carry all the packages", "display": "This truck / is / large enough / to carry / all the packages", "keywords": ["large enough"], "point": "積載量（capacity）を確認する時に使います。", "alt": "The vehicle's capacity is sufficient for this load." },
  { "grammar": "L3: Relative Pronoun (Whose)", "jp": "私は、配送コストが非常に低い会社を選びました。", "en": "I chose a company whose shipping cost is very low", "display": "I chose a company / whose / shipping cost / is / very low", "keywords": ["shipping cost"], "point": "shipping cost（送料）を所有格の関係代名詞で繋ぎます。", "alt": "We went with the carrier offering the lowest rates." },
  { "grammar": "L3: Passive (Present)", "jp": "原材料は世界中から調達されています。", "en": "Raw materials are sourced from all over the world", "display": "Raw materials / are sourced / from / all over the world", "keywords": ["sourced"], "point": "source（調達する・仕入れる）はSCMの最重要動詞の一つです。", "alt": "We procure our supplies globally." },
  { "grammar": "L3: SVOC (Find)", "jp": "リードタイムを短縮するのが難しいと分かりました。", "en": "I found it difficult to shorten the lead time", "display": "I found it / difficult / to shorten / the lead time", "keywords": ["shorten"], "point": "it を仮目的語にした高度な第5文型です。", "alt": "Reducing lead times has proven to be a challenge." },
  { "grammar": "L3: Tell A to Do (Neg)", "jp": "彼にまだ船を出さないように言ってください。", "en": "Please tell him not to sail the ship yet", "display": "Please tell him / not to sail / the ship / yet", "keywords": ["not to"], "point": "sail は動詞で「船を出す・航行する」。", "alt": "Ask them to hold the vessel's departure." },
  { "grammar": "L3: Present Perfect (Completion)", "jp": "私たちはようやくサプライチェーンを最適化しました。", "en": "We have finally optimized the supply chain", "display": "We have finally / optimized / the supply chain", "keywords": ["optimized"], "point": "optimize（最適化する）はSCMで頻出する動詞です。", "alt": "Our supply chain efficiency has been improved at last." },
  { "grammar": "L3: Tag Question", "jp": "在庫は十分ですよね？", "en": "The inventory is sufficient, isn't it", "display": "The inventory / is sufficient, / isn't it", "keywords": ["sufficient"], "point": "sufficient（十分な）を使った付加疑問文です。", "alt": "We have enough stock on hand, right?" },
  { "grammar": "L3: Passive (Neg)", "jp": "その注文はまだ出荷されていません。", "en": "The order is not shipped yet", "display": "The order / is not / shipped / yet", "keywords": ["shipped"], "point": "ship（出荷する）の受動態否定形です。", "alt": "The goods are still waiting for dispatch." },
  { "grammar": "L3: Help A do", "jp": "このアプリがあなたの在庫管理を助けます。", "en": "This app helps you manage your inventory", "display": "This app / helps you / manage / your inventory", "keywords": ["manage"], "point": "manage inventory（在庫を管理する）はSCMの基本機能です。", "alt": "Our software simplifies stock management for you." }
]
        // --- LEVEL 1 ---
        { "grammar": "Be verb (am)", "jp": "私は新しいプロジェクトマネージャーです。", "en": "I am the new project manager", "display": "I am / the new / project manager", "keywords": ["project", "manager"], "point": "I am ...（私は〜です）は自己紹介の基本です。", "alt": "My name is Tanaka, and I am the manager." },
        { "grammar": "Present Simple", "jp": "私はIT企業で働いています。", "en": "I work for an IT company", "display": "I work / for an IT company", "keywords": ["work for"], "point": "所属は work for を使います。場所を指す場合は work at です。", "alt": "I am an employee of an IT firm." },
        { "grammar": "L1: Present Continuous", "jp": "彼は今、電話に出ています。", "en": "He is on the phone now", "display": "He is / on the phone / now", "keywords": ["phone"], "point": "is on the phone で『電話中』です。Talking on the phone の略です。", "alt": "He is currently on another line." },
        { "grammar": "L1: Past Simple", "jp": "昨日、見積もりを送りました。", "en": "I sent the estimate yesterday", "display": "I sent / the estimate / yesterday", "keywords": ["sent", "estimate"], "point": "sendの過去形は不規則変化の sent です。", "alt": "The quote was sent yesterday." },
        { "grammar": "L1: Can", "jp": "明日お会いできますか？", "en": "Can I meet you tomorrow", "display": "Can I / meet you / tomorrow", "keywords": ["meet", "tomorrow"], "point": "許可や可能性を問う can です。Could I... だとより丁寧です。", "alt": "Would it be possible to meet tomorrow?" },

        // --- LEVEL 2 ---
        { "grammar": "L2: Future (will)", "jp": "後ほどメールを差し上げます。", "en": "I will email you later", "display": "I will / email you / later", "keywords": ["will", "later"], "point": "その場で決めた意思には will を使います。", "alt": "I'll send you an email shortly." },
        { "grammar": "L2: Must", "jp": "5時までにこれを終わらせなければなりません。", "en": "I must finish this by five", "display": "I must / finish / this / by five", "keywords": ["must", "by"], "point": "強い義務は must。by は期限（〜までに）を表します。", "alt": "I need to complete this by 5 PM." },
        { "grammar": "L2: To-Infinitive", "jp": "あなたと話すためにここに来ました。", "en": "I came here to talk with you", "display": "I came here / to talk / with you", "keywords": ["to talk"], "point": "「〜するために」という目的を表す不定詞の副詞的用法です。", "alt": "I am here specifically to discuss things with you." },
        { "grammar": "L2: Comparison", "jp": "このコンピュータはあのコンピュータより新しいです。", "en": "This computer is newer than that one", "display": "This computer / is newer / than / that one", "keywords": ["newer than"], "point": "短い形容詞の比較級は後ろに er を付けます。", "alt": "This is a more recent model." },

        // --- LEVEL 3 ---
        { "grammar": "L3: Present Perfect", "jp": "ちょうどそのメールを送ったところです。", "en": "I have just sent the email", "display": "I have just / sent / the email", "keywords": ["just", "sent"], "point": "have just + 過去分詞で「たった今〜し終えた」という完了を表します。", "alt": "I've just dispatched the message." },
        { "grammar": "L3: Indirect Question", "jp": "彼がどこにいるか知っていますか？", "en": "Do you know where he is", "display": "Do you know / where / he is", "keywords": ["where he is"], "point": "間接疑問文では、疑問詞の後の語順は「主語＋動詞」になります。", "alt": "Could you tell me his current location?" },
        { "grammar": "L3: Relative Pronoun", "jp": "私は英語を話せるスタッフを探しています。", "en": "I am looking for a staff member who can speak English", "display": "I am looking for / a staff member / who / can speak English", "keywords": ["who"], "point": "関係代名詞 who を使って直前の「人」を詳しく説明します。", "alt": "I need an English-speaking employee." },

        // --- SCM DOMAIN ---
        { "grammar": "L1: Logistics", "jp": "私は物流部で働いています。", "en": "I work in the logistics department", "display": "I work / in the logistics department", "keywords": ["logistics"], "point": "logistics は「物流」を指す不可欠な単語です。", "alt": "I am in the supply chain team." },
        { "grammar": "L2: SCM", "jp": "私たちは在庫を減らす必要があります。", "en": "We have to reduce the inventory", "display": "We have to / reduce / the inventory", "keywords": ["reduce", "inventory"], "point": "inventory（在庫）の削減はSCMの大きな目標です。", "alt": "We need to cut down on our stock levels." },
        { "grammar": "L3: SCM", "jp": "いつ部品が届くか知っていますか？", "en": "Do you know when the parts will arrive", "display": "Do you know / when / the parts / will arrive", "keywords": ["parts", "arrive"], "point": "間接疑問文の語順（when the parts will arrive）に注意しましょう。", "alt": "Can you confirm the arrival time of the components?" },
        { "grammar": "L3: SCM", "jp": "在庫はこのソフトウェアで管理されています。", "en": "Inventory is managed by this software", "display": "Inventory / is managed / by this software", "keywords": ["managed by"], "point": "受動態を使って「〜によって管理されている」と表現します。", "alt": "This system controls our stock levels." }
        
        // ※ 追加の350問も同様にここへ追加できます。
    ];

    // --- ロジックセクション ---
    const questions = rawData.map((item, index) => ({ ...item, id: index + 1 }));

    let learnedList = JSON.parse(localStorage.getItem('learned_biz_eng_v3')) || [];
    let currentIndex = 0;
    let isRandomMode = false;
    let recognition, mediaRecorder, audioChunks = [], audioUrl, synth = window.speechSynthesis, stream;

    function saveLearnedStatus() {
        localStorage.setItem('learned_biz_eng_v3', JSON.stringify(learnedList));
        updateOverallProgress();
    }

    function updateOverallProgress() {
        const count = learnedList.length;
        document.getElementById('learned-count').innerText = `Learned: ${count} / ${questions.length}`;
        const percent = questions.length > 0 ? (count / questions.length) * 100 : 0;
        document.getElementById('progress-bar').style.width = percent + '%';
    }

    function init() {
        if (questions.length === 0) return;
        const q = questions[currentIndex];
        const isLearned = learnedList.includes(q.id);
        
        document.getElementById('grammar-label').innerText = q.grammar;
        document.getElementById('jp-text').innerText = q.jp;
        
        const statusBadge = document.getElementById('learned-status');
        const markBtn = document.getElementById('mark-learned-btn');
        
        if (isLearned) {
            statusBadge.innerText = "Learned ✅";
            statusBadge.className = "status-badge status-learned";
            markBtn.innerText = "Learned ✅";
            markBtn.classList.add('active');
        } else {
            statusBadge.innerText = "Not Learned";
            statusBadge.className = "status-badge status-not-learned";
            markBtn.innerText = "Mark as Learned";
            markBtn.classList.remove('active');
        }

        document.getElementById('result-area').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('retry-btn').classList.add('hidden');
        document.getElementById('record-btn').classList.remove('hidden');
        document.getElementById('record-btn').innerText = "🎤 Click to Speak";
        document.getElementById('record-btn').className = "btn-primary";
        
        updateOverallProgress();
    }

    document.getElementById('mark-learned-btn').onclick = function() {
        const q = questions[currentIndex];
        if (learnedList.includes(q.id)) {
            learnedList = learnedList.filter(id => id !== q.id);
        } else {
            learnedList.push(q.id);
        }
        saveLearnedStatus();
        init();
    };

    document.getElementById('random-toggle').onclick = function() {
        isRandomMode = !isRandomMode;
        this.innerText = isRandomMode ? "Random: ON" : "Random: OFF";
        this.classList.toggle('active');
    };

    async function setupAudio() {
        if (!stream) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => { audioUrl = URL.createObjectURL(new Blob(audioChunks, { type: 'audio/wav' })); };
            } catch (e) { alert("Microphone access is required."); return; }
        }
        if (!recognition) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'en-US';
            recognition.onresult = (e) => {
                const speech = e.results[0][0].transcript;
                if(mediaRecorder.state === "recording") mediaRecorder.stop();
                showResult(speech);
            };
            recognition.onerror = () => {
                document.getElementById('record-btn').innerText = "🎤 Mic Error (Retry)";
                document.getElementById('record-btn').className = "btn-primary";
            };
        }
    }

    document.getElementById('record-btn').onclick = async () => {
        await setupAudio();
        if(!stream) return;
        audioChunks = [];
        try {
            recognition.start();
            mediaRecorder.start();
            document.getElementById('record-btn').innerText = "Listening...";
            document.getElementById('record-btn').className = "btn-primary btn-recording";
        } catch(e) {}
    };

    function showResult(userSpeech) {
        const q = questions[currentIndex];
        document.getElementById('user-speech').innerText = `"${userSpeech}"`;
        document.getElementById('model-answer').innerHTML = q.display.split(' / ').map(p => p + `<span class="slash">/</span>`).join('');
        
        const cleanUser = userSpeech.toLowerCase().replace(/[.\s,?]/g,'');
        const cleanCorrect = q.en.toLowerCase().replace(/[.\s,?]/g,'');
        const isPerfect = cleanUser === cleanCorrect;

        document.getElementById('feedback-en').innerText = isPerfect ? "Perfect! Well done." : "Good try! Almost there.";
        document.getElementById('feedback-jp').innerText = isPerfect ? "完璧な回答です！このまま定着させましょう。" : "惜しい！キーワードを確認して再挑戦しましょう。";
        document.getElementById('grammar-point-text').innerText = q.point;
        document.getElementById('alt-text').innerText = q.alt || "N/A";

        document.getElementById('result-area').classList.remove('hidden');
        document.getElementById('record-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('retry-btn').classList.remove('hidden');
        playModel(1.0);
    }

    window.playModel = (speed) => {
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(questions[currentIndex].en);
        utter.lang = 'en-US'; utter.rate = speed;
        synth.speak(utter);
    };

    document.getElementById('replay-btn').onclick = () => { if(audioUrl) new Audio(audioUrl).play(); };
    
    document.getElementById('next-btn').onclick = () => {
        if (isRandomMode) {
            currentIndex = Math.floor(Math.random() * questions.length);
        } else {
            currentIndex = (currentIndex + 1) % questions.length;
        }
        init();
    };

    document.getElementById('retry-btn').onclick = init;
    init();
</script>
</body>
