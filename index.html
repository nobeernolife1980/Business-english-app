<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biz English 200 Pro</title>
    <style>
        :root { --deep-blue: #003468; --purpose-blue: #0082C4; --parker-gold: #FDB913; --clean-green: #7BBA3E; --charcoal: #1C2B39; --white: #FFFFFF; --soft-gray: #F1F5F9; --border-light: #E2E8F0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #F8FAFC; color: var(--charcoal); margin: 0; display: flex; justify-content: center; }
        .app-container { max-width: 650px; width: 100%; background: var(--white); min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .app-header { background: var(--deep-blue); color: white; padding: 15px 25px; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--parker-gold); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .progress-container { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--parker-gold); width: 0%; transition: width 0.3s; }
        .grammar-tag { background: var(--parker-gold); color: var(--deep-blue); padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .status-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; margin-left: 10px; font-weight: bold;}
        .content { padding: 25px; flex-grow: 1; }
        .section-title { font-size: 0.7rem; font-weight: 700; color: var(--purpose-blue); text-transform: uppercase; margin-bottom: 6px; display: block; }
        .question-card { background: var(--soft-gray); border-left: 6px solid var(--deep-blue); padding: 25px; border-radius: 8px; margin-bottom: 20px; position: relative; }
        .learned-btn { position: absolute; top: 10px; right: 10px; background: white; border: 1px solid var(--border-light); padding: 5px 10px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; }
        .learned-btn.active { background: var(--clean-green); color: white; border-color: var(--clean-green); }
        .jp-text { font-size: 1.4rem; font-weight: 700; color: var(--deep-blue); line-height: 1.5; padding-right: 60px; min-height: 3em; }
        .result-area { border-top: 2px solid var(--soft-gray); padding-top: 15px; animation: fadeIn 0.4s ease-out; }
        .model-answer { font-size: 1.3rem; font-weight: 700; color: var(--deep-blue); margin-bottom: 10px; }
        .slash { color: #CBD5E1; margin: 0 3px; font-weight: normal;}
        .advice-card { background: #F0F7FF; border-radius: 12px; padding: 20px; border: 1px solid var(--border-light); margin-top: 20px; }
        button { border: none; padding: 16px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .btn-primary { background: var(--deep-blue); color: white; width: 100%; }
        .btn-recording { background: #E74C3C !important; color: white; animation: pulse 1.5s infinite; }
        .btn-next { background: var(--clean-green); color: white; }
        .btn-random { background: var(--white); color: var(--deep-blue); border: 1px solid var(--deep-blue); padding: 8px; font-size: 0.8rem; width: 120px;}
        .btn-random.active { background: var(--deep-blue); color: white; }
        .btn-outline { background: white; border: 1px solid var(--border-light); color: var(--purpose-blue); width: auto; padding: 8px 12px; font-size: 0.8rem; margin-right: 5px; margin-bottom: 5px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="app-container">
    <header class="app-header">
        <div class="header-top">
            <div><span id="grammar-label" class="grammar-tag">Grammar</span><span id="learned-status" class="status-badge">Not Learned</span></div>
            <div id="learned-count" style="font-size: 0.8rem;">Learned: 0 / 200</div>
        </div>
        <div class="progress-container"><div id="progress-bar" class="progress-fill"></div></div>
    </header>
    <div class="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span class="section-title">Japanese Prompt</span>
            <button id="random-toggle" class="btn-random">Random: OFF</button>
        </div>
        <div class="question-card">
            <button id="mark-learned-btn" class="learned-btn">Mark as Learned</button>
            <div id="jp-text" class="jp-text">Loading...</div>
        </div>
        <div id="result-area" class="result-area hidden">
            <span class="section-title">Result</span>
            <div id="user-speech" style="font-style: italic; margin-bottom: 12px; color: var(--charcoal); font-size: 1.1rem; padding: 12px; background: #fff; border-radius: 6px; border: 1px solid var(--border-light);"></div>
            <span class="section-title">Model Answer</span>
            <div id="model-answer" class="model-answer"></div>
            <div style="margin-bottom: 15px; display: flex; flex-wrap: wrap;">
                <button class="btn-outline" onclick="playModel(1.0)">🔊 Native</button>
                <button class="btn-outline" onclick="playModel(0.7)">🐢 Slow</button>
                <button class="btn-outline" id="replay-btn">▶ My Voice</button>
            </div>
            <div class="advice-card">
                <div id="feedback-jp" style="font-size:0.9rem; margin-bottom:10px; color:#334155; font-weight: 500;"></div>
                <div id="grammar-point-text" style="font-size:0.85rem; border-top: 1px solid #D1E9FF; padding-top: 8px;"></div>
            </div>
        </div>
        <div class="controls">
            <button id="record-btn" class="btn-primary">🎤 Click to Speak</button>
            <button id="next-btn" class="btn-next hidden">Next Task ➔</button>
            <button id="retry-btn" style="background:#f1f5f9; color:#475569;" class="hidden">Try Again</button>
        </div>
    </div>
</div>

<script>

        { "grammar": "L2: Should", "jp": "もっと早く出発すべきだ。", "en": "We should leave earlier", "display": "We / should / leave earlier", "point": "出発のアドバイス。" },
        { "grammar": "L2: To-Infinitive", "jp": "寝る時間だよ。", "en": "It is time to sleep", "display": "It is / time / to sleep", "point": "形容詞的用法の定番。" },
        { "grammar": "L2: Comparison", "jp": "彼はあなたほど背が高くない。", "en": "He is not as tall as you", "display": "He is / not as tall / as you", "point": "as as の否定。" },
        { "grammar": "L2: Superlative", "jp": "これがベストな方法だ。", "en": "This is the best way", "display": "This is / the / best way", "point": "最良の選択。" },
        { "grammar": "L2: Gerund", "jp": "泳ぐのをやめて。", "en": "Stop swimming", "display": "Stop / swimming", "point": "stop -ing。" },
        { "grammar": "L2: Future", "jp": "雨は降らないだろう。", "en": "It will not rain", "display": "It / will / not rain", "point": "否定の未来予測。" },
        { "grammar": "L2: If", "jp": "もしよければどうぞ。", "en": "Take it if you like", "display": "Take it / if / you like", "point": "条件の提示。" },
        { "grammar": "SCM: Vendor", "jp": "ベンダーに連絡して。", "en": "Contact the vendor", "display": "Contact / the vendor", "point": "業者の呼び方。" },
        { "grammar": "SCM: SKU", "jp": "SKUはいくつ？", "en": "How many SKUs are there", "display": "How many / SKUs / are there", "point": "管理単位の確認。" },
        { "grammar": "L2: Must", "jp": "これを読まなければならない。", "en": "I must read this", "display": "I / must / read this", "point": "強い意志の義務。" },
        { "grammar": "L2: Should", "jp": "座るべきだよ。", "en": "You should sit down", "display": "You / should / sit down", "point": "提案の表現。" },
        { "grammar": "L2: Comparison", "jp": "リンゴはオレンジより赤い。", "en": "Apples are redder than oranges", "display": "Apples / are / redder than oranges", "point": "単純比較。" },
        { "grammar": "L2: Superlative", "jp": "彼は学校で一番有名だ。", "en": "He is the most famous in school", "display": "He is / the / most famous", "point": "学内の最上級。" },
        { "grammar": "L2: Conjunction", "jp": "準備ができたら呼んで。", "en": "Call me when you are ready", "display": "Call me / when / you are ready", "point": "時機を待つ表現。" },
        { "grammar": "L2: Because", "jp": "疲れてるので寝ます。", "en": "I sleep because I am tired", "display": "I sleep / because / I am tired", "point": "理由の接続。" },
        { "grammar": "L2: Comparison", "jp": "猫は犬より小さい。", "en": "Cats are smaller than dogs", "display": "Cats / are / smaller than dogs", "point": "サイズの比較。" },
        { "grammar": "L2: Superlative", "jp": "これが私の最高のアイデアだ。", "en": "This is my best idea", "display": "This / is / my best idea", "point": "自己最高の表現。" }
    ];

    // --- ロジック ---
    const questions = rawData.map((q, i) => ({ ...q, id: i + 1 }));
    let learnedList = JSON.parse(localStorage.getItem('learned_v200_final')) || [];
    let currentIndex = 0;
    let isRandomMode = false;
    let recognition, mediaRecorder, audioChunks = [], audioUrl, synth = window.speechSynthesis, stream;

    function updateOverallProgress() {
        const count = learnedList.length;
        const total = 200; // この後の追加を考慮して200に設定
        document.getElementById('learned-count').innerText = `Learned: ${count} / ${total}`;
        document.getElementById('progress-bar').style.width = (count / total * 100) + '%';
    }

    function init() {
        if (questions.length === 0) return;
        const q = questions[currentIndex];
        const isLearned = learnedList.includes(q.id);
        document.getElementById('grammar-label').innerText = q.grammar;
        document.getElementById('jp-text').innerText = q.jp;
        const statusBadge = document.getElementById('learned-status');
        const markBtn = document.getElementById('mark-learned-btn');
        if (isLearned) {
            statusBadge.innerText = "Learned ✅"; statusBadge.className = "status-badge status-learned";
            markBtn.innerText = "Learned ✅"; markBtn.classList.add('active');
        } else {
            statusBadge.innerText = "Not Learned"; statusBadge.className = "status-badge status-not-learned";
            markBtn.innerText = "Check as Learned"; markBtn.classList.remove('active');
        }
        document.getElementById('result-area').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('retry-btn').classList.add('hidden');
        document.getElementById('record-btn').classList.remove('hidden');
        document.getElementById('record-btn').innerText = "🎤 Click to Speak";
        updateOverallProgress();
    }

    document.getElementById('mark-learned-btn').onclick = function() {
        const q = questions[currentIndex];
        if (learnedList.includes(q.id)) { learnedList = learnedList.filter(id => id !== q.id); } 
        else { learnedList.push(q.id); }
        localStorage.setItem('learned_v200_final', JSON.stringify(learnedList));
        init();
    };

    document.getElementById('random-toggle').onclick = function() {
        isRandomMode = !isRandomMode;
        this.innerText = isRandomMode ? "Random: ON" : "Random: OFF";
        this.classList.toggle('active');
    };

    async function setupAudio() {
        if (!stream) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => { audioUrl = URL.createObjectURL(new Blob(audioChunks, { type: 'audio/wav' })); };
            } catch (e) { alert("Mic error."); return; }
        }
        if (!recognition) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec(); recognition.lang = 'en-US';
            recognition.onresult = (e) => {
                if(mediaRecorder.state === "recording") mediaRecorder.stop();
                showResult(e.results[0][0].transcript);
            };
        }
    }

    document.getElementById('record-btn').onclick = async () => {
        await setupAudio(); audioChunks = [];
        try { recognition.start(); mediaRecorder.start();
            document.getElementById('record-btn').innerText = "Listening...";
        } catch(e) {}
    };

    function showResult(userSpeech) {
        const q = questions[currentIndex];
        document.getElementById('user-speech').innerText = `"${userSpeech}"`;
        document.getElementById('model-answer').innerHTML = q.display.split(' / ').map(p => p + `<span class="slash">/</span>`).join('');
        const isPerfect = userSpeech.toLowerCase().replace(/[.\s,?]/g,'') === q.en.toLowerCase().replace(/[.\s,?]/g,'');
        document.getElementById('feedback-jp').innerText = isPerfect ? "Perfect! Well done." : "Good try! Check the answer.";
        document.getElementById('grammar-point-text').innerHTML = `<strong>Note:</strong> ${q.point}<br><strong>Alt:</strong> ${q.alt || "N/A"}`;
        document.getElementById('result-area').classList.remove('hidden');
        document.getElementById('record-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('retry-btn').classList.remove('hidden');
        playModel(1.0);
    }

    window.playModel = (speed) => {
        synth.cancel(); const utter = new SpeechSynthesisUtterance(questions[currentIndex].en);
        utter.lang = 'en-US'; utter.rate = speed; synth.speak(utter);
    };

    document.getElementById('replay-btn').onclick = () => { if(audioUrl) new Audio(audioUrl).play(); };
    document.getElementById('next-btn').onclick = () => {
        if (isRandomMode) { currentIndex = Math.floor(Math.random() * questions.length); } 
        else { currentIndex = (currentIndex + 1) % questions.length; }
        init();
    };
    document.getElementById('retry-btn').onclick = init;
    init();
</script>
</body>
</html>
